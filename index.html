<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbital">
<meta name="theme-color" content="#05060c">
<meta name="description" content="An n-body gravity sandbox. Fling worlds into orbit and watch the maths do the rest.">
<title>Orbital</title>
<style>
  :root{
    --bg:#05060c; --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.12);
    --lip:inset 0 1px 0 rgba(255,255,255,.10);
    --ink:#eaeefb; --dim:#8e97b4; --acc:#7fd4ff; --warm:#ffcf6b;
    --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  body{
    color:var(--ink);
    font:500 14px/1.4 ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
  }
  button{font:inherit;font-weight:600;border:0;background:none;color:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px;}

  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}

  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px)
            calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);}
  .ui > *{pointer-events:auto;}
  /* The spacers exist to push the toolbars apart. They must never take a
     pointer: they cover the whole middle of the screen, which is the sky. */
  .ui > .grow, .ui .grow{pointer-events:none;}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .grow{flex:1;}

  .brand{font-weight:700;font-size:18px;letter-spacing:-.015em;padding:4px 2px;text-shadow:0 2px 12px rgba(0,0,0,.8);}
  .brand b{color:var(--acc);font-weight:700;}

  .btn{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:var(--lip);border-radius:10px;padding:8px 13px;font-size:13px;white-space:nowrap;
    transition:background .12s,transform .08s;}
  .btn:active{transform:translateY(1px);}
  .btn.on{background:var(--ink);color:#0a0c14;}
  .btn.sm{padding:6px 10px;font-size:12px;}
  @media (hover:hover){ .btn:hover{background:var(--panel2);} .btn.on:hover{background:#fff;} }

  .card{background:rgba(10,12,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:var(--lip), 0 10px 30px rgba(0,0,0,.45);border-radius:var(--r);padding:9px;}

  .readout{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap;
    text-shadow:0 1px 8px rgba(0,0,0,.9);}

  /* body picker */
  .bodies{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;}
  .bodies::-webkit-scrollbar{display:none;}
  .bd{flex:0 0 auto;width:74px;background:var(--panel);box-shadow:var(--lip);border-radius:11px;
    padding:8px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .12s,transform .08s;}
  .bd:active{transform:scale(.95);}
  .bd .dot{width:22px;height:22px;border-radius:50%;}
  .bd .nm{font-size:10.5px;color:var(--dim);}
  .bd.on{background:var(--ink);}
  .bd.on .nm{color:#0a0c14;font-weight:700;}
  @media (hover:hover){ .bd:hover{background:var(--panel2);} .bd.on:hover{background:#fff;} }

  .slider{display:flex;align-items:center;gap:9px;padding:5px 12px;min-width:180px;}
  .slider label{font-size:12px;color:var(--dim);white-space:nowrap;}
  input[type=range]{flex:1;min-width:64px;accent-color:var(--acc);background:none;height:22px;}

  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);
    background:rgba(6,8,16,.72);backdrop-filter:blur(10px);padding:8px 16px;border-radius:999px;
    font-size:13px;color:#c6cee6;transition:opacity .5s;pointer-events:none;max-width:90vw;
    text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.5);}
  .hint.gone{opacity:0;}

  /* selected-body inspector */
  .insp{position:fixed;right:calc(env(safe-area-inset-right) + 12px);top:calc(env(safe-area-inset-top) + 60px);
    width:186px;display:none;}
  .insp.on{display:block;}
  .insp h4{margin:0 0 7px;font-size:13px;display:flex;align-items:center;gap:7px;}
  .insp h4 .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;}
  .insp .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);
    font-variant-numeric:tabular-nums;padding:2px 0;}
  .insp .kv b{color:var(--ink);font-weight:600;}
  .insp .acts{display:flex;gap:6px;margin-top:8px;}
  .insp .acts .btn{flex:1;justify-content:center;text-align:center;}

  @media (max-width:820px){ .insp{width:164px;} .brand{font-size:16px;} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <div class="row">
    <div class="brand">Orbit<b>al</b></div>
    <div class="grow"></div>
    <div class="readout" id="stat"></div>
    <button class="btn" id="play" title="Play / pause — Space">Pause</button>
    <button class="btn" id="reset" title="Clear everything — C">Clear</button>
  </div>

  <div class="grow"></div>

  <div class="card insp" id="insp">
    <h4><i class="dot" id="ispDot"></i><span id="ispName">Body</span></h4>
    <div class="kv"><span>Mass</span><b id="ispMass">—</b></div>
    <div class="kv"><span>Speed</span><b id="ispVel">—</b></div>
    <div class="kv"><span>Orbiting</span><b id="ispHost">—</b></div>
    <div class="kv"><span>Period</span><b id="ispPer">—</b></div>
    <div class="acts">
      <button class="btn sm" id="ispFollow">Follow</button>
      <button class="btn sm" id="ispDel">Delete</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:9px">
    <div class="bodies" id="bodies"></div>
  </div>

  <div class="row">
    <div class="card slider">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="60" value="29">
      <span class="readout" id="speedv">1.0&times;</span>
    </div>
    <button class="btn" id="orbitAssist" title="Tap empty space to drop a body straight into a circular orbit">Auto-orbit</button>
    <button class="btn" id="trails" title="Show orbit trails — T">Trails</button>
    <div class="grow"></div>
    <button class="btn sm" data-preset="binary">Binary</button>
    <button class="btn sm" data-preset="solar">Solar</button>
    <button class="btn sm" data-preset="rings">Rings</button>
    <button class="btn sm" data-preset="cluster">Cluster</button>
    <button class="btn sm" id="fit" title="Frame everything — F">Fit</button>
  </div>
</div>

<div class="hint" id="hint">Drag from empty space to fling a world. Two fingers or scroll to zoom.</div>

<script>
(function(){
'use strict';

/* ============================ constants ============================ */
/* G is 1 and the unit system is chosen so that pleasant-looking systems come
   out with round numbers. Distances are "units", masses are relative to a
   small moon, and one simulated second is one second at 1x speed. */
const G = 1;
const SOFT = 2.2;            /* softening length: keeps r -> 0 from exploding */
const MAX_BODIES = 700;
const SUBSTEPS = 4;          /* per rendered frame, for stability at speed */

/* Body classes the palette offers. Radius is derived from mass so that a
   hundred moons really do look like a hundred moons' worth of rock. */
const KINDS = [
  {id:'asteroid', name:'Asteroid', mass:0.35,  color:'#9a9db0', glow:0.15},
  {id:'moon',     name:'Moon',     mass:2.4,   color:'#c8cddd', glow:0.2},
  {id:'planet',   name:'Planet',   mass:18,    color:'#5aa9e6', glow:0.3},
  {id:'giant',    name:'Giant',    mass:120,   color:'#e8a35c', glow:0.42},
  {id:'star',     name:'Star',     mass:1400,  color:'#ffd873', glow:1.15, lum:1},
  {id:'hole',     name:'Black hole',mass:9000, color:'#0a0a12', glow:0,   hole:1}
];
const kindById = id => KINDS.find(k=>k.id===id) || KINDS[2];

const DENSITY = 0.019;                       /* r = (m / (DENSITY))^(1/3) */
const radiusFor = m => Math.max(1.1, Math.cbrt(m/DENSITY)*0.32);

/* ============================ state ============================ */
let bodies = [];
let nextId = 1;
let running = true;
let showTrails = true;
let orbitAssist = true;
let timeScale = 1;
let selected = null;
let following = null;
let simTime = 0;

const cam = {x:0, y:0, zoom:1};

/* ============================ bodies ============================ */
function makeBody(x,y,vx,vy,kind){
  const k = typeof kind==='string' ? kindById(kind) : kind;
  return {
    id: nextId++, x, y, vx, vy,
    m: k.mass, r: radiusFor(k.mass),
    ax:0, ay:0,
    color: k.color, glow: k.glow, lum: k.lum||0, hole: k.hole||0,
    kind: k.id, name: k.name,
    trail: [], flash: 0
  };
}
function addBody(b){
  if(bodies.length >= MAX_BODIES) return null;
  bodies.push(b);
  return b;
}
/* Momentum is conserved, mass adds, and radius follows from the combined mass.
   The survivor keeps the heavier body's identity so a star eating a pebble is
   still a star. */
function merge(a,b){
  const heavy = a.m >= b.m ? a : b;
  const light = heavy === a ? b : a;
  const M = a.m + b.m;
  heavy.x = (a.x*a.m + b.x*b.m)/M;
  heavy.y = (a.y*a.m + b.y*b.m)/M;
  heavy.vx = (a.vx*a.m + b.vx*b.m)/M;
  heavy.vy = (a.vy*a.m + b.vy*b.m)/M;
  heavy.m = M;
  heavy.r = radiusFor(M);
  heavy.flash = Math.min(1, 0.35 + light.m/Math.max(1,M));
  light.dead = true;
  if(selected === light) selected = heavy;
  if(following === light) following = heavy;
  /* A merge is a discontinuity; a trail drawn straight through it lies. */
  heavy.trail.length = 0;
  return heavy;
}

/* ============================ physics ============================ */
/* Velocity Verlet, which is symplectic: orbits hold their shape over long runs
   instead of spiralling out the way plain Euler makes them. Accelerations are
   carried between steps so gravity is evaluated once per step, not twice. */
function accelerate(){
  const n = bodies.length;
  for(let i=0;i<n;i++){ bodies[i].nax = 0; bodies[i].nay = 0; }
  for(let i=0;i<n;i++){
    const a = bodies[i];
    for(let j=i+1;j<n;j++){
      const b = bodies[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const d2 = dx*dx + dy*dy + SOFT*SOFT;
      const inv = 1/Math.sqrt(d2);
      const f = G*inv*inv*inv;          /* G / |r|^3, so f*d gives the vector */
      a.nax += f*dx*b.m;  a.nay += f*dy*b.m;
      b.nax -= f*dx*a.m;  b.nay -= f*dy*a.m;
    }
  }
}
function integrate(dt){
  const n = bodies.length;
  for(let i=0;i<n;i++){
    const b = bodies[i];
    b.x += b.vx*dt + 0.5*b.ax*dt*dt;
    b.y += b.vy*dt + 0.5*b.ay*dt*dt;
  }
  accelerate();
  for(let i=0;i<n;i++){
    const b = bodies[i];
    b.vx += 0.5*(b.ax + b.nax)*dt;
    b.vy += 0.5*(b.ay + b.nay)*dt;
    b.ax = b.nax; b.ay = b.nay;
  }
  collide();
}
function collide(){
  for(let i=0;i<bodies.length;i++){
    const a = bodies[i];
    if(a.dead) continue;
    for(let j=i+1;j<bodies.length;j++){
      const b = bodies[j];
      if(b.dead) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      const rr = a.r + b.r;
      if(dx*dx + dy*dy <= rr*rr) merge(a,b);
    }
  }
  if(bodies.some(b=>b.dead)){
    bodies = bodies.filter(b=>!b.dead);
    /* Stored accelerations refer to a set of bodies that no longer exists. */
    accelerate();
    for(const b of bodies){ b.ax = b.nax; b.ay = b.nay; }
  }
}

/* Trail length is shared out between however many bodies exist, so a thousand
   specks cost about the same to draw as ten planets. */
function trailCap(){ return Math.max(14, Math.min(150, Math.round(3600/Math.max(1,bodies.length)))); }
/* Sampled by distance travelled, not by frame. A frame-sampled trail is a
   different length at every speed setting and vanishes entirely when slow. */
function recordTrails(){
  const cap = trailCap();
  for(const b of bodies){
    const t = b.trail, n = t.length;
    if(n >= 2){
      const dx = b.x-t[n-2], dy = b.y-t[n-1];
      const minD = Math.max(0.7, b.r*0.5);
      if(dx*dx + dy*dy < minD*minD) continue;
    }
    t.push(b.x, b.y);
    while(t.length > cap*2) t.splice(0,2);
  }
}

function step(dt){
  const h = dt/SUBSTEPS;
  for(let s=0;s<SUBSTEPS;s++) integrate(h);
  simTime += dt;
  recordTrails();
  for(const b of bodies) if(b.flash>0) b.flash = Math.max(0, b.flash - dt*1.6);
}

/* ============================ orbital helpers ============================ */
/* The body that dominates the gravitational pull at a point — used for the
   auto-orbit assist and for telling you what a thing is actually orbiting. */
function dominant(x,y,ignore){
  let best=null, bestPull=0;
  for(const b of bodies){
    if(b===ignore || b.dead) continue;
    const dx=b.x-x, dy=b.y-y;
    const pull = b.m/(dx*dx+dy*dy+SOFT*SOFT);
    if(pull>bestPull){ bestPull=pull; best=b; }
  }
  return best;
}
/* Velocity for a circular orbit around host, perpendicular to the radius and
   in whichever direction keeps the existing spin of the system. */
function circularVelocity(x,y,host,sign){
  const dx = x-host.x, dy = y-host.y;
  const r = Math.hypot(dx,dy);
  if(r < 1e-6) return {vx:0, vy:0};
  const v = Math.sqrt(G*host.m/r);
  const s = sign||1;
  return {vx: host.vx + (-dy/r)*v*s, vy: host.vy + (dx/r)*v*s};
}
/* Keplerian period from the vis-viva energy, when the orbit is actually bound. */
function orbitOf(b){
  const host = dominant(b.x, b.y, b);
  if(!host) return null;
  const dx = b.x-host.x, dy = b.y-host.y;
  const r = Math.hypot(dx,dy);
  const rvx = b.vx-host.vx, rvy = b.vy-host.vy;
  const v2 = rvx*rvx + rvy*rvy;
  const mu = G*(host.m + b.m);
  const energy = v2/2 - mu/r;
  if(energy >= 0) return {host, bound:false};
  const a = -mu/(2*energy);
  return {host, bound:true, a, period: 2*Math.PI*Math.sqrt(a*a*a/mu)};
}

/* ============================ camera ============================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);   /* 3x on a Retina iPad is a lot of pixels for no visible gain */
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  seedStars();
}
addEventListener('resize', resize);

const toScreenX = wx => (wx - cam.x)*cam.zoom + W/2;
const toScreenY = wy => (wy - cam.y)*cam.zoom + H/2;
const toWorldX  = sx => (sx - W/2)/cam.zoom + cam.x;
const toWorldY  = sy => (sy - H/2)/cam.zoom + cam.y;

function zoomAt(sx, sy, factor){
  const wx = toWorldX(sx), wy = toWorldY(sy);
  cam.zoom = Math.max(0.012, Math.min(14, cam.zoom*factor));
  cam.x = wx - (sx - W/2)/cam.zoom;
  cam.y = wy - (sy - H/2)/cam.zoom;
}
function fitAll(pad){
  if(!bodies.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const b of bodies){
    x0=Math.min(x0,b.x-b.r); y0=Math.min(y0,b.y-b.r);
    x1=Math.max(x1,b.x+b.r); y1=Math.max(y1,b.y+b.r);
  }
  const w=Math.max(40,x1-x0), h=Math.max(40,y1-y0);
  cam.x=(x0+x1)/2; cam.y=(y0+y1)/2;
  cam.zoom = Math.max(0.012, Math.min(14, Math.min(W/w, H/h)*(pad||0.82)));
  following = null;
}

/* ============================ starfield ============================ */
/* Three parallax layers, seeded once per resize. They drift with the camera at
   a fraction of its speed, which is what sells the sense of distance. */
let stars = [];
function seedStars(){
  stars = [];
  const n = Math.round((W*H)/9000);
  let seed = 1337;
  const rnd = ()=> (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for(let i=0;i<n;i++){
    const layer = i%3;
    stars.push({
      x: rnd()*2-1, y: rnd()*2-1,
      z: [0.03,0.07,0.13][layer],
      s: [0.7,1.0,1.5][layer] * (0.6+rnd()*0.8),
      a: [0.25,0.45,0.7][layer] * (0.5+rnd()*0.6)
    });
  }
}
function drawStars(){
  const spanX = W*2, spanY = H*2;
  ctx.save();
  for(const st of stars){
    /* wrap so panning forever never runs out of sky */
    let sx = (st.x*spanX - cam.x*st.z*cam.zoom) % spanX;
    let sy = (st.y*spanY - cam.y*st.z*cam.zoom) % spanY;
    if(sx < -W/2) sx += spanX; if(sx > spanX-W/2) sx -= spanX;
    if(sy < -H/2) sy += spanY; if(sy > spanY-H/2) sy -= spanY;
    ctx.globalAlpha = st.a;
    ctx.fillStyle = '#dfe6ff';
    ctx.fillRect(sx, sy, st.s, st.s);
  }
  ctx.restore();
}

/* ============================ sprites ============================ */
/* One pre-baked glow per colour, drawn scaled. Building a radial gradient per
   body per frame is the difference between 700 bodies and about 80. */
const glowCache = new Map();
function glowSprite(color){
  let s = glowCache.get(color);
  if(s) return s;
  const R = 96;
  s = document.createElement('canvas');
  s.width = s.height = R*2;
  const g = s.getContext('2d');
  const grad = g.createRadialGradient(R,R,0,R,R,R);
  grad.addColorStop(0,    color);
  grad.addColorStop(0.14, color);
  grad.addColorStop(0.42, hexA(color,0.30));
  grad.addColorStop(1,    hexA(color,0));
  g.fillStyle = grad;
  g.fillRect(0,0,R*2,R*2);
  glowCache.set(color, s);
  return s;
}
function hexA(hex,a){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ============================ render ============================ */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#05060c';
  ctx.fillRect(0,0,W,H);
  drawStars();

  if(showTrails) drawTrails();

  for(const b of bodies) drawBody(b);
  if(aim.active) drawAim();
  if(selected) drawSelection(selected);
}

function drawTrails(){
  ctx.lineCap = 'round';
  for(const b of bodies){
    const t = b.trail;
    if(t.length < 4) continue;
    const col = b.hole ? '#6f7ce0' : b.color;
    ctx.lineWidth = Math.max(0.9, Math.min(2.6, b.r*cam.zoom*0.25));
    /* Two passes: the whole tail faint, the recent half brighter. Two strokes a
       body buys a sense of direction that a flat line does not have. */
    ctx.strokeStyle = hexA(col, 0.22);
    ctx.beginPath();
    ctx.moveTo(toScreenX(t[0]), toScreenY(t[1]));
    for(let i=2;i<t.length;i+=2) ctx.lineTo(toScreenX(t[i]), toScreenY(t[i+1]));
    ctx.stroke();
    const half = Math.max(0, (t.length>>2)*2);
    if(t.length - half >= 4){
      ctx.strokeStyle = hexA(col, 0.55);
      ctx.beginPath();
      ctx.moveTo(toScreenX(t[half]), toScreenY(t[half+1]));
      for(let i=half+2;i<t.length;i+=2) ctx.lineTo(toScreenX(t[i]), toScreenY(t[i+1]));
      ctx.stroke();
    }
  }
}

function drawBody(b){
  const x = toScreenX(b.x), y = toScreenY(b.y);
  const r = Math.max(1, b.r*cam.zoom);
  if(x < -r-80 || x > W+r+80 || y < -r-80 || y > H+r+80) return;

  if(b.hole){
    /* An accretion ring and a black disc reads as a hole far better than
       drawing nothing at all, which is what a black circle on black is. */
    const ring = glowSprite('#8f7bff');
    const R = r*4.2;
    ctx.globalAlpha = 0.55;
    ctx.drawImage(ring, x-R, y-R, R*2, R*2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#05060c';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(180,160,255,.85)';
    ctx.lineWidth = Math.max(0.8, r*0.16);
    ctx.stroke();
    return;
  }

  if(b.glow > 0){
    const R = r*(1 + b.glow*4.5);
    ctx.globalAlpha = Math.min(1, 0.30 + b.glow*0.5);
    ctx.drawImage(glowSprite(b.color), x-R, y-R, R*2, R*2);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = b.color;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();

  /* a sliver of shading so planets read as spheres rather than discs */
  if(r > 3 && !b.lum){
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(x + r*0.32, y + r*0.30, r*0.92, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if(b.flash > 0){
    ctx.globalAlpha = b.flash;
    const R = r*(3 + b.flash*7);
    ctx.drawImage(glowSprite('#ffffff'), x-R, y-R, R*2, R*2);
    ctx.globalAlpha = 1;
  }
}

function drawSelection(b){
  const x=toScreenX(b.x), y=toScreenY(b.y), r=Math.max(4, b.r*cam.zoom)+7;
  ctx.strokeStyle = 'rgba(127,212,255,.9)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.stroke();
  ctx.setLineDash([]);
}

/* ============================ aiming ============================ */
const aim = {active:false, x:0, y:0, dx:0, dy:0, path:[]};
let currentKind = 'planet';

/* Integrate a massless probe through the frozen field so you can see where the
   thing you are about to throw will actually go. This is the difference
   between a gravity toy and a gravity guessing game. */
function predict(x,y,vx,vy){
  const pts=[x,y];
  const dt = 0.9/SUBSTEPS;
  let px=x, py=y, pvx=vx, pvy=vy;
  const steps = 900;
  for(let s=0;s<steps;s++){
    let ax=0, ay=0;
    for(let i=0;i<bodies.length;i++){
      const b=bodies[i];
      const ddx=b.x-px, ddy=b.y-py;
      const d2=ddx*ddx+ddy*ddy+SOFT*SOFT;
      const inv=1/Math.sqrt(d2);
      const f=G*b.m*inv*inv*inv;
      ax+=f*ddx; ay+=f*ddy;
      if(d2 < b.r*b.r) return {pts, hit:b};   /* stop the line where it lands */
    }
    pvx+=ax*dt; pvy+=ay*dt;
    px+=pvx*dt; py+=pvy*dt;
    if(s%3===0) pts.push(px,py);
  }
  return {pts, hit:null};
}

function drawAim(){
  const k = kindById(currentKind);
  const sx = toScreenX(aim.x), sy = toScreenY(aim.y);

  if(aim.path.length>3){
    ctx.strokeStyle = aim.hit ? 'rgba(255,140,120,.85)' : 'rgba(127,212,255,.75)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([7,6]);
    ctx.beginPath();
    ctx.moveTo(toScreenX(aim.path[0]), toScreenY(aim.path[1]));
    for(let i=2;i<aim.path.length;i+=2) ctx.lineTo(toScreenX(aim.path[i]), toScreenY(aim.path[i+1]));
    ctx.stroke();
    ctx.setLineDash([]);
  }
  /* the throw itself */
  const ex = sx + aim.dx*cam.zoom, ey = sy + aim.dy*cam.zoom;
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();

  const r = Math.max(3, radiusFor(k.mass)*cam.zoom);
  ctx.fillStyle = k.hole ? '#1a1a28' : k.color;
  ctx.globalAlpha = .85;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,6.2832); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ============================ input ============================ */
/* One pointer draws and flings. Two pointers pinch and pan — the gesture an
   iPad user will try first without being told. */
const pointers = new Map();
let pinch = null;
let panning = null;
const VEL_SCALE = 0.055;

function localPos(e){
  const r = canvas.getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}
function bodyAt(sx,sy){
  let hit=null, best=Infinity;
  for(const b of bodies){
    const d = Math.hypot(toScreenX(b.x)-sx, toScreenY(b.y)-sy);
    const grab = Math.max(14, b.r*cam.zoom + 8);
    if(d < grab && d < best){ best=d; hit=b; }
  }
  return hit;
}

canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  const p = localPos(e);
  pointers.set(e.pointerId, p);

  if(pointers.size === 2){
    aim.active = false;
    const [a,b] = [...pointers.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y),
             cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
    return;
  }
  if(pointers.size > 2) return;

  /* middle mouse, right mouse or a held space bar pans on a desktop */
  if(e.button === 1 || e.button === 2 || spaceHeld){
    panning = {sx:p.x, sy:p.y, cx:cam.x, cy:cam.y};
    return;
  }

  const hit = bodyAt(p.x, p.y);
  if(hit){ selectBody(hit); return; }

  selectBody(null);
  aim.active = true;
  aim.x = toWorldX(p.x); aim.y = toWorldY(p.y);
  aim.dx = 0; aim.dy = 0; aim.path = []; aim.hit = null;
  updateAim();
});

canvas.addEventListener('pointermove', e=>{
  const p = localPos(e);
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, p);

  if(pinch && pointers.size >= 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
    if(pinch.d > 0) zoomAt(cx, cy, d/pinch.d);
    /* two-finger drag pans at the same time, which is what the gesture feels like */
    cam.x -= (cx - pinch.cx)/cam.zoom;
    cam.y -= (cy - pinch.cy)/cam.zoom;
    pinch = {d, cx, cy};
    following = null;
    return;
  }
  if(panning){
    cam.x = panning.cx - (p.x - panning.sx)/cam.zoom;
    cam.y = panning.cy - (p.y - panning.sy)/cam.zoom;
    following = null;
    return;
  }
  if(aim.active){
    aim.dx = toWorldX(p.x) - aim.x;
    aim.dy = toWorldY(p.y) - aim.y;
    updateAim();
  }
});

function endPointer(e){
  const had = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  if(!had) return;
  if(panning){ panning = null; return; }
  if(!aim.active) return;
  aim.active = false;

  const drag = Math.hypot(aim.dx, aim.dy)*cam.zoom;
  let vx, vy;
  if(drag < 6 && orbitAssist){
    /* a tap, with the assist on: drop it straight into a circular orbit */
    const host = dominant(aim.x, aim.y, null);
    if(host){
      const v = circularVelocity(aim.x, aim.y, host, systemSpin(host));
      vx = v.vx; vy = v.vy;
    } else { vx = 0; vy = 0; }
  } else {
    vx = aim.dx*VEL_SCALE; vy = aim.dy*VEL_SCALE;
  }
  const b = addBody(makeBody(aim.x, aim.y, vx, vy, currentKind));
  if(b){ accelerate(); for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; } }
  hideHint();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e=>e.preventDefault());

function updateAim(){
  const k = kindById(currentKind);
  const drag = Math.hypot(aim.dx, aim.dy)*cam.zoom;
  let vx = aim.dx*VEL_SCALE, vy = aim.dy*VEL_SCALE;
  if(drag < 6 && orbitAssist){
    const host = dominant(aim.x, aim.y, null);
    if(host){ const v = circularVelocity(aim.x, aim.y, host, systemSpin(host)); vx=v.vx; vy=v.vy; }
  }
  const res = predict(aim.x, aim.y, vx, vy);
  aim.path = res.pts; aim.hit = res.hit;
}
/* Which way the system already turns, so an assisted drop joins the traffic
   rather than driving into it. */
function systemSpin(host){
  let L = 0;
  for(const b of bodies){
    if(b===host) continue;
    const dx=b.x-host.x, dy=b.y-host.y;
    L += b.m*(dx*(b.vy-host.vy) - dy*(b.vx-host.vx));
  }
  return L < 0 ? -1 : 1;
}

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const p = localPos(e);
  zoomAt(p.x, p.y, Math.pow(0.9992, e.deltaY*(e.deltaMode===1?18:1)));
  following = null;
}, {passive:false});

let spaceHeld = false;
addEventListener('keydown', e=>{
  if(e.target !== document.body && e.target.tagName === 'INPUT') return;
  const k = e.key;
  if(k === ' '){ e.preventDefault(); spaceHeld = true; togglePlay(); }
  else if(k === 'c' || k === 'C') clearAll();
  else if(k === 't' || k === 'T') setTrails(!showTrails);
  else if(k === 'f' || k === 'F') fitAll();
  else if(k === 'Escape') selectBody(null);
  else if(k === 'Backspace' || k === 'Delete'){ if(selected) deleteSelected(); }
  else if(k >= '1' && k <= '6'){ setKind(KINDS[+k-1].id); }
});
addEventListener('keyup', e=>{ if(e.key === ' ') spaceHeld = false; });

/* ============================ presets ============================ */
/* Ring of small bodies on circular orbits about a central mass. */
function ringOf(host, count, rMin, rMax, kind, spin){
  for(let i=0;i<count;i++){
    const t = count===1 ? 0.5 : i/(count-1);
    const r = rMin + (rMax-rMin)*(t + (Math.random()-0.5)*0.06);
    const a = Math.random()*Math.PI*2;
    const x = host.x + Math.cos(a)*r, y = host.y + Math.sin(a)*r;
    const v = circularVelocity(x, y, host, spin||1);
    const jitter = 1 + (Math.random()-0.5)*0.02;
    addBody(makeBody(x, y, v.vx*jitter, v.vy*jitter, kind));
  }
}
const PRESETS = {
  binary(){
    /* Two stars about a common barycentre, with a few worlds far enough out
       to survive it. */
    const d = 150, m = kindById('star').mass;
    const v = Math.sqrt(G*m/(2*d));
    const a = addBody(makeBody(-d/2, 0, 0, -v, 'star'));
    const b = addBody(makeBody( d/2, 0, 0,  v, 'star'));
    const centre = {x:0, y:0, vx:0, vy:0, m: a.m+b.m};
    for(let i=0;i<7;i++){
      const r = 420 + i*130 + Math.random()*60;
      const ang = Math.random()*Math.PI*2;
      const x = Math.cos(ang)*r, y = Math.sin(ang)*r;
      const vel = circularVelocity(x, y, centre, 1);
      addBody(makeBody(x, y, vel.vx, vel.vy, i%3===0 ? 'giant' : 'planet'));
    }
  },
  solar(){
    const sun = addBody(makeBody(0,0,0,0,'star'));
    const orbits = [90,140,200,275,370,470,590];
    orbits.forEach((r,i)=>{
      const a = Math.random()*Math.PI*2;
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      const v = circularVelocity(x,y,sun,1);
      const kind = i<2 ? 'moon' : (i<5 ? 'planet' : 'giant');
      const p = addBody(makeBody(x,y,v.vx,v.vy,kind));
      /* a moon or two, on orbits tight enough that the sun does not strip them */
      if(kind!=='moon' && Math.random()<0.6){
        const mr = p.r + 14 + Math.random()*10;
        const ma = Math.random()*Math.PI*2;
        const mx = p.x + Math.cos(ma)*mr, my = p.y + Math.sin(ma)*mr;
        const mv = circularVelocity(mx,my,p,1);
        addBody(makeBody(mx,my,mv.vx,mv.vy,'asteroid'));
      }
    });
  },
  rings(){
    const sun = addBody(makeBody(0,0,0,0,'star'));
    ringOf(sun, 220, 130, 300, 'asteroid', 1);
    const a = 480;
    const v = circularVelocity(a,0,sun,1);
    const g = addBody(makeBody(a,0,v.vx,v.vy,'giant'));
    ringOf(g, 90, g.r+9, g.r+30, 'asteroid', 1);
  },
  cluster(){
    /* Enough mass in a small volume that it collapses, throws bodies out and
       finds its own centre. Never resolves the same way twice. */
    for(let i=0;i<170;i++){
      const a = Math.random()*Math.PI*2;
      const r = Math.sqrt(Math.random())*430;
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      const s = 0.30;
      addBody(makeBody(x, y, -y*s*0.01 + (Math.random()-0.5)*1.4,
                              x*s*0.01 + (Math.random()-0.5)*1.4,
                       Math.random()<0.14 ? 'planet' : (Math.random()<0.5?'moon':'asteroid')));
    }
    addBody(makeBody(0,0,0,0,'hole'));
  }
};
function loadPreset(name){
  bodies = []; selected = null; following = null; simTime = 0;
  (PRESETS[name]||PRESETS.solar)();
  accelerate();
  for(const b of bodies){ b.ax=b.nax; b.ay=b.nay; }
  fitAll();
  hideHint();
}

/* ============================ ui ============================ */
const $ = id => document.getElementById(id);
const elStat=$('stat'), elPlay=$('play'), elHint=$('hint');

function setKind(id){
  currentKind = id;
  for(const el of $('bodies').children) el.classList.toggle('on', el.dataset.k===id);
}
$('bodies').innerHTML = '';
for(const k of KINDS){
  const b = document.createElement('button');
  b.className='bd'; b.dataset.k=k.id; b.type='button';
  b.innerHTML = `<i class="dot" style="background:${k.hole?'#14142a':k.color};`
    + `box-shadow:${k.hole?'0 0 0 2px rgba(150,130,255,.8)':'0 0 12px '+hexA(k.color,0.9)}"></i>`
    + `<span class="nm">${k.name}</span>`;
  b.addEventListener('click', ()=>setKind(k.id));
  $('bodies').appendChild(b);
}
setKind('planet');

function togglePlay(){ running = !running; elPlay.textContent = running ? 'Pause' : 'Play'; }
elPlay.addEventListener('click', togglePlay);
function clearAll(){ bodies=[]; selected=null; following=null; simTime=0; }
$('reset').addEventListener('click', clearAll);
$('fit').addEventListener('click', ()=>fitAll());
function setTrails(v){ showTrails=v; $('trails').classList.toggle('on',v); if(!v) for(const b of bodies) b.trail.length=0; }
$('trails').addEventListener('click', ()=>setTrails(!showTrails));
$('orbitAssist').addEventListener('click', ()=>{
  orbitAssist=!orbitAssist; $('orbitAssist').classList.toggle('on',orbitAssist);
});
setTrails(true); $('orbitAssist').classList.add('on');

/* Speed runs 0 to 4x on a curve, so the useful slow end gets most of the track. */
$('speed').addEventListener('input', e=>{
  const t = +e.target.value/60;
  timeScale = t<=0 ? 0 : Math.pow(t,1.9)*4;
  $('speedv').innerHTML = timeScale.toFixed(timeScale<1?2:1)+'&times;';
});
$('speed').dispatchEvent(new Event('input'));

for(const el of document.querySelectorAll('[data-preset]'))
  el.addEventListener('click', ()=>loadPreset(el.dataset.preset));

/* inspector */
function selectBody(b){
  selected = b;
  $('insp').classList.toggle('on', !!b);
  if(b){ $('ispDot').style.background = b.hole?'#14142a':b.color; $('ispName').textContent = b.name; }
}
$('ispFollow').addEventListener('click', ()=>{
  following = following===selected ? null : selected;
  $('ispFollow').classList.toggle('on', !!following);
});
function deleteSelected(){
  if(!selected) return;
  bodies = bodies.filter(b=>b!==selected);
  if(following===selected) following=null;
  selectBody(null);
}
$('ispDel').addEventListener('click', deleteSelected);

function updateInspector(){
  if(!selected) return;
  $('ispMass').textContent = fmt(selected.m);
  $('ispVel').textContent  = fmt(Math.hypot(selected.vx,selected.vy),2);
  const o = orbitOf(selected);
  $('ispHost').textContent = o ? o.host.name : '—';
  $('ispPer').textContent  = o ? (o.bound ? fmt(o.period,1)+'s' : 'escaping') : '—';
  $('ispFollow').classList.toggle('on', following===selected);
}
function fmt(v,d){
  if(!isFinite(v)) return '—';
  if(v>=1e6) return (v/1e6).toFixed(1)+'M';
  if(v>=1e3) return (v/1e3).toFixed(1)+'k';
  return v.toFixed(d===undefined?0:d);
}
let hintTimer = setTimeout(hideHint, 9000);
function hideHint(){ clearTimeout(hintTimer); elHint.classList.add('gone'); }

/* ============================ loop ============================ */
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60;
function frame(now){
  let dt = (now-last)/1000; last = now;
  if(dt > 0.25) dt = 0.25;
  fpsAcc += dt; fpsN++;
  if(fpsAcc > 0.5){ fps = fpsN/fpsAcc; fpsAcc=0; fpsN=0; }

  if(running && timeScale>0) step(dt*timeScale);
  if(following){ cam.x = following.x; cam.y = following.y; }

  render();
  updateInspector();
  elStat.textContent = `${bodies.length} bodies · ${Math.round(fps)} fps · ${cam.zoom<1?('1:'+Math.round(1/cam.zoom)):(Math.round(cam.zoom)+':1')}`;
  requestAnimationFrame(frame);
}

/* ============================ scripting hook ============================ */
/* A small surface for driving the sandbox from the console or a test. Kept
   read-mostly: it hands out copies rather than the live bodies. */
function totalEnergy(){
  let ke=0, pe=0;
  for(let i=0;i<bodies.length;i++){
    const a=bodies[i];
    ke += 0.5*a.m*(a.vx*a.vx + a.vy*a.vy);
    for(let j=i+1;j<bodies.length;j++){
      const b=bodies[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      pe -= G*a.m*b.m/Math.sqrt(dx*dx+dy*dy+SOFT*SOFT);
    }
  }
  return ke+pe;
}
window.orbital = {
  list: ()=>bodies.map(b=>({id:b.id,x:b.x,y:b.y,vx:b.vx,vy:b.vy,m:b.m,r:b.r,kind:b.kind})),
  count: ()=>bodies.length,
  add: (x,y,vx,vy,kind)=>{
    const b = addBody(makeBody(x,y,vx,vy,kind||'planet'));
    if(b){ accelerate(); for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; } }
    return b ? b.id : null;
  },
  clear: ()=>clearAll(),
  preset: n=>loadPreset(n),
  energy: totalEnergy,
  momentum: ()=>bodies.reduce((s,b)=>({x:s.x+b.m*b.vx, y:s.y+b.m*b.vy}),{x:0,y:0}),
  cam,
  aim,
  /* Advance by an exact dt so a test does not depend on how fast the machine is. */
  step: dt=>step(dt),
  setSpeed: v=>{ timeScale = v; },
  select: id=>{ selectBody(bodies.find(b=>b.id===id)||null); },
  get running(){ return running; }
};

/* ============================ boot ============================ */
resize();
loadPreset('solar');
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
</body>
</html>
