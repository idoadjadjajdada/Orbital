         each patch of it is, which is how lava actually reads — and it is what
         lets you still see two different worlds folded into one melt. Tinting
         the rock towards orange instead just turns everything to sand, because
         rock and orange have nearly the same green in them. */
      let hr,hg,hb,t;
      if(h<0.5){ t=h/0.5;        hr=170+85*t;  hg=40+80*t;   hb=10+10*t; }
      else     { t=(h-0.5)/0.5;  hr=255;       hg=120+100*t; hb=20+130*t; }
      const lum=(0.3*cr+0.6*cg+0.1*cb)/255;
      const sh=0.55+0.5*lum;
      hr*=sh; hg*=sh; hb*=sh;
      let k=h*1.1; if(k>0.9) k=0.9; else if(k<0) k=0;
      cr+=(hr-cr)*k; cg+=(hg-cg)*k; cb+=(hb-cb)*k;
    }
    /* A mote of a crumbled world stands for a patch of it that big. Drawing it
       one pixel wide turns a solid thing into a dot cloud the moment you zoom
       in, so it is drawn at the size it actually occupies. */
    const rubble = p.cell>0;
    const s = rubble ? Math.max(1, Math.ceil(p.cell*z)) : p.size;
    let x0=x<0?0:x, y0=y<0?0:y;
    const x1=x+s>W?W:x+s, y1=y+s>H?H:y+s;
    if(x1<=x0||y1<=y0) continue;

    if(rubble){
      anySolid=true;
      for(let yy=y0;yy<y1;yy++){
        let idx=(yy*W+x0)<<2;
        for(let xx=x0;xx<x1;xx++){
          solid[idx]=cr; solid[idx+1]=cg; solid[idx+2]=cb; solid[idx+3]=255;
          idx+=4;
        }
      }
      /* and hot material gives off light as well as sitting there. Solid on
         its own is rock; solid plus what it is radiating is lava. */
      if(h>0.55){
        anyLoose=true;
        const e=(h-0.55)*0.5;
        const ir=cr*e, ig=cg*e, ib=cb*e;
        for(let yy=y0;yy<y1;yy++){
          let idx=(yy*W+x0)<<2;
          for(let xx=x0;xx<x1;xx++){
            loose[idx]+=ir; loose[idx+1]+=ig; loose[idx+2]+=ib; loose[idx+3]=255;
            idx+=4;
          }
        }
      }
    } else {
      anyLoose=true;
      /* settled debris holds its brightness; strays fade as they age */
      const a = p.settled ? 0.85 : 0.35+fade*0.6;
      const ir=cr*a, ig=cg*a, ib=cb*a;
      for(let yy=y0;yy<y1;yy++){
        let idx=(yy*W+x0)<<2;
        for(let xx=x0;xx<x1;xx++){
          loose[idx]+=ir; loose[idx+1]+=ig; loose[idx+2]+=ib; loose[idx+3]=255;
          idx+=4;
        }
      }
    }
  }
  if(anySolid){
    sCtx.putImageData(sImg,0,0);
    ctx.drawImage(sLayer,0,0);
  }
  if(anyLoose){
    pCtx.putImageData(pImg,0,0);
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(pLayer,0,0);
    ctx.globalCompositeOperation='source-over';
  }
}
function drawWaves(){
  ctx.globalCompositeOperation='lighter';
  for(const w of waves){
    const x=toScreenX(w.x), y=toScreenY(w.y), r=w.r*cam.zoom;
    if(r<1||x+r<0||x-r>W||y+r<0||y-r>H) continue;
    const fade=1-w.r/w.maxR;
    const c=w.rgb;
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${(0.55*fade*fade).toFixed(3)})`;
    ctx.lineWidth=Math.max(1,2*fade);
    ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.stroke();
    /* a second, softer front just behind gives it thickness */
    if(r>3){
      ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${(0.22*fade).toFixed(3)})`;
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(x,y,r*0.86,0,6.283); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
}
function glowRect(x,y,R,col,alpha){
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(x,y,0,x,y,R);
  g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${alpha})`);
  g.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
  ctx.fillStyle=g;
  ctx.fillRect(x-R,y-R,R*2,R*2);
  ctx.globalCompositeOperation='source-over';
}
/* Nothing is ever drawn smaller than this many buffer pixels across. A planet
   is a very small thing a very long way from the next one — pull back far
   enough to see two orbits at once and every world in the sky is a hundredth
   of a pixel, which is true and useless. So a body has a floor on how small it
   is allowed to be drawn, and below it the picture stops being to scale rather
   than the sim stopping being right. Every planetarium ever written does this. */
const MIN_DOT = 2.0;
function drawBody(b){
  const x=toScreenX(b.x), y=toScreenY(b.y);
  const r=Math.max(MIN_DOT, b.r*cam.zoom);
  if(x<-r-120||x>W+r+120||y<-r-120||y>H+r+120) return;
  const pal=(PALETTES[b.spec.pal]||PALETTES.terran).ramp;

  /* a hole is drawn by the lensing pass, which needs the sky behind it to
     already be there */
  if(b.hole) return;
  /* A neutron star's magnetic axis is not its spin axis, so the beam it throws
     from each pole sweeps the sky like a lighthouse — and you only see it on
     the turns that point at you. Nothing about the beam is physics: it is
     light, and drawing light is what drawing is for. The spin under it is real,
     and is what a star's own rotation becomes when its core falls to fifteen
     miles across. */
  if(b.spec.cls==='exotic' && !b.hole && Math.abs(b.spin)>1) drawBeams(b,x,y,r,pal);

  /* a comet grows a tail pointing away from whatever is lighting it */
  if(b.comet) drawTail(b,x,y,r,pal);

  if(b.lum) glowRect(x,y,Math.max(8,Math.min(r*3.2,110)),pal[pal.length-2],0.45);
  else if(b.heat>0.05) glowRect(x,y,Math.max(4,Math.min(r*(1.6+b.heat*2.2),70)),[255,140,60],0.16+b.heat*0.4);

  /* the sprite is baked at roughly one sprite pixel per buffer pixel, bucketed
     so it is not regenerated every frame as you zoom */
  const want=Math.max(3,Math.min(96,Math.round(r*2)));
  const res=Math.max(4,Math.min(96,Math.ceil(want/6)*6));
  const sp=makeSprite(b.spec,res);
  const d=Math.max(1,Math.round(r*2));
  if(b.stretch>0.02){
    /* The equilibrium figure of a body in a tidal field: prolate, pointed at
       whatever is raising the tide. Bounded by the same number that decides
       disruption, so it can never draw a needle — past 1 it is not a body to
       draw at all, it is rubble, and rubble draws itself. */
    /* Kept small on purpose. A hydrostatic figure is real physics, but only
       while the body is still in equilibrium — a fifth out of round is about
       as far as that goes, and anything more dramatic than this is a drawing
       rather than a simulation. The dramatic part is rubble's job, and rubble
       draws itself. */
    const k=Math.min(0.6,b.stretch);
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(b.tideAng);
    ctx.scale(1+k*0.35, 1/(1+k*0.22));
    ctx.drawImage(sp, -d/2, -d/2, d, d);
    ctx.restore();
  } else {
    ctx.drawImage(sp, Math.round(x-d/2), Math.round(y-d/2), d, d);
  }

  /* molten skin over the top while it is still hot */
  if(!b.lum && b.heat>0.02 && d>2){
    ctx.globalAlpha=Math.min(0.72,b.heat*0.8);
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgb(${(200*b.heat)|0},${(70*b.heat)|0},${(20*b.heat)|0})`;
    fillDisc(x,y,Math.max(1,r));
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  if(b.flash>0) glowRect(x,y,Math.max(6,Math.min(r*(3+b.flash*8),140)),[255,240,220],b.flash*0.7);
}
/* a filled circle drawn on the pixel grid, so it keeps a stepped edge */
function fillDisc(cx,cy,r){
  const r2=r*r, x0=Math.floor(cx-r), x1=Math.ceil(cx+r), y0=Math.floor(cy-r), y1=Math.ceil(cy+r);
  for(let y=y0;y<=y1;y++){
    const dy=y+0.5-cy, w2=r2-dy*dy;
    if(w2<=0) continue;
    const w=Math.sqrt(w2);
    ctx.fillRect(Math.round(cx-w), y, Math.max(1,Math.round(w*2)), 1);
  }
}
function drawTail(b,x,y,r,pal){
  const host=dominant(b.x,b.y,b);
  if(!host||!host.lum) return;
  const dx=b.x-host.x, dy=b.y-host.y, d=Math.max(0.001,Math.hypot(dx,dy));
  const len=Math.max(8,Math.min(120,4000/d))*cam.zoom*0.5+r*4;
  const ux=dx/d, uy=dy/d;
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<44;i++){
    const t=i/44;
    const sp=(Math.random()-0.5)*len*0.16*t;
    const px=x+ux*len*t - uy*sp, py=y+uy*len*t + ux*sp;
    ctx.fillStyle=`rgba(190,226,255,${(1-t)*0.30})`;
    ctx.fillRect(px|0,py|0,1,1);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawSelection(b){
  const x=toScreenX(b.x)|0, y=toScreenY(b.y)|0, r=Math.max(4,b.r*cam.zoom)+4;
  ctx.strokeStyle='rgba(198,155,255,.95)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.arc(x+0.5,y+0.5,r,0,6.283); ctx.stroke();
  ctx.setLineDash([]);
}

/* ============================ light bending ============================ */
/* A black hole is not a black circle with a glow behind it. It is a place where
   the sky itself is wrong: light that would have gone past is pulled around,
   so what you see beside one is the view from somewhere else, stretched into a
   ring. Nothing here is painted on — the pass reads the frame that has already
   been drawn and resamples it, so whatever is actually behind the hole is what
   gets bent, be that a star field, a nebula or a world in mid-collision.
   Deflection goes as 1/r, which is the real weak-field falloff, and the
   photon ring is where it climbs steeply enough that the sky piles up. */
const LENS_REACH = 9;      /* how many horizon radii the bend is worth drawing */
function drawLensing(){
  let any=false;
  for(const h of bodies) if(h.hole){ any=true; break; }
  if(!any) return;
  for(const h of bodies){
    if(!h.hole) continue;
    const cx=toScreenX(h.x), cy=toScreenY(h.y);
    const rs=Math.max(1.2, h.r*cam.zoom);           /* the horizon, on screen */
    const R =Math.min(300, rs*LENS_REACH);          /* where the bend fades out */
    if(cx<-R||cx>W+R||cy<-R||cy>H+R) continue;
    /* light is gathered from further out than it lands, so the patch read has
       to be wider than the patch written */
    const G0=Math.max(0,Math.floor(cx-R*1.9)), G1=Math.min(W,Math.ceil(cx+R*1.9));
    const H0=Math.max(0,Math.floor(cy-R*1.9)), H1=Math.min(H,Math.ceil(cy+R*1.9));
    const X0=Math.max(0,Math.floor(cx-R)),     X1=Math.min(W,Math.ceil(cx+R));
    const Y0=Math.max(0,Math.floor(cy-R)),     Y1=Math.min(H,Math.ceil(cy+R));
    if(X1<=X0||Y1<=Y0||G1<=G0||H1<=H0) continue;

    const gw=G1-G0, gh=H1-H0;
    const src=ctx.getImageData(G0,H0,gw,gh).data;
    const ow=X1-X0, oh=Y1-Y0;
    const out=ctx.createImageData(ow,oh);
    const d=out.data;
    const r2=rs*rs;
    for(let y=Y0;y<Y1;y++){
      const fy=y+0.5-cy;
      for(let x=X0;x<X1;x++){
        const fx=x+0.5-cx;
        const di=((y-Y0)*ow+(x-X0))*4;
        const r=Math.sqrt(fx*fx+fy*fy);
        if(r>=R){                                   /* outside: leave it alone */
          const si=((y-H0)*gw+(x-G0))*4;
          d[di]=src[si]; d[di+1]=src[si+1]; d[di+2]=src[si+2]; d[di+3]=src[si+3];
          continue;
        }
        if(r<=rs){                                  /* inside: nothing comes back */
          d[di]=0; d[di+1]=0; d[di+2]=2; d[di+3]=255;
          continue;
        }
        /* Where on the undisturbed sky this pixel is really looking. Light is
           bent towards the hole, so a source appears further out than it is —
           which means the pixel out here is showing sky from further in, and
           the patch directly behind the hole gets smeared all the way round
           into a ring. Sampling the other way pulls images inward, which is
           the wrong sign and looks like a drain rather than a lens. */
        const fade=1-(r-rs)/(R-rs);
        const pull=r2*3.4/r*fade;
        const rr=Math.max(0.5, r-pull);
        let sx=Math.round(cx+fx/r*rr)-G0, sy=Math.round(cy+fy/r*rr)-H0;
        if(sx<0) sx=0; else if(sx>=gw) sx=gw-1;
        if(sy<0) sy=0; else if(sy>=gh) sy=gh-1;
        const si=(sy*gw+sx)*4;
        const cr=src[si], cg=src[si+1], cb=src[si+2];
        /* Light grazing the hole goes round more than once, so the same sky
           arrives several times over in a thin band. That band is the photon
           ring, and it is the brightest thing in the picture. */
        const rw=Math.max(0.9, rs*0.16);
        const ring=Math.exp(-((r-rs*1.45)*(r-rs*1.45))/(rw*rw));
        /* sky pulled around the hole is spread over more of the view than it
           covered, so it thins — but only just outside the ring, where the
           stretching is severe. Further out it is only bent, not thinned. */
        const dim=1-0.30*fade*fade*fade;
        d[di]  =Math.min(255, cr*dim + ring*205);
        d[di+1]=Math.min(255, cg*dim + ring*165);
        d[di+2]=Math.min(255, cb*dim + ring*235);
        d[di+3]=255;
      }
    }
    ctx.putImageData(out,X0,Y0);
  }
}

function drawBeams(b,x,y,r,pal){
  const len=Math.max(30, r*22);
  const c=pal[pal.length-1];
  for(const sgn of [1,-1]){
    const a=b.ang*1.0 + (sgn<0?Math.PI:0);
    /* face-on it is a flood, edge-on a sliver: what you get is how much of the
       cone is pointed at you */
    const face=Math.abs(Math.cos(b.ang));
    const g=ctx.createLinearGradient(x,y,x+Math.cos(a)*len,y+Math.sin(a)*len);
    g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${0.45*(0.25+0.75*face)})`);
    g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.fillStyle=g;
    const spread=0.13;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(a-spread)*len, y+Math.sin(a-spread)*len);
    ctx.lineTo(x+Math.cos(a+spread)*len, y+Math.sin(a+spread)*len);
    ctx.closePath();
    ctx.fill();
  }
}

function render(t){
  drawSky(t);
  if(showTrails) drawTrails();
  drawParts();
  drawGhosts();
  drawWaves();
  for(const b of bodies) drawBody(b);
  drawLensing();
  if(aim.active) drawAim();
  if(selected) drawSelection(selected);
  /* blow the buffer up to the screen with hard pixel edges */
  vctx.imageSmoothingEnabled=false;
  vctx.clearRect(0,0,view.width,view.height);
  vctx.drawImage(buf,0,0,W,H,0,0,view.width,view.height);
}

/* ============================ the brush ============================ */
/* What a drag will create. The forge edits this directly. */
const brush = {cls:'rock', pal:'terran', seed:12345, mass:22, dens:0, name:'Rocky world', comet:0, hole:0};
function brushSpec(){
  return {cls:brush.cls, pal:brush.pal, seed:brush.seed,
          dens:brush.dens||undefined, comet:brush.comet, hole:brush.hole, name:brush.name};
}
function brushRadius(){ return radiusFor(brush.mass, brush.dens || densityOf(brushSpec())); }

/* ============================ aiming ============================ */
const aim={active:false,x:0,y:0,dx:0,dy:0,path:[],hit:null,hadSel:false};
const VEL_SCALE=0.055;
/* A massless probe through the frozen field, so you can see where the throw
   actually goes instead of guessing. */
function predict(x,y,vx,vy){
  const pts=[x,y];
  const dt=0.9/SUBSTEPS;
  let px=x,py=y,pvx=vx,pvy=vy;
  for(let s=0;s<900;s++){
    let ax=0,ay=0;
    for(let i=0;i<bodies.length;i++){
      const b=bodies[i];
      const ddx=b.x-px, ddy=b.y-py;
      const d2=ddx*ddx+ddy*ddy+SOFT*SOFT;
      const inv=1/Math.sqrt(d2);
      const f=G*b.m*inv*inv*inv;
      ax+=f*ddx; ay+=f*ddy;
      if(d2<b.r*b.r) return {pts,hit:b};
    }
    pvx+=ax*dt; pvy+=ay*dt; px+=pvx*dt; py+=pvy*dt;
    if(s%3===0) pts.push(px,py);
  }
  return {pts,hit:null};
}
function drawAim(){
  const sx=toScreenX(aim.x), sy=toScreenY(aim.y);
  if(aim.path.length>3){
    ctx.strokeStyle=aim.hit?'rgba(255,150,120,.85)':'rgba(198,155,255,.8)';
    ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath();
    ctx.moveTo(toScreenX(aim.path[0]),toScreenY(aim.path[1]));
    for(let i=2;i<aim.path.length;i+=2) ctx.lineTo(toScreenX(aim.path[i]),toScreenY(aim.path[i+1]));
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.strokeStyle='rgba(255,255,255,.55)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+aim.dx*cam.zoom, sy+aim.dy*cam.zoom); ctx.stroke();
  const d=Math.max(2,Math.round(brushRadius()*cam.zoom*2));
  ctx.globalAlpha=.9;
  ctx.drawImage(makeSprite(brushSpec(), Math.max(4,Math.min(96,Math.ceil(d/6)*6))),
                Math.round(sx-d/2), Math.round(sy-d/2), d, d);
  ctx.globalAlpha=1;
}
function updateAim(){
  const drag=Math.hypot(aim.dx,aim.dy)*cam.zoom;
  let vx=aim.dx*VEL_SCALE, vy=aim.dy*VEL_SCALE;
  if(drag<6&&orbitAssist){
    const host=dominant(aim.x,aim.y,null);
    if(host){ const v=circularVelocity(aim.x,aim.y,host,systemSpin(host)); vx=v.vx; vy=v.vy; }
  }
  const res=predict(aim.x,aim.y,vx,vy);
  aim.path=res.pts; aim.hit=res.hit;
}
function systemSpin(host){
  let L=0;
  for(const b of bodies){
    if(b===host) continue;
    const dx=b.x-host.x, dy=b.y-host.y;
    L+=b.m*(dx*(b.vy-host.vy)-dy*(b.vx-host.vx));
  }
  return L<0?-1:1;
}

/* ============================ holding a world ============================ */
/* Grab one and it stops being the sim's to move: it follows the cursor, and
   what it is doing when you let go is what it carries away. */
let held=null;
/* The clock does not run at hand speed, so the cursor's true world velocity is
   useless as an orbital one — an unhurried sweep across the screen is a
   thousand units a second. A throw is put on the same scale a fling is, so
   flicking a world across the view sends it off about as fast as dragging a
   new one across the view would. */
const TOSS = VEL_SCALE*0.12;
function throwVel(){
  if(!held) return {vx:0,vy:0};
  /* a hand that has stopped moving is not throwing anything, whatever it was
     doing half a second ago */
  if((performance.now()-held.t)/1000 > 0.13) return {vx:0,vy:0};
  return {vx: held.cvx*TOSS, vy: held.cvy*TOSS};
}
function grabHold(b, wx, wy){
  held={b, ox:b.x-wx, oy:b.y-wy, tx:b.x, ty:b.y,
        cvx:0, cvy:0, t:performance.now()};
  b.held=true;
  following=null;
  view.style.cursor='grabbing';
}
function moveHold(wx, wy){
  if(!held) return;
  const nx=wx+held.ox, ny=wy+held.oy;
  const now=performance.now();
  /* smoothed over about a tenth of a second of real time, or one twitchy
     pointer event on the way up turns a nudge into a rocket */
  const dtr=Math.min(0.2, Math.max(0.004, (now-held.t)/1000));
  const k=1-Math.exp(-dtr/0.09);
  held.cvx += ((nx-held.tx)/dtr - held.cvx)*k;
  held.cvy += ((ny-held.ty)/dtr - held.cvy)*k;
  held.tx=nx; held.ty=ny; held.t=now;
}
function applyHold(){
  if(!held) return;
  const b=held.b;
  /* it can be eaten, merged or torn apart while you are holding it */
  if(b.dead || bodies.indexOf(b)<0){
    b.held=false; held=null;
    view.style.cursor = dragMode ? 'grab' : 'crosshair';
    return;
  }
  b.x=held.tx; b.y=held.ty;
  const v=throwVel();
  b.vx=v.vx; b.vy=v.vy;
}
function dropHold(){
  if(!held) return;
  const b=held.b, v=throwVel();
  b.held=false;
  held=null;
  view.style.cursor = dragMode ? 'grab' : 'crosshair';
  if(b.dead || bodies.indexOf(b)<0) return;
  if(!v.vx && !v.vy && orbitAssist){
    /* set down rather than thrown. Same courtesy a tap on empty space gets:
       put it in the circular orbit for where it has been left, or it simply
       drops out of the sky. */
    const host=dominant(b.x,b.y,b);
    if(host){ const c=circularVelocity(b.x,b.y,host,systemSpin(host)); v.vx=c.vx; v.vy=c.vy; }
  }
  b.vx=v.vx; b.vy=v.vy;
  b.trail.length=0;              /* the drag path is not an orbit */
  accelerate();
  for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; }
}

/* ============================ input ============================ */
const pointers=new Map();
let pinch=null, panning=null, spaceHeld=false;
function localPos(e){
  const r=view.getBoundingClientRect();
  return {x:cssToBuf(e.clientX-r.left), y:cssToBuf(e.clientY-r.top)};
}
function bodyAt(sx,sy){
  let hit=null,best=Infinity;
  for(const b of bodies){
    const d=Math.hypot(toScreenX(b.x)-sx,toScreenY(b.y)-sy);
    const grab=Math.max(6,b.r*cam.zoom+4);
    if(d<grab&&d<best){ best=d; hit=b; }
  }
  return hit;
}
view.addEventListener('pointerdown',e=>{
  try{ view.setPointerCapture(e.pointerId); }catch(_){}
  const p=localPos(e);
  pointers.set(e.pointerId,p);
  if(pointers.size===2){
    aim.active=false;
    dropHold();
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    return;
  }
  if(pointers.size>2) return;
  if(e.button===1||e.button===2||spaceHeld){
    panning={sx:p.x,sy:p.y,cx:cam.x,cy:cam.y};
    return;
  }
  const hit=bodyAt(p.x,p.y);
  if(hit){
    /* A tool press is not a selection. With Drag on, pressing a world picks it
       up and leaves the inspector exactly as it was — selecting is its own
       thing, and a tool reaching for a world should not also decide what you
       are looking at. Any tool added later gets the same deal. */
    if(dragMode){ grabHold(hit, toWorldX(p.x), toWorldY(p.y)); return; }
    /* Otherwise tapping a world picks it up in the inspector, and tapping the
       same one again puts it back down. Nothing selected should ever be a
       state you are stuck in. */
    selectBody(hit===selected ? null : hit);
    return;
  }
  /* Losing a selection should not also cost you a world. If something was
     selected, this press is read as putting it down: it clears the selection
     and the release drops nothing. A drag still throws, and a second tap on
     nothing still places one. */
  aim.hadSel = !!selected;
  selectBody(null);
  /* nothing on the cursor: the press was for something else */
  if(!armed()) return;
  aim.active=true; aim.x=toWorldX(p.x); aim.y=toWorldY(p.y);
  aim.dx=0; aim.dy=0; aim.path=[]; aim.hit=null;
  updateAim();
});
view.addEventListener('pointermove',e=>{
  const p=localPos(e);
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    if(pinch.d>0) zoomAt(cx,cy,d/pinch.d);
    cam.x-=(cx-pinch.cx)/cam.zoom; cam.y-=(cy-pinch.cy)/cam.zoom;
    pinch={d,cx,cy}; following=null;
    return;
  }
  if(panning){
    cam.x=panning.cx-(p.x-panning.sx)/cam.zoom;
    cam.y=panning.cy-(p.y-panning.sy)/cam.zoom;
    following=null; return;
  }
  if(held){ moveHold(toWorldX(p.x), toWorldY(p.y)); return; }
  if(aim.active){ aim.dx=toWorldX(p.x)-aim.x; aim.dy=toWorldY(p.y)-aim.y; updateAim(); }
});
function endPointer(e){
  const had=pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(!had) return;
  if(panning){ panning=null; return; }
  if(held){ dropHold(); return; }
  if(!aim.active) return;
  aim.active=false;
  const drag=Math.hypot(aim.dx,aim.dy)*cam.zoom;
  if(drag<6 && aim.hadSel){ aim.hadSel=false; return; }
  let vx,vy;
  if(drag<6&&orbitAssist){
    const host=dominant(aim.x,aim.y,null);
    if(host){ const v=circularVelocity(aim.x,aim.y,host,systemSpin(host)); vx=v.vx; vy=v.vy; }
    else { vx=0; vy=0; }
  } else { vx=aim.dx*VEL_SCALE; vy=aim.dy*VEL_SCALE; }
  const b=addBody(makeBody(aim.x,aim.y,vx,vy,brushSpec(),brush.mass));
  if(b){ accelerate(); for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; } }
  hideHint();
}
view.addEventListener('pointerup',endPointer);
view.addEventListener('pointercancel',endPointer);
view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=localPos(e);
  zoomAt(p.x,p.y,Math.pow(0.9992,e.deltaY*(e.deltaMode===1?18:1)));
  following=null;
},{passive:false});

addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  const k=e.key;
  if(k===' '){ e.preventDefault(); spaceHeld=true; togglePlay(); }
  else if(k==='c'||k==='C') clearAll();
  else if(k==='t'||k==='T') setTrails(!showTrails);
  else if(k==='d'||k==='D') setDragMode(!dragMode);
  else if(k==='f'||k==='F') fitAll();
  else if(k==='g'||k==='G') toggleForge();
  else if(k==='Escape') selectBody(null);
  else if((k==='Backspace'||k==='Delete')&&selected) deleteSelected();
  else if(k>='1'&&k<='9'){ const kk=KINDS[+k-1]; if(kk) pickKind(kk.id); }
});
addEventListener('keyup',e=>{ if(e.key===' ') spaceHeld=false; });

/* ============================ presets ============================ */
function ringOf(host,count,rMin,rMax,kindId,spin){
  const k=kindById(kindId);
  for(let i=0;i<count;i++){
    const t=count===1?0.5:i/(count-1);
    const r=rMin+(rMax-rMin)*(t+(Math.random()-0.5)*0.06);
    const a=Math.random()*Math.PI*2;
    const x=host.x+Math.cos(a)*r, y=host.y+Math.sin(a)*r;
    const v=circularVelocity(x,y,host,spin||1);
    addBody(makeBody(x,y,v.vx*(1+(Math.random()-0.5)*0.02),v.vy,specFromKind(k),k.mass));
  }
}
function place(kindId,x,y,vx,vy,mass){
  const k=kindById(kindId);
  return addBody(makeBody(x,y,vx,vy,specFromKind(k),mass===undefined?k.mass:mass));
}
/* debris in orbit about something: a belt, or a ring system */
function beltOf(host, count, rMin, rMax, rgb, pm, spin, spread){
  const s=spin||1, wob=spread===undefined?0.04:spread;
  for(let i=0;i<count;i++){
    /* spread by area, or the annulus piles up against its inside edge */
    const r=Math.sqrt(rMin*rMin + Math.random()*(rMax*rMax-rMin*rMin));
    const a=Math.random()*6.283;
    const x=host.x+Math.cos(a)*r, y=host.y+Math.sin(a)*r;
    const v=circularVelocity(x,y,host,s);
    const k=1+(Math.random()-0.5)*wob;
    const j=()=>((Math.random()*44)|0)-22;
    spawnPart(x,y, v.vx*k, v.vy*k, 'rock',
              [rgb[0]+j(), rgb[1]+j(), rgb[2]+j()], 0, 1e9, pm, 1);
  }
}

/* ======================== the solar system ========================
   Distances are ours, to scale: one astronomical unit is AU world units and
   every orbit is the real semi-major axis, started at its own perihelion with
   the perihelion speed, so the eccentricities are real too — Mercury's 0.21 is
   plainly visible and Venus's 0.007 is plainly not.

   Three things are not to scale, and cannot be, so they are at least honest
   about which way they are wrong.

   Sizes. To scale, Earth here would be a sixtieth of a world unit — smaller
   than one pixel of the render buffer at any zoom this thing offers. Bodies
   are drawn about eighty times too large, keeping every ratio between them
   exact: Jupiter is 11.2 Earths across because it is.

   The Sun's mass. Ours is 333,000 Earths, and anything past 4,200 units here
   collapses under itself. So the Sun is 3,000 and the planets are lifted
   twenty-fold against it, which keeps every planet-to-planet ratio exact and
   leaves the system firmly Sun-dominated — the price is that Jupiter pulls the
   Sun around a circle about a quarter the width of Mercury's orbit rather than
   a hundredth, which you can watch it do.

   Moon orbits. A moon has to sit well inside its planet's Hill sphere to stay,
   and the Hill sphere is set by the real distances while the planet is drawn
   eighty times too wide — so where our Moon sits sixty Earths out, this one
   sits at two, at the same fraction of the Hill radius. The order, the
   spacing between moons and which way each goes round are all real. Triton
   still goes backwards.                                                    */
const AU = 420;
const EM = 0.18;          /* one Earth mass, in world units */
const ER = 1.4;           /* one Earth radius */
const SUNM = 3000;

/* name, class, palette, a (AU), eccentricity, mass (Earths), radius (Earths) */
const PLANETS = [
  ['Mercury','rock','barren',  0.387, 0.2056,   0.0553, 0.383],
  ['Venus',  'rock','desert',  0.723, 0.0068,   0.8150, 0.949],
  ['Earth',  'rock','terran',  1.000, 0.0167,   1.0000, 1.000],
  ['Mars',   'rock','desert',  1.524, 0.0934,   0.1070, 0.532],
  ['Jupiter','gas', 'amber',   5.203, 0.0484, 317.8000,11.209],
  ['Saturn', 'gas', 'amber',   9.537, 0.0542,  95.2000, 9.449],
  ['Uranus', 'gas', 'azure',  19.191, 0.0472,  14.5400, 4.007],
  ['Neptune','gas', 'azure',  30.070, 0.0086,  17.1500, 3.883]
];
/* planet, name, distance out (world units), mass (Earths), radius (Earths),
   which way round */
const MOONS = [
  ['Earth',  'Moon',      3.4, 0.01230, 0.273,  1],
  /* Ours are 22 km and 12 km of captured rubble — at this scale a hundredth of
     a pixel and a mass the sim has no resolution for, so these two are given
     the smallest size and weight that behave like rock. Their distances from
     Mars, in Mars radii, are real. */
  ['Mars',   'Phobos',    1.6, 0.00200, 0.150,  1],
  ['Mars',   'Deimos',    2.6, 0.00100, 0.120,  1],
  ['Jupiter','Io',       46,   0.01500, 0.286,  1],
  ['Jupiter','Europa',   73,   0.00800, 0.245,  1],
  ['Jupiter','Ganymede',117,   0.02500, 0.413,  1],
  ['Jupiter','Callisto',150,   0.01800, 0.378,  1],
  ['Saturn', 'Rhea',     62,   0.00039, 0.120,  1],
  ['Saturn', 'Titan',   142,   0.02250, 0.404,  1],
  ['Saturn', 'Iapetus', 170,   0.00030, 0.115,  1],
  ['Uranus', 'Titania',  96,   0.00059, 0.124,  1],
  ['Uranus', 'Oberon',  128,   0.00050, 0.119,  1],
  /* backwards, which is why it cannot have formed there and must have been
     caught — and why it is falling in */
  ['Neptune','Triton',   78,   0.00358, 0.212, -1]
];

const PRESETS={
  solar(){
    const sun = addBody(makeBody(0,0,0,0,
      {cls:'star', pal:'amber', seed:4242, dens:SUNM/Math.pow(70/RSCALE,3), name:'Sun'}, SUNM));
    const made = {};
    for(const [name,cls,pal,a,e,mE,rE] of PLANETS){
      const A = a*AU;
      const r = Math.max(0.3, rE*ER);
      const m = mE*EM;
      const rp = A*(1-e);                                   /* perihelion */
      /* perihelion speed, with the same softening the force carries */
      const vp = Math.sqrt(G*SUNM*(1+e))*rp/Math.pow(rp*rp+SOFT*SOFT, 0.75);
      const th = Math.random()*6.283;                       /* pointing anywhere */
      const b = addBody(makeBody(Math.cos(th)*rp, Math.sin(th)*rp,
                                 -Math.sin(th)*vp, Math.cos(th)*vp,
                                 {cls, pal, seed:(seedCounter++*2654435761)%100000,
                                  dens:m/Math.pow(r/RSCALE,3), name}, m));
      if(b){ made[name]=b; b.name=name; }
    }
    for(const [host,name,d,mE,rE,spin] of MOONS){
      const h = made[host];
      if(!h) continue;
      const m = Math.max(1e-7, mE*EM);
      const r = Math.max(0.3, rE*ER);
      const th = Math.random()*6.283;
      const x = h.x+Math.cos(th)*d, y = h.y+Math.sin(th)*d;
      const v = circularVelocity(x,y,h,spin);
      const b = addBody(makeBody(x,y,v.vx,v.vy,
        {cls:'rock', pal:'barren', seed:(seedCounter++*2654435761)%100000,
         dens:m/Math.pow(r/RSCALE,3), name}, m));
      if(b) b.name=name;
    }
    /* The main belt, between Mars and Jupiter, where Jupiter never let a
       planet finish forming. All of it together weighs less than our Moon. */
    beltOf(sun, 2400, 2.06*AU, 3.28*AU, [148,138,126], PART_MASS*0.02, 1, 0.06);
    /* Rings are debris inside the Roche distance, which is the whole reason
       they are rings and not moons. */
    if(made.Saturn)  beltOf(made.Saturn, 1500, made.Saturn.r*1.24, made.Saturn.r*2.27,
                            [226,208,172], PART_MASS*0.004, 1, 0.012);
    if(made.Uranus)  beltOf(made.Uranus,  260, made.Uranus.r*1.64, made.Uranus.r*2.00,
                            [120,150,168], PART_MASS*0.002, 1, 0.010);
    if(made.Jupiter) beltOf(made.Jupiter, 200, made.Jupiter.r*1.40, made.Jupiter.r*1.81,
                            [150,124,104], PART_MASS*0.002, 1, 0.012);
    if(made.Neptune) beltOf(made.Neptune, 120, made.Neptune.r*2.10, made.Neptune.r*2.45,
                            [110,132,170], PART_MASS*0.002, 1, 0.010);
    /* opens on the inner system: out here Neptune is a five-hour orbit and
       Mercury is a four-minute one, and the four-minute one is the show */
    return {x:0, y:0, zoom:Math.min(22, W/(2.4*5.6*AU))};
  }
};
function loadPreset(n){

  else fitAll();

}

/* size and density are the two knobs that decide mass, which is the only thing
   gravity cares about */
$('fSize').addEventListener('input',syncForgeFromSliders);
$('fDens').addEventListener('input',syncForgeFromSliders);
/* The slider is a radius in quarter-units; mass falls out of it and density,
   because mass is the only thing gravity actually reads. */
/* Both sliders are logarithmic. A linear density track spends nine tenths of
   itself between rock and slightly denser rock and then cannot reach a neutron
   star at all; on a log track every doubling costs the same distance, so the
   whole range from a snowball to degenerate matter is one sweep of the thumb. */
const DENS_LO=1, DENS_HI=400000;
const RAD_LO=0.4, RAD_HI=900;
const logMap=(v,lo,hi)=>lo*Math.pow(hi/lo, Math.min(1,Math.max(0,v/1000)));
const logUnmap=(x,lo,hi)=>Math.round(1000*Math.log(Math.min(hi,Math.max(lo,x))/lo)/Math.log(hi/lo));
function syncForgeFromSliders(){
  const rad  = logMap(+$('fSize').value, RAD_LO, RAD_HI);
  const dens = logMap(+$('fDens').value, DENS_LO, DENS_HI);
  brush.dens=dens;
  brush.mass=Math.max(0.02, massFor(rad, dens));
  syncForge(true);
}
function syncForge(skipSliders){
  const spec=brushSpec();
  const prev=$('fPrev');
  prev.width=prev.height=48;
  prev.getContext('2d').clearRect(0,0,48,48);
  prev.getContext('2d').drawImage(makeSprite(spec,48),0,0);
  $('fName').textContent=brush.name;
  $('fMass').textContent='mass '+fmt(brush.mass,brush.mass<10?2:0);
  $('fRad').textContent='radius '+brushRadius().toFixed(2);
  for(const el of $('fClass').children) el.classList.toggle('on',el.dataset.cls===brush.cls);
  for(const el of $('fPal').children) el.classList.toggle('on',el.dataset.pal===brush.pal);
  const d=brush.dens||densityOf(spec);
  $('fDensv').textContent='density '+fmt(d, d<10?2:0);
  if(!skipSliders){
    $('fDens').value=logUnmap(d, DENS_LO, DENS_HI);
    $('fSize').value=logUnmap(radiusFor(brush.mass,d), RAD_LO, RAD_HI);
  }
}

/* ============================ scripting hook ============================ */
function totalEnergy(){
  let ke=0,pe=0;
  for(let i=0;i<bodies.length;i++){
    const a=bodies[i];
    ke+=0.5*a.m*(a.vx*a.vx+a.vy*a.vy);
    for(let j=i+1;j<bodies.length;j++){
      const b=bodies[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      pe-=G*a.m*b.m/Math.sqrt(dx*dx+dy*dy+SOFT*SOFT);
    }
  }
  return ke+pe;
}
window.orbital={
  list:()=>bodies.map(b=>({id:b.id,x:b.x,y:b.y,vx:b.vx,vy:b.vy,m:b.m,r:b.r,
                           cls:b.spec.cls,pal:b.spec.pal,heat:b.heat,name:b.name,
                           hole:!!b.hole,stretch:b.stretch||0})),
  count:()=>bodies.length,
  /* where a point in the world lands on the actual page, so a test can put a
     real cursor on a real world */
  screen:(wx,wy)=>{ const r=view.getBoundingClientRect();
                    return {x:r.left+toScreenX(wx)*PIX, y:r.top+toScreenY(wy)*PIX}; },
  particles:()=>parts.length,
  waves:()=>waves.length,
  ringed:()=>parts.filter(p=>p.ring).length,
  /* the rubble clouds: how many, how heavy, and how far from round */
  clouds:()=>blobs.filter(b=>b.m>0).map(b=>{
    const own=parts.filter(p=>blobs[p.blob-1]===b);
    /* principal extents, so a test can say "this is not a circle" without
       anybody having decided in advance what shape it should be. Weighted by
       mass and taken about where the mass currently is, so it is the same
       number the settle test uses rather than a near neighbour of it — two
       worlds that have melted together do not have the same mote size. */
    let sxx=0, syy=0, sxy=0, mm=0, cx=0, cy=0;
    let hot=0, nb=0;
    for(const p of own){ cx+=p.x*p.pm; cy+=p.y*p.pm; mm+=p.pm; }
    if(mm>0){ cx/=mm; cy/=mm; } else { cx=b.x; cy=b.y; }
    for(const p of own){ const dx=p.x-cx, dy=p.y-cy;
                         sxx+=p.pm*dx*dx; syy+=p.pm*dy*dy; sxy+=p.pm*dx*dy;
                         hot+=p.heat; nb+=p.nb; }
    const n=Math.max(1,own.length);
    const w=mm>0?mm:1;
    sxx/=w; syy/=w; sxy/=w;
    const tr=sxx+syy, det=sxx*syy-sxy*sxy;
    const disc=Math.max(0, tr*tr/4-det);
    const l1=tr/2+Math.sqrt(disc), l2=tr/2-Math.sqrt(disc);
    return {x:b.x, y:b.y, m:b.m, n:own.length,
            long:Math.sqrt(Math.max(0,l1)), short:Math.sqrt(Math.max(0,l2)),
            elong: l2>1e-9 ? Math.sqrt(l1/l2) : 999,
            heat: hot/n, buried: nb/n,
            /* what is keeping it from being a world yet */
            why: b.why||'', sigma: b.sigma||0, vesc: b.vesc||0,
            spin: b.spin||0, round: b.round||0};
  }),
  debris:()=>parts.map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,kind:p.kind,ring:!!p.ring,
                           settled:!!p.settled,r:p.r,g:p.g,b:p.b,pm:p.pm,heat:p.heat})),
  settled:()=>parts.filter(p=>p.settled).length,
  /* the shape and the temperature of the last cloud that became a world, at
     the moment it did */
  lastSettle:()=>lastSettle && Object.assign({},lastSettle),
  /* the sprites left behind by worlds that have just become rubble */
  ghosts:()=>ghosts.map(g=>({x:g.x,y:g.y,r:g.r,t:g.t})),
  /* the rendered buffer, so a test can ask what a black hole did to the sky */
  frame:(x,y,w,h)=>Array.from(ctx.getImageData(x,y,w,h).data),
  size:()=>({w:W,h:H}),
  add:(x,y,vx,vy,kindId,mass)=>{
    const b=place(kindId||'rocky',x,y,vx,vy,mass);
    if(b){ accelerate(); for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; } }
    return b?b.id:null;
  },
  clear:()=>clearAll(),
  /* picking a world up, for a test that would rather not synthesise pointer
     events at particular pixels */
  drag:v=>setDragMode(!!v),
  holding:()=>held?held.b.id:null,
  grab:id=>{ const b=bodies.find(x=>x.id===id); if(b) grabHold(b,b.x,b.y); return !!b; },
  moveTo:(x,y)=>moveHold(x,y),
  drop:()=>dropHold(),
  /* spray debris directly — handy for a test, and for anyone who wants to
     build a ring by hand rather than by wrecking a moon */
  spray:(x,y,vx,vy,n,spread,jitter)=>{
    for(let i=0;i<n;i++){
      const a=Math.random()*6.283, sp=(spread||0)*Math.random();
      const jr=(jitter||0)*Math.sqrt(Math.random()), ja=Math.random()*6.283;
      spawnPart(x+Math.cos(ja)*jr, y+Math.sin(ja)*jr,
                vx+Math.cos(a)*sp, vy+Math.sin(a)*sp,
                'rock',[150,140,132],0,999);
    }
    return parts.length;
  },
  /* gas straight into the sky, for a test that needs a known amount of it */
  gas:(x,y,vx,vy,n,jitter,puff)=>{
    for(let i=0;i<n;i++){
      const ja=Math.random()*6.283, jr=(jitter||0)*Math.sqrt(Math.random());
      const q=spawnPart(x+Math.cos(ja)*jr, y+Math.sin(ja)*jr, vx, vy,
                        'gas',[210,170,255],0,999);
      if(q && puff) q.puff=puff;
    }
    return parts.length;
  },
  /* take a body apart on demand, for a test that wants rubble without having
     to arrange a black hole to make it */
  crumble:id=>{ const b=bodies.find(x=>x.id===id); if(b){ crumble(b); return true; } return false; },
  preset:n=>loadPreset(n),
  energy:totalEnergy,
  /* everything the sim is holding, bodies and motes alike */
  mass:()=>bodies.reduce((t,b)=>t+b.m,0)+parts.reduce((t,p)=>t+p.pm,0),
  /* everything the sim is carrying, rubble included — bodies alone stopped
     being the whole of it the moment a collision could leave a cloud behind */
  momentum:()=>{
    let x=0,y=0;
    for(const b of bodies){ x+=b.m*b.vx; y+=b.m*b.vy; }
    for(const p of parts){ x+=p.pm*p.vx; y+=p.pm*p.vy; }
    return {x,y};
  },
  cam, aim, brush,
  step:dt=>step(dt),
  setSpeed:v=>{ timeScale=v; },
  select:id=>selectBody(bodies.find(b=>b.id===id)||null),
  sprite:(spec,res)=>makeSprite(spec,res),
  pix:()=>PIX,
  gasK:v=>{ if(v!==undefined) GAS_K=v; return GAS_K; },
  maxParts:v=>{ if(v!==undefined){ MAX_PARTS=v; if(parts.length>v) parts.splice(0,parts.length-v); evictPtr=0; } return MAX_PARTS; },
  get running(){ return running; }
};

/* ============================ loop ============================ */
let last=performance.now(), fpsAcc=0, fpsN=0, fps=60, clock=0;
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  clock+=dt;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  applyHold();
  if(running&&timeScale>0) step(dt*timeScale);
  if(following){ cam.x=following.x; cam.y=following.y; }
  render(clock);
  updateInspector();
  elStat.textContent=`${bodies.length} bodies · ${parts.length} debris · ${Math.round(fps)} fps`;
  requestAnimationFrame(frame);
}

/* ============================ boot ============================ */
resize();
pickKind('rocky');
loadPreset('solar');
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
</body>
</html>
