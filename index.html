<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbital">
<meta name="theme-color" content="#0a0616">
<meta name="description" content="A pixel-art gravity sandbox. Build worlds, fling them into orbit, and watch them shatter and cool.">
<title>Orbital</title>
<style>
  :root{
    --bg:#0a0616; --panel:rgba(190,150,255,.10); --panel2:rgba(190,150,255,.18);
    --lip:inset 0 1px 0 rgba(255,255,255,.12);
    --ink:#f0eaff; --dim:#a495c9; --acc:#c69bff; --hot:#ff9d5c;
    --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  body{
    color:var(--ink);
    font:500 14px/1.4 ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
  }
  button{font:inherit;font-weight:600;border:0;background:none;color:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px;}

  /* The sim is drawn small and blown up with nearest-neighbour, which is what
     makes it pixel art rather than smooth vector circles. */
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;
    image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;}

  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px)
            calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);}
  .ui > *{pointer-events:auto;}
  /* Spacers cover the middle of the screen, which is the sky. Never take a pointer. */
  .ui > .grow, .ui .grow{pointer-events:none;}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .grow{flex:1;}

  .brand{font-weight:700;font-size:18px;letter-spacing:-.015em;text-shadow:0 2px 14px rgba(0,0,0,.9);}
  .brand b{color:var(--acc);}

  .btn{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:var(--lip);border-radius:10px;padding:8px 13px;font-size:13px;white-space:nowrap;
    transition:background .12s,transform .08s;}
  .btn:active{transform:translateY(1px);}
  .btn.on{background:var(--ink);color:#150a26;}
  .btn.sm{padding:6px 10px;font-size:12px;}
  @media (hover:hover){ .btn:hover{background:var(--panel2);} .btn.on:hover{background:#fff;} }

  .card{background:rgba(18,10,34,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:var(--lip), 0 12px 34px rgba(0,0,0,.55);border-radius:var(--r);padding:9px;}

  .readout{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap;
    text-shadow:0 1px 8px rgba(0,0,0,.9);}

  .bodies{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;}
  .bodies::-webkit-scrollbar{display:none;}
  .bd{flex:0 0 auto;width:70px;background:var(--panel);box-shadow:var(--lip);border-radius:11px;
    padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .12s,transform .08s;}
  .bd:active{transform:scale(.95);}
  .bd canvas{width:26px;height:26px;image-rendering:pixelated;border-radius:3px;}
  .bd .nm{font-size:10px;color:var(--dim);text-align:center;line-height:1.15;}
  .bd.on{background:var(--ink);}
  .bd.on .nm{color:#150a26;font-weight:700;}
  @media (hover:hover){ .bd:hover{background:var(--panel2);} .bd.on:hover{background:#fff;} }

  .slider{display:flex;align-items:center;gap:9px;padding:5px 12px;min-width:170px;}
  .slider label{font-size:12px;color:var(--dim);white-space:nowrap;}
  input[type=range]{flex:1;min-width:60px;accent-color:var(--acc);background:none;height:22px;}

  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 152px);
    background:rgba(14,8,26,.8);backdrop-filter:blur(10px);padding:8px 16px;border-radius:999px;
    font-size:13px;color:#d6c9f2;transition:opacity .5s;pointer-events:none;max-width:90vw;
    text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.6);}
  .hint.gone{opacity:0;}

  /* world designer */
  .forge{position:fixed;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 58px);
    width:250px;display:none;max-height:calc(100vh - 250px);overflow-y:auto;scrollbar-width:thin;}
  .forge.on{display:block;}
  .forge h4{margin:0 0 9px;font-size:13px;display:flex;align-items:center;gap:8px;}
  .forge h4 .grow{flex:1;}
  .forge .prev{display:flex;align-items:center;gap:11px;margin-bottom:10px;}
  .forge .prev canvas{width:76px;height:76px;image-rendering:pixelated;border-radius:8px;
    background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  .forge .prevInfo{flex:1;min-width:0;}
  .forge .prevInfo .t{font-size:13px;font-weight:700;}
  .forge .prevInfo .kv{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .forge .lbl{font-size:11px;color:var(--dim);margin:9px 0 5px;letter-spacing:.06em;text-transform:uppercase;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{background:var(--panel);box-shadow:var(--lip);border-radius:8px;padding:6px 9px;font-size:11.5px;}
  .chip.on{background:var(--ink);color:#150a26;}
  @media (hover:hover){ .chip:hover{background:var(--panel2);} .chip.on:hover{background:#fff;} }
  .forge .slider{padding:4px 0;min-width:0;}

  .insp{position:fixed;right:calc(env(safe-area-inset-right) + 12px);top:calc(env(safe-area-inset-top) + 58px);
    width:184px;display:none;}
  .insp.on{display:block;}
  .insp h4{margin:0 0 7px;font-size:13px;display:flex;align-items:center;gap:7px;}
  .insp h4 canvas{width:18px;height:18px;image-rendering:pixelated;border-radius:3px;}
  .insp .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);
    font-variant-numeric:tabular-nums;padding:2px 0;}
  .insp .kv b{color:var(--ink);font-weight:600;}
  .insp .acts{display:flex;gap:6px;margin-top:8px;}
  .insp .acts .btn{flex:1;justify-content:center;text-align:center;}

  @media (max-width:900px){ .forge{width:214px;} .insp{width:160px;} .brand{font-size:16px;} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <div class="row">
    <div class="brand">Orbit<b>al</b></div>
    <button class="btn sm" id="forgeBtn" title="Design a world">Forge</button>
    <div class="grow"></div>
    <div class="readout" id="stat"></div>
    <button class="btn" id="play" title="Play / pause — Space">Pause</button>
    <button class="btn" id="reset" title="Clear everything — C">Clear</button>
  </div>

  <div class="grow"></div>

  <div class="card forge" id="forge">
    <h4><span>World forge</span><span class="grow"></span>
      <button class="btn sm" id="reroll" title="New terrain">Reroll</button></h4>
    <div class="prev">
      <canvas id="fPrev" width="48" height="48"></canvas>
      <div class="prevInfo">
        <div class="t" id="fName">Rocky planet</div>
        <div class="kv" id="fMass">mass 20</div>
        <div class="kv" id="fRad">radius 3.1</div>
      </div>
    </div>
    <div class="lbl">Composition</div>
    <div class="chips" id="fClass"></div>
    <div class="lbl">Palette</div>
    <div class="chips" id="fPal"></div>
    <div class="lbl">Size</div>
    <div class="slider"><input type="range" id="fSize" min="4" max="600" value="20"></div>
    <div class="lbl">Density</div>
    <div class="slider"><input type="range" id="fDens" min="5" max="3000" value="100"></div>
  </div>

  <div class="card insp" id="insp">
    <h4><canvas id="ispIcon" width="16" height="16"></canvas><span id="ispName">Body</span></h4>
    <div class="kv"><span>Mass</span><b id="ispMass">—</b></div>
    <div class="kv"><span>Speed</span><b id="ispVel">—</b></div>
    <div class="kv"><span>Orbiting</span><b id="ispHost">—</b></div>
    <div class="kv"><span>Period</span><b id="ispPer">—</b></div>
    <div class="acts">
      <button class="btn sm" id="ispFollow">Follow</button>
      <button class="btn sm" id="ispDel">Delete</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:9px">
    <div class="bodies" id="bodies"></div>
  </div>

  <div class="row">
    <div class="card slider">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="60" value="29">
      <span class="readout" id="speedv">1.0&times;</span>
    </div>
    <button class="btn" id="dragBtn" title="Grab a world and move it, and let go to throw it — D">Drag</button>
    <button class="btn" id="orbitAssist" title="Tap empty space to drop a body into a circular orbit">Auto-orbit</button>
    <button class="btn" id="trails" title="Orbit trails — T">Trails</button>
    <div class="card slider" title="How much debris the sky will hold at once">
      <label for="debris">Debris</label>
      <input type="range" id="debris" min="0" max="8" value="6">
      <span class="readout" id="debrisv">60k</span>
    </div>
    <div class="grow"></div>
    <button class="btn sm" data-preset="solar">Solar</button>
    <button class="btn sm" data-preset="binary">Binary</button>
    <button class="btn sm" data-preset="smash">Smash</button>
    <button class="btn sm" data-preset="cluster">Cluster</button>
    <button class="btn sm" id="fit" title="Frame everything — F">Fit</button>
  </div>
</div>

<div class="hint" id="hint">Drag to fling a world. Smash two together and watch them melt. Hit Drag to pick one up.</div>

<script>
(function(){
'use strict';

/* ============================ constants ============================ */
const G = 1;
const SOFT = 2.0;
const MAX_BODIES = 260;
let   MAX_PARTS  = 60000;   /* how much debris the sky will hold; see the slider */
const SUBSTEPS = 4;
const GRAV_SOURCES = 24;     /* particles only feel the heaviest few; the rest are noise */
/* With tens of thousands of motes in the air, even the heaviest few is too many.
   The top handful account for nearly all of the pull anyway. */
function sourceBudget(){
  const n = parts.length;
  return n>40000 ? 6 : n>18000 ? 10 : n>8000 ? 16 : GRAV_SOURCES;
}
/* Debris does not just fade out. Given a stable orbit it settles, and given
   enough company far enough from its host it clumps into something solid. */
const PART_MASS   = 0.055;   /* what one rock fragment is worth */
const ROCHE       = 2.6;     /* host radii: inside this, tides keep it a ring */
const CLUMP_CELL  = 7;       /* world units; the grid accretion buckets into */
const CLUMP_MIN   = 16;      /* fragments needed before they pull together */
const CLUMP_SPREAD= 1.5;     /* how alike their velocities must be */
/* Nothing holds itself up forever. Past these masses a body loses the argument
   with its own gravity and collapses — with a supernova on the way through. */
/* how much of a hold a body's own material has on itself, as an acceleration
   scale — see the stress calculation in tides() */
const COHESION = 0.8;
const TIDE_K = 8;      /* fluid Roche coefficient, 2^3 — see tides() */
const NEUTRON_MASS = 4200;
const HOLE_MASS    = 13000;
const SHOCK_SPEED  = 190;    /* how fast a blast front travels, world units/s */

/* ============================ noise ============================ */
/* Deterministic value noise, so a world with the same seed always comes back
   looking the same. */
function hash2(x,y,seed){
  let h = x*374761393 + y*668265263 + seed*1442695040888963407;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function smooth(t){ return t*t*(3-2*t); }
function vnoise(x,y,seed){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x-xi, yf = y-yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi,yi,seed),     b = hash2(xi+1,yi,seed);
  const c = hash2(xi,yi+1,seed),   d = hash2(xi+1,yi+1,seed);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x,y,seed,oct,gain){
  let sum=0, amp=1, f=1, norm=0;
  for(let i=0;i<oct;i++){
    sum += vnoise(x*f, y*f, seed+i*101)*amp;
    norm += amp; amp *= (gain||0.5); f *= 2;
  }
  return sum/norm;
}
const clamp01 = v => v<0?0:v>1?1:v;
const lerp = (a,b,t)=>a+(b-a)*t;
function mixRGB(a,b,t){ return [lerp(a[0],b[0],t)|0, lerp(a[1],b[1],t)|0, lerp(a[2],b[2],t)|0]; }

/* ============================ palettes ============================ */
/* Each ramp runs from lowland to highland. Rendering picks a band by terrain
   height, so the same ramp gives seas, shores, plains and peaks. */
const PALETTES = {
  terran:  {name:'Terran',  ramp:[[24,52,110],[32,86,150],[196,178,120],[58,124,64],[42,94,52],[120,116,104],[236,240,246]]},
  desert:  {name:'Desert',  ramp:[[104,60,32],[150,92,44],[196,140,68],[220,176,104],[188,132,66],[128,84,44],[238,214,168]]},
  volcanic:{name:'Volcanic',ramp:[[28,16,20],[58,26,24],[110,36,26],[186,58,26],[248,124,32],[255,196,84],[255,242,196]]},
  ice:     {name:'Ice',     ramp:[[26,52,84],[44,88,128],[110,166,204],[176,216,238],[214,238,250],[238,250,255],[255,255,255]]},
  barren:  {name:'Barren',  ramp:[[32,30,36],[54,50,58],[80,74,82],[110,102,110],[142,134,140],[176,168,174],[214,208,212]]},
  jade:    {name:'Jade',    ramp:[[12,40,42],[18,66,62],[30,102,88],[62,148,116],[120,186,140],[186,220,178],[236,248,230]]},
  amber:   {name:'Amber',   ramp:[[64,30,12],[120,62,20],[184,110,34],[224,158,58],[242,196,110],[250,226,172],[255,246,222]]},
  violet:  {name:'Violet',  ramp:[[28,16,52],[52,28,92],[86,46,140],[126,78,188],[168,124,220],[206,176,240],[240,224,255]]},
  azure:   {name:'Azure',   ramp:[[8,28,64],[14,52,104],[24,86,152],[52,132,198],[110,180,226],[178,218,242],[232,246,255]]},
  ember:   {name:'Ember',   ramp:[[42,10,8],[92,20,12],[156,38,16],[214,74,22],[248,132,44],[255,190,96],[255,238,190]]}
};
const PAL_KEYS = Object.keys(PALETTES);

/* ============================ body classes ============================ */
/* class drives how the sprite is generated and how the body behaves in a
   collision; the palette only drives colour. */
const CLASSES = {
  rock: {name:'Rocky',    dens:100, sprite:'rock',  pal:'terran'},
  ice:  {name:'Icy',      dens:80,  sprite:'rock',  pal:'ice'},
  gas:  {name:'Gas',      dens:26,  sprite:'gas',   pal:'amber',   gas:1},
  lava: {name:'Molten',   dens:110, sprite:'lava',  pal:'volcanic',hot:1},
  star: {name:'Star',     dens:60,  sprite:'star',  pal:'amber',   lum:1, hot:1},
  exotic:{name:'Exotic',  dens:900, sprite:'exotic',pal:'violet'}
};

/* ============================ sprite forge ============================ */
/* Every body gets a little pixel sprite baked once and reused. Nothing here is
   drawn with a circle primitive: it is all per-pixel, which is what gives the
   chunky edge that reads as pixel art. */
const spriteCache = new Map();
function spriteKey(spec,res){ return spec.cls+'|'+spec.pal+'|'+spec.seed+'|'+res; }

function makeSprite(spec, res){
  const key = spriteKey(spec,res);
  let s = spriteCache.get(key);
  if(s) return s;
  if(spriteCache.size > 420) spriteCache.clear();

  const cv = document.createElement('canvas');
  cv.width = cv.height = res;
  const g = cv.getContext('2d');
  const img = g.createImageData(res,res);
  const D = img.data;
  const R = res/2, seed = spec.seed;
  const ramp = (PALETTES[spec.pal]||PALETTES.terran).ramp;
  const kind = CLASSES[spec.cls] ? CLASSES[spec.cls].sprite : 'rock';
  /* light from the upper left, the convention that reads as "sphere" */
  const lx=-0.55, ly=-0.62, lz=0.56;

  for(let py=0; py<res; py++){
    for(let px=0; px<res; px++){
      const dx=(px+0.5-R)/R, dy=(py+0.5-R)/R;
      const d2 = dx*dx+dy*dy;
      const i=(py*res+px)*4;
      if(d2 > 1){ D[i+3]=0; continue; }
      const dz = Math.sqrt(1-d2);
      /* project the pixel onto the sphere so terrain wraps instead of smearing */
      const u = dx/(0.35+dz*0.65), v = dy/(0.35+dz*0.65);
      let col, alpha=255;

      if(kind==='gas'){
        /* latitude bands, warped sideways by turbulence, plus a storm or two */
        const warp = fbm(u*1.7, v*2.6, seed, 4, 0.55);
        const band = Math.sin((v*3.1 + warp*0.85)*Math.PI*2.2);
        let t = clamp01(0.5 + band*0.34 + (warp-0.5)*0.30);
        const storm = fbm(u*3.2+11, v*3.2-7, seed+53, 3, 0.5);
        if(storm > 0.79) t = clamp01(t + (storm-0.79)*2.6);
        col = rampAt(ramp, t);
      } else if(kind==='star'){
        const gran = fbm(u*4.5, v*4.5, seed, 3, 0.55);
        const t = clamp01(0.62 + gran*0.42);
        col = rampAt(ramp, t);
        /* limb darkening: a star is brightest dead centre */
        const limb = 0.55 + 0.45*dz;
        col = [Math.min(255,col[0]*limb*1.25)|0, Math.min(255,col[1]*limb*1.18)|0, Math.min(255,col[2]*limb)|0];
      } else if(kind==='lava'){
        const crust = fbm(u*3.0, v*3.0, seed, 4, 0.5);
        const veins = Math.abs(fbm(u*5.5+3, v*5.5-3, seed+17, 3, 0.6) - 0.5);
        let t = clamp01(crust*0.55);
        if(veins < 0.055) t = clamp01(0.82 + (0.055-veins)*4);   /* glowing cracks */
        col = rampAt(ramp, t);
      } else if(kind==='exotic'){
        const swirl = fbm(u*3.4, v*3.4, seed, 3, 0.6);
        col = rampAt(ramp, clamp01(swirl*0.9));
      } else {
        /* rock and ice: continents from fbm, with a coastline that snaps to a
           band so it stays crisp at pixel scale */
        let h = fbm(u*2.1+5, v*2.1-5, seed, 5, 0.52);
        h = clamp01((h-0.34)*1.75);
        const craters = fbm(u*6.5, v*6.5, seed+91, 2, 0.5);
        if(craters > 0.76) h = clamp01(h - (craters-0.76)*1.2);
        col = rampAt(ramp, h);
      }

      if(kind!=='star'){
        /* diffuse shading against the sphere normal, with a little ambient so
           the night side is not pure black */
        let nl = dx*lx + dy*ly + dz*lz;
        nl = 0.26 + 0.86*Math.max(0, nl);
        col = [Math.min(255,col[0]*nl)|0, Math.min(255,col[1]*nl)|0, Math.min(255,col[2]*nl)|0];
        if(d2 > 0.93) alpha = 255*(1-(d2-0.93)/0.07)*0.9+25;   /* soften the rim by one pixel */
      }
      D[i]=col[0]; D[i+1]=col[1]; D[i+2]=col[2]; D[i+3]=alpha;
    }
  }
  g.putImageData(img,0,0);
  spriteCache.set(key,cv);
  return cv;
}
function rampAt(ramp,t){
  t = clamp01(t)*(ramp.length-1);
  const i = Math.min(ramp.length-2, Math.floor(t));
  return mixRGB(ramp[i], ramp[i+1], t-i);
}

/* ============================ the roster ============================ */
/* mass is the only number that matters to gravity; radius follows from mass
   and the class density, so a gas giant is genuinely puffy for its weight. */
const KINDS = [
  {id:'asteroid', name:'Asteroid',   cls:'rock', pal:'barren',   mass:0.5},
  {id:'comet',    name:'Comet',      cls:'ice',  pal:'ice',      mass:0.3,  comet:1},
  {id:'moon',     name:'Moon',       cls:'rock', pal:'barren',   mass:2.6},
  {id:'dwarfp',   name:'Dwarf planet',cls:'rock',pal:'desert',   mass:7},
  {id:'rocky',    name:'Rocky world',cls:'rock', pal:'terran',   mass:22},
  {id:'iceworld', name:'Ice world',  cls:'ice',  pal:'ice',      mass:26},
  {id:'molten',   name:'Molten world',cls:'lava',pal:'volcanic', mass:28},
  {id:'gas',      name:'Gas giant',  cls:'gas',  pal:'amber',    mass:150},
  {id:'icegiant', name:'Ice giant',  cls:'gas',  pal:'azure',    mass:100},
  {id:'dwarfs',   name:'Dwarf star', cls:'star', pal:'ember',    mass:520},
  {id:'star',     name:'Star',       cls:'star', pal:'amber',    mass:1500},
  {id:'neutron',  name:'Neutron star',cls:'exotic',pal:'azure',  mass:5200, dens:9000},
  {id:'hole',     name:'Black hole', cls:'exotic',pal:'violet',  mass:9000, dens:20000, hole:1}
];
const kindById = id => KINDS.find(k=>k.id===id) || KINDS[4];
const densityOf = spec => spec.dens || (CLASSES[spec.cls] ? CLASSES[spec.cls].dens : 100);
/* Radius from mass and density. The constant is chosen so a rocky world of
   mass 22 comes out about 5 units across — big enough on screen to read its
   terrain, small enough that a solar system still fits. */
const RSCALE = 15;
const radiusFor = (m, dens) => Math.max(0.55, Math.cbrt(m/Math.max(1,dens))*RSCALE);
const massFor   = (r, dens) => dens*Math.pow(r/RSCALE,3);

let seedCounter = 1;
function specFromKind(k, seed){
  return {cls:k.cls, pal:k.pal, seed: seed===undefined ? (seedCounter++*2654435761)%100000 : seed,
          dens:k.dens, comet:k.comet||0, hole:k.hole||0, name:k.name};
}

/* ============================ state ============================ */
let bodies = [], parts = [];
let nextId = 1;
let running = true, showTrails = true, orbitAssist = true, dragMode = false;
let timeScale = 1, selected = null, following = null;
const cam = {x:0, y:0, zoom:1};

function makeBody(x,y,vx,vy,spec,mass){
  const m = mass===undefined ? 20 : mass;
  const cl = CLASSES[spec.cls] || CLASSES.rock;
  return {
    id: nextId++, x, y, vx, vy, ax:0, ay:0,
    m, r: radiusFor(m, densityOf(spec)),
    spec: Object.assign({}, spec),
    name: spec.name || cl.name,
    lum: cl.lum||0, hot: cl.hot||0, gas: cl.gas||0, hole: spec.hole||0, comet: spec.comet||0,
    /* heat is 0 for settled rock and 1 for freshly shocked magma; it drives both
       the glow and how long before the surface reads as rock again */
    heat: cl.hot ? 1 : 0,
    /* how far from round the tide it is sitting in has pulled it, and which
       way. Zero unless something is actually pulling. */
    stretch: 0, tideAng: 0, tideT: 0,
    spin: (Math.random()-0.5)*0.25,
    ang: Math.random()*6.283,
    trail: [], flash: 0
  };
}
function addBody(b){ if(bodies.length>=MAX_BODIES) return null; bodies.push(b); return b; }

/* ============================ particles ============================ */
/* Debris and gas thrown out by impacts. They feel the gravity of the heavy
   bodies but do not pull on anything themselves, which is what keeps a few
   thousand of them affordable. */
let evictPtr = 0;
function spawnPart(x,y,vx,vy,kind,rgb,heat,life,pm,size){
  const p={x,y,vx,vy,kind,r:rgb[0],g:rgb[1],b:rgb[2],heat,life,age:0,settled:0,ring:0,
           /* Most debris is one indivisible unit of mass. A world crumbling
              into rubble carries its mass in however many motes it can afford,
              so those need to say how much each of them is worth. */
           pm: pm||PART_MASS, blob:0, dens:0, cell:0,
           /* how many other motes it is currently touching. A buried mote has
              five or six; one out on the skin has two or three. */
           nb:0,
           /* a gas mote is a puff with a width and an optical depth rather
              than a speck with a colour: how much of it is stacked up along a
              line of sight is the whole of how gas looks */
           /* a parcel holding more gas is a bigger parcel — area goes with
              how much of it there is */
           puff: kind==='gas' ? (3.4+Math.random()*3.4)*Math.sqrt((pm||PART_MASS)/PART_MASS) : 0,
           /* and it grows with the flow it is part of, which is why an old
              remnant is enormous and faint */
           spread: kind==='gas' ? 0.3 : 0,
           dep:  kind==='gas' ? (0.5+Math.random()*0.7)*((pm||PART_MASS)/PART_MASS) : 0,
           size: size || (kind==='gas' ? (1+Math.random()*1.6) : (Math.random()<0.25?2:1))};
  if(parts.length>=MAX_PARTS){
    /* overwrite in rotation rather than shifting the whole array down one */
    parts[evictPtr++ % parts.length] = p;
  } else parts.push(p);
  return p;
}
let sX=new Float64Array(0), sY, sM, sR2;
function stepParts(dt, sources){
  const ns = sources.length;
  if(sX.length < ns){
    sX=new Float64Array(ns); sY=new Float64Array(ns);
    sM=new Float64Array(ns); sR2=new Float64Array(ns);
  }
  for(let s=0;s<ns;s++){
    const b=sources[s];
    sX[s]=b.x; sY[s]=b.y; sM[s]=b.m; sR2[s]=b.r*b.r;
  }
  const soft2 = SOFT*SOFT;
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    let ax=0, ay=0, hostIdx=-1, hostPull=0;
    for(let s=0;s<ns;s++){
      const dx=sX[s]-p.x, dy=sY[s]-p.y;
      const d2 = dx*dx+dy*dy+soft2;
      const inv = 1/Math.sqrt(d2);
      const f = G*sM[s]*inv*inv*inv;
      ax+=f*dx; ay+=f*dy;
      const pull = sM[s]/d2;
      if(pull>hostPull){ hostPull=pull; hostIdx=s; }
      /* swallowed: the debris settles and its mass joins the body */
      if(d2 < sR2[s]){
        const b=sources[s];
        b.m += p.pm;
        b.r = radiusFor(b.m, densityOf(b.spec));
        sR2[s]=b.r*b.r; sM[s]=b.m;
        if(p.heat>0.4) b.heat = Math.min(1, b.heat + 0.02);
        p.dead = true; break;
      }
    }
    const host = hostIdx>=0 ? sources[hostIdx] : null;
    if(p.dead){ parts.splice(i,1); continue; }
    /* rubble pulls on itself. This is the whole reason a crumbling world holds
       a shape at all instead of dissolving the moment it stops being a body. */
    if(p.blob>0){
      const bl = blobs[p.blob-1];
      if(bl && bl.m>0){
        const dx=bl.x-p.x, dy=bl.y-p.y;
        const r=Math.sqrt(dx*dx+dy*dy)||1e-6;
        /* a uniform sphere: linear inside, inverse-square outside. Smooth at
           the centre, and the competition between this and the tide is exactly
           the Roche condition — so where it tears is decided, not drawn. */
        const a = r<bl.r ? G*bl.m*r/(bl.r*bl.r*bl.r) : G*bl.m/(r*r);
        ax += a*dx/r; ay += a*dy/r;
      } else p.blob=0;
    }
    p.vx+=ax*dt; p.vy+=ay*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.host = host;
    p.settled = 0; p.ring = 0;

    /* rubble is held by its own cloud, not by ring mechanics — circularizing it
       around a host would fight the cohesion that is giving it its shape */
    if(host && !p.blob){
      const dx=p.x-host.x, dy=p.y-host.y;
      const r=Math.hypot(dx,dy)||1e-6;
      const rvx=p.vx-host.vx, rvy=p.vy-host.vy;
      const v2=rvx*rvx+rvy*rvy;
      /* bound to its host means it is in orbit rather than leaving */
      if(v2/2 - G*host.m/r < 0){
        p.settled = 1;
        /* Inside the Roche distance, tides win: the debris can never clump, so
           instead let it grind itself circular, which is how a ring forms. */
        if(r < host.r*ROCHE){
          p.ring = 1;
          /* Killing only the radial motion is not enough: it just makes the
             current radius an apsis and leaves the speed mismatch that made the
             orbit elliptical. Ease the whole velocity toward the circular one
             for this radius instead — which is what endless small collisions
             between ring particles actually do. */
          const spin = (dx*rvy - dy*rvx) < 0 ? -1 : 1;
          const vc = Math.sqrt(G*host.m/r);
          const tx = host.vx + (-dy/r)*vc*spin;
          const ty = host.vy + ( dx/r)*vc*spin;
          const k = Math.min(1, dt*0.6);
          p.vx += (tx - p.vx)*k;
          p.vy += (ty - p.vy)*k;
        } else p.ring = 0;
      }
    }
    p.age += p.settled ? dt*0.12 : dt;   /* settled debris lingers; strays fade */
    /* Heat leaves through the surface. A mote packed in among five or six
       others is not the surface — it is the inside of the thing — so it keeps
       its heat about twice as long as one out on the skin. That is what puts a
       darkening crust on a cooling melt with the glow still showing through it,
       and why the middle is the last part of a world to go solid. */
    if(p.kind!=='gas'){
      const skin = p.blob ? 0.5 + 0.5*Math.max(0, 1 - p.nb/5) : 1;
      p.heat = Math.max(0, p.heat - dt*0.055*skin);
    }
    if(p.age>p.life) parts.splice(i,1);
  }
}

/* ---- accretion ---- */
/* Fragments sharing a patch of sky and a velocity are, physically, one object
   that has not noticed yet. Outside the Roche limit they are allowed to
   notice. Inside it they stay a ring, which is exactly why Saturn has one. */
let clumpTimer = 0;
/* would a clump of this mass and size survive being born here? */
/* the strongest tide pulling across something of this mass and size, here,
   measured against its own grip on itself. One is the Roche limit. */
function tideAt(x, y, m, r){
  let worst=0;
  for(const h of bodies){
    const dx=x-h.x, dy=y-h.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1e-6;
    const s=TIDE_K*(h.m*r*r*r)/(d*d*d*Math.max(1e-6,m));
    if(s>worst) worst=s;
  }
  return worst;
}
function tornIfBornAt(x, y, m, r){ return tideAt(x,y,m,r) > 1; }
function accrete(dt){
  clumpTimer -= dt;
  if(clumpTimer > 0) return;
  clumpTimer = 0.5;
  if(bodies.length >= MAX_BODIES) return;

  const cells = new Map();
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    /* Rubble is not this pass's business. A cloud knows it is one, and it
       becomes a body when its own motion has died down — grabbing a seven-unit
       cell out of the middle of one and calling that a planet just shreds a
       melt into gravel. */
    if(p.kind==='gas' || p.ring || p.blob || !p.settled) continue;
    const cx = Math.floor(p.x/CLUMP_CELL), cy = Math.floor(p.y/CLUMP_CELL);
    const key = cx+','+cy;
    let c = cells.get(key);
    if(!c){ c=[]; cells.set(key,c); }
    c.push(i);
  }
  const doomed = new Set();
  for(const group of cells.values()){
    if(group.length < CLUMP_MIN) continue;
    let mx=0,my=0,mvx=0,mvy=0;
    for(const i of group){ const p=parts[i]; mx+=p.x; my+=p.y; mvx+=p.vx; mvy+=p.vy; }
    const n=group.length;
    mx/=n; my/=n; mvx/=n; mvy/=n;
    /* only if they are genuinely travelling together */
    let spread=0;
    for(const i of group){ const p=parts[i]; spread+=Math.hypot(p.vx-mvx,p.vy-mvy); }
    if(spread/n > CLUMP_SPREAD) continue;

    let mass=0; for(const i of group) mass+=parts[i].pm;
    /* what it grew up to be */
    const kindId = mass < 1.4 ? 'asteroid' : mass < 5 ? 'moon' : 'dwarfp';
    const k = kindById(kindId);
    const spec = specFromKind(k);
    /* Nothing forms where the tide would take it apart again. This is the same
       test tides() runs, asked before the body exists rather than after — the
       stream falling into a hole would otherwise keep condensing into little
       worlds and merging back into the one being shredded. */
    if(tornIfBornAt(mx, my, mass, radiusFor(mass, densityOf(spec)))) continue;
    /* wear the colour of the rubble it came from */
    let rr=0,gg=0,bb=0;
    for(const i of group){ const p=parts[i]; rr+=p.r; gg+=p.g; bb+=p.b; }
    spec.pal = nearestPalette(rr/n, gg/n, bb/n);
    const nb = addBody(makeBody(mx,my,mvx,mvy,spec,mass));
    if(!nb) break;
    nb.name = k.name;
    nb.flash = 0.5;
    for(const i of group) doomed.add(i);
    if(bodies.length >= MAX_BODIES) break;
  }
  if(doomed.size){
    const keep=[];
    for(let i=0;i<parts.length;i++) if(!doomed.has(i)) keep.push(parts[i]);
    parts = keep;
    accelerate();
    for(const b of bodies){ b.ax=b.nax; b.ay=b.nay; }
  }
}
function nearestPalette(r,g,b){
  let best='barren', bestD=Infinity;
  for(const key of PAL_KEYS){
    const c=PALETTES[key].ramp[4];
    const d=(c[0]-r)**2+(c[1]-g)**2+(c[2]-b)**2;
    if(d<bestD){ bestD=d; best=key; }
  }
  return best;
}
/* rock ejecta glows white-hot and fades down through orange to its own colour */
function heatColor(base, heat){
  if(heat<=0) return base;
  /* the same run as the debris uses: hue from the temperature, the material
     showing through as how light or dark it is */
  const t = heat<0.5 ? heat/0.5 : (heat-0.5)/0.5;
  const hot = heat<0.5 ? [170+85*t, 40+80*t, 10+10*t]
                       : [255, 120+100*t, 20+130*t];
  const sh = 0.55+0.5*(0.3*base[0]+0.6*base[1]+0.1*base[2])/255;
  return mixRGB(base, [hot[0]*sh,hot[1]*sh,hot[2]*sh], Math.min(0.9, clamp01(heat*1.1)));
}

/* ============================ shockwaves ============================ */
/* An expanding front that shoves whatever it overtakes. One pass per frame over
   the debris, so it stays cheap even when several are running at once. */
let waves = [];
function addWave(x,y,maxR,strength,rgb,vx,vy){
  waves.push({x,y,r:0,maxR,strength,rgb,vx:vx||0,vy:vy||0,dead:false});
}
function stepWaves(dt){
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i];
    const prev=w.r;
    w.r += SHOCK_SPEED*dt;
    w.x += w.vx*dt; w.y += w.vy*dt;
    const fall = 1 - w.r/w.maxR;                     /* it weakens as it spreads */
    if(fall>0){
      const push = w.strength*fall;
      for(let k=0;k<parts.length;k++){
        const p=parts[k];
        const dx=p.x-w.x, dy=p.y-w.y;
        const d=Math.hypot(dx,dy)||1e-6;
        /* only what the front crossed during this step */
        if(d>prev && d<=w.r){
          p.vx += dx/d*push; p.vy += dy/d*push;
          if(p.kind!=='gas') p.heat = Math.min(1, p.heat+0.4);
        }
      }
      for(let k=0;k<bodies.length;k++){
        const b=bodies[k];
        const dx=b.x-w.x, dy=b.y-w.y;
        const d=Math.hypot(dx,dy)||1e-6;
        if(d>prev && d<=w.r){
          /* a blast moves a pebble far more than it moves a world */
          const g = push*40/Math.max(1,b.m);
          b.vx += dx/d*g; b.vy += dy/d*g;
          if(!b.lum) b.heat = Math.min(1, b.heat + Math.min(0.5, g*0.4));
        }
      }
    }
    if(w.r>=w.maxR) waves.splice(i,1);
  }
}

/* ============================ collapse ============================ */
/* A star that gets too heavy goes supernova and leaves a neutron star. Anything
   that gets heavier still leaves a black hole. The shell it throws off is the
   nebula. */
function collapseCheck(){
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.hole) continue;
    if(b.m>=HOLE_MASS) collapseTo(b,'hole');
    else if(b.m>=NEUTRON_MASS && b.spec.cls!=='exotic') collapseTo(b,'neutron');
  }
}
function collapseTo(b, kindId){
  const k = kindById(kindId);
  const pal = (PALETTES[b.spec.pal]||PALETTES.amber).ramp;
  const shed = kindId==='hole' ? 0.18 : 0.45;      /* how much it throws away */
  const thrown = b.m*shed;

  /* Every nebula gets its own colour. Real ones take theirs from whatever the
     star was made of and how hard the shock is hitting it, which is not
     something worth simulating — but the fact that no two look alike is worth
     keeping, so the tint is rolled per collapse and every mote of this one
     shares it. The shape is not rolled at all: it comes out of where the shell
     happens to be thrown and what gravity does to it afterwards. */
  const hue = Math.random()*6.283;
  const tint = [ 128+120*Math.sin(hue), 128+120*Math.sin(hue+2.09), 128+120*Math.sin(hue+4.19) ];
  const mix  = 0.35+Math.random()*0.4;

  /* a few hundred motes is a spray; a nebula needs enough of them that the
     depth field has structure to it */
  const n = Math.min(4200, Math.round(600+thrown*0.9));
  /* likewise: the shell is made of what the star threw off, so however many
     motes it takes to look like a nebula, between them they weigh that */
  const shellPM = thrown/n;
  const vShell = kindId==='hole' ? 16 : 26;
  for(let j=0;j<n;j++){
    const a=Math.random()*Math.PI*2;
    /* Speed varies a lot across the shell, and that alone is what stops it
       staying a ring: the fast side runs away, the slow side falls back, and
       gravity does the rest. */
    const sp=vShell*(0.8+Math.random()*0.45);
    const rr=b.r*(0.9+Math.random()*0.5);
    /* most of it is the glowing shell; the rest stays hot rubble */
    const gasy = Math.random()<0.78;
    const base = rampAt(pal, 0.45+Math.random()*0.5);
    const col = gasy ? mixRGB(base, tint, mix*(0.5+Math.random()*0.7)) : base;
    const q = spawnPart(b.x+Math.cos(a)*rr, b.y+Math.sin(a)*rr,
              b.vx+Math.cos(a)*sp, b.vy+Math.sin(a)*sp,
              gasy?'gas':'rock',
              col,
              gasy?0:1,
              /* a nebula is the part of this that is still there much later */
              gasy? 2600+Math.random()*2200 : 60+Math.random()*90,
              shellPM);
    if(q && gasy){
      q.puff   = 3.0+Math.random()*5.5;
      q.dep    = 2.0+Math.random()*2.4;
      q.spread = 2.2+Math.random()*1.8;
    }
  }
  addWave(b.x,b.y, b.r*26+220, kindId==='hole'?5.5:8.5,
          kindId==='hole'?[190,150,255]:[255,226,180], b.vx, b.vy);
  b.m = Math.max(1, b.m-thrown);
  b.spec = specFromKind(k, b.spec.seed);
  b.name = k.name;
  b.hole = k.hole||0;
  b.lum = 0; b.gas = 0; b.comet = 0;
  b.heat = b.hole ? 0 : 1;
  b.r = radiusFor(b.m, densityOf(b.spec));
  b.flash = 1;
  b.trail.length = 0;
  once('collapse', kindId==='hole'
    ? 'It collapsed. Nothing that heavy holds itself up.'
    : 'Supernova. The shell it threw off is the nebula.');
}


/* ============================ rubble clouds ============================ */
/* A cloud of motes that pull on each other, so it holds a shape. Cohesion is
   the monopole term — every mote toward the cloud's own centre of mass — which
   is what dominates for a roughly round blob and costs one pass instead of the
   n^2 every pair would. Cheap enough that a world can be several thousand
   motes and still run.

   The clouds are re-split from scratch every so often by spatial connectivity,
   so when one pulls into two, each half starts holding itself together
   separately. That is what lets a stretched world pinch off a bead rather than
   smearing into one endless string, and none of the shapes it makes are drawn
   by us. */
let blobs = [];
let blobTimer = 0;
const BLOB_SPLIT = 1.8;  /* multiples of the rest spacing before it is two clouds */
const BLOB_MIN  = 10;    /* smaller than this is just dust, not a body */

function stepBlobs(){
  if(!blobs.length) return;
  for(const b of blobs){ b.sx=0; b.sy=0; b.sm=0; b.n=0; }
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(!p.blob) continue;
    if(p.blob<0) continue;            /* claimed, waiting on the next re-cluster */
    const b=blobs[p.blob-1];
    if(!b){ p.blob=0; continue; }
    b.sx+=p.x*p.pm; b.sy+=p.y*p.pm; b.sm+=p.pm; b.n++;
  }
  for(const b of blobs){
    if(b.n && b.sm>0){
      b.x=b.sx/b.sm; b.y=b.sy/b.sm; b.m=b.sm;
      b.r=radiusFor(b.m, b.dens);
    } else b.m=0;
  }
}
/* re-cluster the rubble by who is still touching whom */
function reblob(){
  let cell=0;
  for(let i=0;i<parts.length;i++) if(parts[i].blob && parts[i].cell>cell) cell=parts[i].cell;
  cell = (cell||1)*BLOB_SPLIT;
  const grid=new Map(), mine=[];
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(!p.blob) continue;
    mine.push(i);
    const key=Math.floor(p.x/cell)+','+Math.floor(p.y/cell);
    let c=grid.get(key);
    if(!c){ c=[]; grid.set(key,c); }
    c.push(i);
  }
  if(!mine.length){ blobs.length=0; return; }
  const seen=new Uint8Array(parts.length);
  const next=[];
  for(const start of mine){
    if(seen[start]) continue;
    const group=[start]; seen[start]=1;
    const stack=[start];
    while(stack.length){
      const j=stack.pop(), q=parts[j];
      const cx=Math.floor(q.x/cell), cy=Math.floor(q.y/cell);
      for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++){
        const c=grid.get((cx+ox)+','+(cy+oy));
        if(!c) continue;
        for(const k of c) if(!seen[k]){ seen[k]=1; group.push(k); stack.push(k); }
      }
    }
    if(group.length<BLOB_MIN){
      /* too little left to hold itself together: it is loose debris now */
      for(const j of group) parts[j].blob=0;
      continue;
    }
    let sx=0,sy=0,sm=0,dens=0,vx=0,vy=0;
    for(const j of group){
      const q=parts[j];
      sx+=q.x*q.pm; sy+=q.y*q.pm; sm+=q.pm; dens=q.dens||dens;
      vx+=q.vx*q.pm; vy+=q.vy*q.pm;
    }
    const b={x:sx/sm, y:sy/sm, m:sm, dens:dens||100, n:group.length, sx:0, sy:0, sm:0};
    b.r=radiusFor(b.m,b.dens);
    b.vx=vx/sm; b.vy=vy/sm;
    /* Molten rock sloshing about is not a planet yet. It becomes one when its
       own gravity has beaten the motion inside it — which is a thing that
       takes time, because what removes that motion is the pieces knocking into
       each other. Nothing schedules it; the cloud simply stops sloshing. */
    if(settleToBody(group, b)) continue;
    next.push(b);
    const id=next.length;
    for(const j of group) parts[j].blob=id;
  }
  blobs=next;
  /* motes a settle just turned into a body. Ids were handed out against
     `next` rather than against the array, so removing these disturbs nothing. */
  if(parts.some(q=>q.dead)){
    parts = parts.filter(q=>!q.dead);
    accelerate();
    for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; }
  }
}

/* Rubble does not collapse to a point, and the reason is not gravity — it is
   that the pieces are touching. Without something holding them apart a cold
   self-gravitating cloud falls straight in on itself, which is real physics
   and completely wrong for a pile of rock.

   So the pieces push apart when they overlap. This is done by moving them
   rather than by applying a force: a spring stiff enough to hold a world up
   would explode the first time the clock ran at sixty times, and a positional
   pass cannot, whatever dt is. It loses energy doing it, which is also what a
   pile of gravel does. */
const RELAX = 0.5;
/* how much of an approach survives a hit — rock on rock, almost none */
const CONTACT_E = 0.05;
const RELAX_PASSES = 2;   /* one pass does not fully resolve a packed interior */
/* the grid is built once and both passes run over it: the motes move by a
   fraction of a cell in a pass, so rebinning between them buys nothing */
function rubbleContacts(){
  if(!blobs.length) return;
  let cell=0, count=0;
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(!p.blob) continue;
    count++;
    if(p.cell>cell) cell=p.cell;
  }
  if(!count || cell<=0) return;
  const inv=1/cell;
  const grid=new Map();
  const keys=[];
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(!p.blob) continue;
    p.nb=0;
    /* one integer per cell rather than "x,y": no string to build or hash, and
       at this call rate that alone was worth having */
    const key=(Math.floor(p.x*inv)+32768)*65536 + (Math.floor(p.y*inv)+32768);
    let c=grid.get(key);
    if(!c){ c=[]; grid.set(key,c); keys.push(key); }
    c.push(i);
  }
  /* self, +y, +x, +x+y, +x-y — half the neighbourhood. With their opposites
     coming from the other cell's turn, every adjacent pair is visited once. */
  const NEIGH=[0, 1, 65536, 65537, 65535];
  for(let it=0; it<RELAX_PASSES; it++){
    for(let k=0;k<keys.length;k++){
      const key=keys[k], list=grid.get(key);
      for(let nb=0;nb<5;nb++){
        const other = nb===0 ? list : grid.get(key+NEIGH[nb]);
        if(!other) continue;
        const self = nb===0;
        for(let a=0;a<list.length;a++){
          const p=parts[list[a]];
          for(let bi=self?a+1:0; bi<other.length; bi++){
            const q=parts[other[bi]];
            const dx=q.x-p.x, dy=q.y-p.y;
            /* a shade over the spacing they were laid out at, so a world that
               has only just crumbled is already resting on itself rather than
               settling inward first */
            const rest=(p.cell+q.cell)*0.54;
            const d2=dx*dx+dy*dy;
            if(d2>=rest*rest || d2<1e-12) continue;
            const d=Math.sqrt(d2);
            const push=(rest-d)*0.5*RELAX;
            const nx=dx/d, ny=dy/d;
            p.x-=nx*push; p.y-=ny*push;
            q.x+=nx*push; q.y+=ny*push;
            /* And they hit each other, which is the part that matters. Pushing
               them apart by position alone stores no energy and loses none, so
               two clouds driven together slide through and out the far side.
               Rock arriving at rock is very nearly perfectly inelastic: almost
               none of the approach survives the hit, and that is what makes a
               collision a merge rather than a bounce. It can only ever reduce
               an approach, never create one, so no timestep can blow it up. */
            if(it===0){
              /* touching, so each of them is that much less exposed */
              p.nb++; q.nb++;
              const rvn=(q.vx-p.vx)*nx + (q.vy-p.vy)*ny;
              if(rvn<0){
                const jn = -(1+CONTACT_E)*rvn/(1/p.pm + 1/q.pm);
                p.vx-=jn*nx/p.pm; p.vy-=jn*ny/p.pm;
                q.vx+=jn*nx/q.pm; q.vy+=jn*ny/q.pm;
              }
            }
          }
        }
      }
    }
  }
}

/* How fast the inside of a cloud is still moving, against how fast it would
   have to move to leave. Under about a third and it is a body, not a cloud. */
const SETTLE_FRAC = 0.34;
/* Liquid rock is not a world. A melt has to lose its heat before it can be
   one — nothing else about it changes at this number, it is simply the point
   below which the material has gone stiff and stopped being a fluid. */
const SOLID_HEAT = 0.35;
/* And it has to be round. Not close enough to round to pass for it: a cloud
   between two sloshes is momentarily quiet without being anything like a
   sphere, and a peanut that has stopped wobbling is still a peanut. What
   makes a planet round is its own gravity winning against the shape it
   happened to be left in, and until that has happened it is not a planet. */
const ROUND_MAX = 1.3;
/* long axis over short, from the mass distribution: the eigenvalues of the
   second-moment matrix are the squares of the two axes. */
function axisRatio(Sxx, Syy, Sxy){
  const half=(Sxx+Syy)/2;
  const d=Math.sqrt(((Sxx-Syy)/2)*((Sxx-Syy)/2) + Sxy*Sxy);
  const lo=half-d;
  if(lo<=1e-9) return 99;
  return Math.sqrt((half+d)/lo);
}
function isRound(Sxx, Syy, Sxy){ return axisRatio(Sxx,Syy,Sxy) <= ROUND_MAX; }
/* what the last cloud to become a world looked like at the moment it did */
let lastSettle=null;
function settleToBody(group, b){
  b.why='';
  if(bodies.length>=MAX_BODIES) return false;
  if(group.length < 40){ b.why='small'; return false; }
  /* Spin is not sloshing. A cloud turning as a whole is already a body — that
     is what a rotating planet is — so the bulk rotation comes out before the
     dispersion is measured, or an off-centre hit could never settle at all. */
  let L=0, I=0, Sxx=0, Syy=0, Sxy=0;
  for(const j of group){
    const q=parts[j];
    const dx=q.x-b.x, dy=q.y-b.y;
    L += q.pm*(dx*(q.vy-b.vy) - dy*(q.vx-b.vx));
    I += q.pm*(dx*dx+dy*dy);
    Sxx += q.pm*dx*dx; Syy += q.pm*dy*dy; Sxy += q.pm*dx*dy;
  }
  const w = I>1e-9 ? L/I : 0;

  let s2=0, hot=0, gas=0, rock=0, rr=0, gg=0, bb=0;
  for(const j of group){
    const q=parts[j];
    const dx=q.x-b.x, dy=q.y-b.y;
    const dvx=q.vx-b.vx + w*dy, dvy=q.vy-b.vy - w*dx;
    s2 += (dvx*dvx+dvy*dvy)*q.pm;
    /* only the rock has a melting point. Gas that has been through a collision
       is hot too, and it does not care: there is nothing in it that has to go
       stiff before it can be a planet, so a gas world re-forms as soon as
       gravity has gathered it. */
    if(q.kind==='gas') gas += q.pm; else { rock += q.pm; hot += q.heat*q.pm; }
    rr+=q.r; gg+=q.g; bb+=q.b;
  }
  const sigma = Math.sqrt(s2/b.m);
  const heat  = rock>1e-9 ? hot/rock : 0;
  const vesc  = Math.sqrt(2*G*b.m/Math.max(0.55,b.r));
  b.sigma=sigma; b.vesc=vesc; b.spin=w; b.round=axisRatio(Sxx,Syy,Sxy); b.hot=heat;
  if(sigma > SETTLE_FRAC*vesc){ b.why='sloshing'; return false; }
  /* but a cloud spinning fast enough to throw its own edge off is not one
     either — it is about to shed, and it should be left to do that */
  if(Math.abs(w)*b.r > 0.8*vesc){ b.why='spinning'; return false; }
  /* still liquid: gravity may have gathered it, but what it has gathered is a
     ball of magma, and that is a thing you can watch cool rather than a world */
  if(heat > SOLID_HEAT){ b.why='molten'; return false; }
  /* And gravity has to have actually pulled it round — but only where gravity
     is the thing deciding its shape. Under a real tide the equilibrium figure
     is not a sphere, it is a prolate one drawn out along the pull, so holding
     out for a sphere would mean nothing near a hole ever pulled itself back
     together. The long and short axes come out of the second moments the spin
     did. */
  if(tideAt(b.x, b.y, b.m, b.r) < 0.25 && !isRound(Sxx, Syy, Sxy)){ b.why='lumpy'; return false; }
  /* and not somewhere it would be pulled straight back apart */
  if(tornIfBornAt(b.x, b.y, b.m, b.r)){ b.why='tide'; return false; }

  const gassy = gas > b.m*0.5;
  const kindId = gassy ? (b.m>220?'gas':'icegiant')
               : b.m<1.4 ? 'asteroid' : b.m<5 ? 'moon' : b.m<26 ? 'dwarfp'
               : heat>0.5 ? 'molten' : 'rocky';
  const k = kindById(kindId);
  const spec = specFromKind(k);
  const n = group.length;
  /* it wears the colour of everything that went into it, which after two
     worlds have mixed is neither of the colours they started as */
  spec.pal = nearestPalette(rr/n, gg/n, bb/n);
  spec.dens = b.dens;
  const nb = addBody(makeBody(b.x, b.y, b.vx, b.vy, spec, b.m));
  if(!nb) return false;
  nb.name = k.name;
  nb.heat = Math.max(nb.heat||0, heat);
  nb.spin = w;                     /* it keeps the turn it gathered with */
  nb.flash = 0.5;
  lastSettle={round:+axisRatio(Sxx,Syy,Sxy).toFixed(3), heat:+heat.toFixed(3),
              spin:w, sigma:+(sigma/vesc).toFixed(3), n:group.length, m:b.m,
              tide:+tideAt(b.x,b.y,b.m,b.r).toFixed(3)};
  for(const j of group) parts[j].dead = true;
  return true;
}

/* ============================ tidal disruption ============================ */
/* Close enough to a hole and the pull across a body beats the grip the body
   has on itself, and it stops being a rigid thing.

   Nothing here draws that. The body is replaced, once, by rubble sampled
   straight out of its own sprite — one mote per pixel, in place, at the speed
   the body was going — so the instant it happens looks like nothing happened.
   From then on it is only motes: their own gravity holding them together, the
   hole's pulling harder on the near side than the far one. Whether that ends
   in a teardrop, a bar that pinches in the middle, one lump shedding a tail,
   or a string of beads is not a case we handle. It is what those two forces
   do to a few thousand particles. */
function tides(dt){
  for(let i=bodies.length-1;i>=0;i--){
    const b=bodies[i];
    if(b.hole) continue;
    let worst=0, ang=0;
    for(const h of bodies){
      if(h===b) continue;
      const dx=b.x-h.x, dy=b.y-h.y;
      const d=Math.hypot(dx,dy)||1e-6;
      /* Contact is the collision's business, not the tide's. */
      if(d <= h.r+b.r) continue;
      /* Tidal pull across the body against the body's own grip on itself.
         Nothing about this is particular to black holes — a star raises a tide
         on a planet, a planet raises one on its moon, and a big enough
         anything close enough will take a world apart. What makes holes look
         special is only that they pack the mass into no radius, so you can get
         close enough for it to matter. TIDE_K is the fluid coefficient:
         something that can deform comes apart at roughly twice the distance a
         rigid body would, and 2^3 in here is that factor. */
      let stress = TIDE_K*(h.m*b.r*b.r*b.r)/(d*d*d*Math.max(1e-6,b.m));
      /* Self-gravity is not the only thing holding a body together — it is
         also made of something. Cohesion adds an acceleration that goes as
         1/r, so against surface gravity it falls off as 1/r^2: negligible for
         a world, decisive for a small one. That is why there are moons and
         rubble sitting well inside limits that would shred a fluid body, and
         without it every close pass ends in gravel. */
      stress /= 1 + COHESION*b.r/(G*Math.max(1e-6,b.m));
      if(stress>worst){ worst=stress; ang=Math.atan2(dy,dx); }
    }
    b.tideAng = ang;
    /* Coming apart is not instant. A body has to sit inside the limit for
       something like its own free-fall time before it has actually flowed
       anywhere, so a fast pass through the zone survives and a slow approach
       or a captured orbit does not. Nothing else distinguishes the two. */
    if(worst>1){
      const tDyn = Math.sqrt(b.r*b.r*b.r/(G*Math.max(1e-6,b.m)));
      b.tideT = (b.tideT||0) + dt*(worst-1);
      if(b.tideT > tDyn){ crumble(b); continue; }
    } else if(b.tideT) {
      b.tideT = Math.max(0, b.tideT - dt*2);
    }
    /* Below that it holds together, but not in the shape it would have alone.
       A body in a tidal field settles into a prolate figure pointed at what is
       pulling on it, and how far from round it gets is the same number that
       decides whether it survives at all. Reaches about 1.35:1 just before the
       limit, which is roughly where a real fluid body gives up. */
    b.stretch += (worst - b.stretch)*Math.min(1, dt*1.5);
  }
}
/* Every pixel of a body's sprite, as a world position and a colour. Both the
   crumble and the scraping a graze does work off the same pixels, so a world
   comes apart into the terrain it was actually wearing. */
function spritePixels(b, want){
  const res = Math.max(7, Math.min(72, Math.round(Math.sqrt(want/0.785))));
  const sp = makeSprite(b.spec, res);
  const g = document.createElement('canvas');
  g.width=g.height=res;
  const gc=g.getContext('2d');
  gc.imageSmoothingEnabled=false;
  gc.drawImage(sp,0,0);
  const D = gc.getImageData(0,0,res,res).data;
  const step = (b.r*2)/res;
  const sin=Math.sin(b.ang||0), cos=Math.cos(b.ang||0);
  const out=[];
  for(let py=0;py<res;py++){
    for(let px=0;px<res;px++){
      const k=(py*res+px)*4;
      if(D[k+3]<=8) continue;
      /* where this pixel actually sits on the body, spun with it */
      const ox=(px+0.5-res/2)*step, oy=(py+0.5-res/2)*step;
      out.push({x:b.x+ox*cos-oy*sin, y:b.y+ox*sin+oy*cos,
                r:D[k], g:D[k+1], b:D[k+2]});
    }
  }
  return {px:out, step};
}
/* the body, as rubble, in place — one mote per sprite pixel */
function crumble(b, hot, cap){
  const dens = densityOf(b.spec);
  /* enough motes to look solid, few enough that a heavy world is affordable.
     Whatever the count works out to, the mass is divided between them, so what
     the hole eventually eats is exactly what it was. */
  const want = Math.max(90, Math.min(cap||3600, Math.round(b.m/PART_MASS)));
  const {px, step} = spritePixels(b, want);
  const pm = b.m/Math.max(1,px.length);
  const heat = hot===undefined ? (b.heat||0) : hot;
  for(const c of px){
    /* not every part of it is equally hot, and the variation is what stops a
       melt reading as one flat glowing shape */
    /* spread across the orange band rather than piled at white-hot, or the
       whole thing reads as one pale glare instead of molten rock */
    const h = heat>0 ? Math.min(1, heat*(0.35+Math.random()*0.55)) : heat;
    const q=spawnPart(c.x, c.y, b.vx, b.vy,
                      b.gas?'gas':'rock', [c.r,c.g,c.b], h, 1e9, pm, 1);
    /* how far apart these sat when they were still a world: the distance they
       will hold each other at, and the distance beyond which they have stopped
       touching and are no longer the same object */
    if(q){
      q.dens=dens; q.cell=step; q.blob=-1;
      /* gas rubble is still gas: it is drawn as depth, and a parcel this size
         is what one sprite pixel of a gas world was worth */
      if(q.kind==='gas'){ q.puff=step*1.5; q.dep=1.1; q.spread=0.05; }
    }
  }
  b.dead=true;
  if(selected===b) selected=null;
  if(following===b) following=null;
  bodies=bodies.filter(q=>!q.dead);
  accelerate();
  for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; }
  /* deliberately not re-clustered here. A cloud that has only just been made
     has no internal motion at all — every mote still carries the velocity of
     the world it was — so clustering it this instant would find it perfectly
     settled and hand it straight back as a body. It waits for the next
     re-cluster, by which time anything else that crumbled alongside it is part
     of the same cloud and the two are moving through each other. */
  once('tide','Past the Roche limit. It cannot hold itself together any more.');
}

/* Material scraped off one body by another passing through it. The pixels that
   actually overlapped are the ones that leave, which is as close to doing this
   per-pixel as is worth being: what comes off depends on how deep the other
   body cut and where. It leaves at the speed its own world was going, so
   momentum takes care of itself, and it is ordinary debris afterwards — which
   is why the other body picks a lot of it up on the way past. */
function shave(victim, other, frac, pen){
  const dens = densityOf(victim.spec);
  const want = Math.max(60, Math.min(1400, Math.round(victim.m/PART_MASS)));
  const {px, step} = spritePixels(victim, want);
  if(!px.length) return 0;
  const pm = victim.m/px.length;
  const cap = Math.floor(px.length*frac);
  const r2 = other.r*other.r;
  /* What comes off is what would have been inside the other body at closest
     approach, not what happens to be inside it on the frame they first touch —
     at that instant the overlap is zero and nothing would ever be scraped. So
     the pixels are tested against where the encounter was actually taking
     them, and the ones that lose are removed from where they really are. */
  const ux=other.x-victim.x, uy=other.y-victim.y;
  const ul=Math.hypot(ux,uy)||1e-6;
  const sx=ux/ul*(pen||0), sy=uy/ul*(pen||0);
  const hits=[];
  for(const c of px){
    const dx=c.x+sx-other.x, dy=c.y+sy-other.y;
    if(dx*dx+dy*dy < r2) hits.push(c);
  }
  if(!hits.length) return 0;
  /* a graze takes a bite, it does not gut the thing */
  if(hits.length>cap) hits.length=cap;
  const heat = Math.min(1, 0.35+Math.random()*0.3);
  for(const c of hits){
    /* dragged along by what is ploughing through it */
    const k=0.25+Math.random()*0.35;
    const q = spawnPart(c.x, c.y,
              victim.vx+(other.vx-victim.vx)*k,
              victim.vy+(other.vy-victim.vy)*k,
              victim.gas?'gas':'rock', [c.r,c.g,c.b], victim.gas?0:heat,
              victim.gas?260+Math.random()*220:220+Math.random()*160,
              pm, 1);
    if(q){ q.cell=step; q.dens=dens; }
  }
  const lost = hits.length*pm;
  victim.m = Math.max(pm, victim.m-lost);
  victim.r = radiusFor(victim.m, dens);
  victim.heat = Math.min(1, victim.heat + 0.18);
  return lost;
}


/* ============================ collisions ============================ */
/* A gentle touch merges. A real impact shatters: the smaller body is turned
   into molten ejecta thrown out along the impact, and the survivor keeps only
   what it actually swept up. Gas bodies throw gas instead of rock. */
const SHATTER_SPEED = 5.5;
/* How hard a graze bounces, and how much of the sideways motion it eats. Rock
   hitting rock is close to perfectly inelastic; almost none of the energy comes
   back, it goes into heat and into the material that gets thrown off. */
const GRAZE_BOUNCE  = 0.12;
/* Impact energy against the energy holding the pair together, above which
   neither one stays solid. Two equal worlds meeting at exactly the speed they
   would fall together at come in at a quarter of this, so a touch merges; it
   takes something like two and a half times that speed to liquefy them. */
const MELT_Q = 1.4;
const GRAZE_FRICTION= 0.10;
function collide(){
  let changed = false;
  for(let i=0;i<bodies.length;i++){
    const a=bodies[i]; if(a.dead) continue;
    for(let j=i+1;j<bodies.length;j++){
      const b=bodies[j]; if(b.dead) continue;
      const dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r;
      const d2=dx*dx+dy*dy;
      if(d2 > rr*rr) continue;
      const heavy = a.m>=b.m ? a : b, light = heavy===a ? b : a;
      const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
      const impact = Math.hypot(rvx,rvy);

      /* A hole eats whatever touches it, and a pebble against a world is just
         accretion. Everything else gets asked how square the hit was. */
      if(!heavy.hole && light.m >= heavy.m*0.02){
        const d=Math.sqrt(d2)||1e-6;
        const nx=dx/d, ny=dy/d;
        const vn = rvx*nx + rvy*ny;                    /* closing speed */
        const tvx = rvx - vn*nx, tvy = rvy - vn*ny;    /* and sideways */
        const vt = Math.hypot(tvx,tvy);
        /* The impact parameter — how far the line one is travelling along
           misses the other's centre by. sin of the impact angle is that over
           the sum of the radii, and it is the number the whole outcome hangs
           on. Measured off the approach rather than off the overlap, which is
           nearly zero at the instant they first touch. */
        const bpar = impact>1e-9 ? Math.abs(dx*rvy - dy*rvx)/impact : 0;
        const sinT = Math.min(1, bpar/rr);
        /* Past about thirty degrees they clip each other, trade some mantle
           and some momentum, and both carry on. This is the hit-and-run
           regime, and it is the commonest outcome of two worlds meeting — a
           merge needs a much squarer hit than people expect. Fast enough and
           even a graze is erosive rather than survivable. */
        if(vn < 0 && sinT > 0.55 && impact < SHATTER_SPEED*3){
          grazeOff(a,b,heavy,light,nx,ny,d,rr,bpar,vn,tvx,tvy,vt,impact);
          changed = true;
          continue;
        }
      }
      changed = true;
      if(heavy.hole || light.m < heavy.m*0.02){ mergeBodies(a,b); continue; }

      /* Whether a square hit melts the pair comes from energy, not speed. The
         impact carries this much kinetic energy per unit of the mass involved;
         holding the pair together against it costs about this much. When the
         first beats the second, neither one is solid afterwards — which for
         two worlds of comparable size is what happens at around the speed they
         would fall together at anyway. */
      const mu = heavy.m*light.m/(heavy.m+light.m);
      const Q  = 0.5*mu*impact*impact/(heavy.m+light.m);
      const Qbind = G*(heavy.m+light.m)/Math.max(0.55, heavy.r+light.r);
      if(light.m > heavy.m*0.1 && Q > MELT_Q*Qbind){ meltPair(a,b,impact); continue; }

      if(impact < SHATTER_SPEED) mergeBodies(a,b);
      else shatter(heavy, light, impact);
    }
  }
  if(changed){
    if(bodies.some(b=>b.dead)) bodies = bodies.filter(b=>!b.dead);
    /* Stored accelerations refer to a set of bodies that no longer exists. */
    accelerate();
    for(const b of bodies){ b.ax=b.nax; b.ay=b.nay; }
  }
}
/* Two worlds hit hard enough to liquefy. Neither survives as a body: both are
   turned into their own pixels, molten, still carrying the velocity they came
   in with. Everything after that is the rubble doing what rubble does — the
   two clouds drive through each other, knock about, lose the motion to those
   collisions, and their own gravity gathers what is left. It comes back as one
   round thing wearing a colour that is neither of the two that went in, and it
   is still glowing for a good while afterwards. None of that is animated; the
   time it takes is however long the sloshing takes to die down. */
function meltPair(a,b,impact){
  /* a heavy pair could be two full clouds at once, so each gets a smaller
     share of the budget than a lone world being torn apart would */
  const cap = 1800;
  crumble(a, 1, cap);
  crumble(b, 1, cap);
  addWave((a.x+b.x)/2, (a.y+b.y)/2, Math.max(140, (a.r+b.r)*7+impact*9),
          Math.min(1.2, impact*0.05), [255,208,150],
          (a.vx*a.m+b.vx*b.m)/(a.m+b.m), (a.vy*a.m+b.vy*b.m)/(a.m+b.m));
  once('melt','Both of them went liquid. Give it a moment to pull back together.');
}
function grazeOff(a,b,heavy,light,nx,ny,d,rr,bpar,vn,tvx,tvy,vt,impact){
  /* How deep the cut is decides how much comes off: how far inside the sum of
     the radii the approach would have carried it. A clip at the edge takes a
     sliver; nearly through the middle takes a good bite out of both. */
  const cut = Math.min(1, (rr-bpar)/Math.max(1e-6, 2*light.r));
  const bite = Math.min(0.35, cut*0.45*Math.min(1.6, impact/SHATTER_SPEED));
  const pen = Math.max(0, rr-bpar);
  shave(light, heavy, bite, pen);
  /* the heavier one loses far less: it is the one doing the ploughing */
  shave(heavy, light, bite*0.25*(light.m/heavy.m), pen);

  const ma=a.m, mb=b.m, inv=1/ma+1/mb;
  /* an inelastic bounce along the line of centres */
  const jn = -(1+GRAZE_BOUNCE)*vn/inv;
  a.vx -= jn*nx/ma; a.vy -= jn*ny/ma;
  b.vx += jn*nx/mb; b.vy += jn*ny/mb;
  /* and drag across it, which is what actually deflects them */
  if(vt>1e-9){
    const f=GRAZE_FRICTION;
    a.vx += tvx*f*(mb/(ma+mb)); a.vy += tvy*f*(mb/(ma+mb));
    b.vx -= tvx*f*(ma/(ma+mb)); b.vy -= tvy*f*(ma/(ma+mb));
  }
  /* push them apart to just touching, or they collide again next step */
  const over = rr-d;
  if(over>0){
    const sa=over*(mb/(ma+mb)), sb=over*(ma/(ma+mb));
    a.x -= nx*sa; a.y -= ny*sa;
    b.x += nx*sb; b.y += ny*sb;
  }
  a.heat=Math.min(1,a.heat+0.12); b.heat=Math.min(1,b.heat+0.12);
  a.flash=Math.max(a.flash,0.35); b.flash=Math.max(b.flash,0.35);
  once('graze','A glancing hit. They scraped past each other and both survived.');
}
function mergeBodies(a,b){
  const heavy = a.m>=b.m ? a : b, light = heavy===a ? b : a;
  const M = a.m+b.m;
  const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
  const impact = Math.hypot(rvx,rvy);
  heavy.x=(a.x*a.m+b.x*b.m)/M; heavy.y=(a.y*a.m+b.y*b.m)/M;
  heavy.vx=(a.vx*a.m+b.vx*b.m)/M; heavy.vy=(a.vy*a.m+b.vy*b.m)/M;
  heavy.m=M; heavy.r=radiusFor(M, densityOf(heavy.spec));
  heavy.flash=Math.min(1,0.3+light.m/M);
  /* the energy of the impact goes into the surface, and it takes time to leave */
  if(!heavy.lum) heavy.heat = Math.min(1, heavy.heat + impact/14 + light.m/M*0.5);
  heavy.trail.length=0;
  if(impact>3 && light.m>2)
    addWave(heavy.x,heavy.y, heavy.r*8+impact*10, Math.min(3.5,impact*0.16),
            [255,214,160], heavy.vx, heavy.vy);
  light.dead=true;
  if(selected===light) selected=heavy;
  if(following===light) following=heavy;
}
function shatter(heavy, light, impact){
  const isGas = light.gas || heavy.gas;
  const pal = (PALETTES[light.spec.pal]||PALETTES.terran).ramp;
  const base = pal[Math.floor(pal.length*0.55)];
  const dx=light.x-heavy.x, dy=light.y-heavy.y;
  const d=Math.max(0.001,Math.hypot(dx,dy));
  const nx=dx/d, ny=dy/d;
  /* the debris carries the pair's momentum, plus a spray along the impact */
  const cmvx=(heavy.vx*heavy.m + light.vx*light.m)/(heavy.m+light.m);
  const cmvy=(heavy.vy*heavy.m + light.vy*light.m)/(heavy.m+light.m);
  const n = Math.min(isGas?1100:700, Math.round((isGas?110:62)*Math.cbrt(light.m)+90));
  /* The survivor keeps 42% of it; the rest is what these motes are made of.
     The count is chosen for how it looks, so the mass per mote has to follow
     from it — picking both independently was quietly creating matter. */
  const debrisPM = (light.m*0.58)/Math.max(1,n);
  /* Ejecta near the survivor's escape speed: some of it leaves, a lot of it
     falls back and strings itself into a ring, which is the good part. */
  const spread = Math.min(impact*0.30, 9);
  for(let k=0;k<n;k++){
    const a = Math.random()*Math.PI*2;
    const sp = spread*(0.25+Math.random()*0.95);
    /* biased outward along the impact normal so it looks like a splash, not a puff */
    const bx = nx*spread*0.55*Math.random(), by = ny*spread*0.55*Math.random();
    const jitter = light.r*(0.3+Math.random()*1.5);
    spawnPart(
      light.x + Math.cos(a)*jitter, light.y + Math.sin(a)*jitter,
      cmvx + Math.cos(a)*sp + bx, cmvy + Math.sin(a)*sp + by,
      isGas ? 'gas' : 'rock',
      isGas ? rampAt(pal, 0.45+Math.random()*0.4) : base,
      isGas ? 0 : 0.75+Math.random()*0.25,
      isGas ? 70+Math.random()*90 : 26+Math.random()*40,
      debrisPM
    );
  }
  /* the survivor absorbs a share and is left glowing */
  const kept = light.m*0.42;
  heavy.vx = (heavy.vx*heavy.m + light.vx*kept)/(heavy.m+kept);
  heavy.vy = (heavy.vy*heavy.m + light.vy*kept)/(heavy.m+kept);
  heavy.m += kept;
  heavy.r = radiusFor(heavy.m, densityOf(heavy.spec));
  if(!heavy.lum) heavy.heat = 1;
  heavy.flash = 1;
  /* A real impact announces itself. The push is kept light on purpose: the
     ejecta already carries the blast, and a strong front here just blows away
     the debris that should have been settling into a ring. */
  addWave(light.x,light.y, Math.max(160, light.r*16+impact*14),
          Math.min(1.8,impact*0.08), [255,196,140], cmvx, cmvy);
  heavy.trail.length = 0;
  light.dead = true;
  if(selected===light) selected=null;
  if(following===light) following=null;
}

/* ============================ physics ============================ */
function accelerate(){
  const n=bodies.length;
  for(let i=0;i<n;i++){ bodies[i].nax=0; bodies[i].nay=0; }
  for(let i=0;i<n;i++){
    const a=bodies[i];
    for(let j=i+1;j<n;j++){
      const b=bodies[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      const d2=dx*dx+dy*dy+SOFT*SOFT;
      const inv=1/Math.sqrt(d2);
      const f=G*inv*inv*inv;
      a.nax+=f*dx*b.m; a.nay+=f*dy*b.m;
      b.nax-=f*dx*a.m; b.nay-=f*dy*a.m;
    }
  }
}
/* Velocity Verlet: symplectic, so orbits keep their shape instead of spiralling
   the way plain Euler makes them. */
function integrate(dt){
  const n=bodies.length;
  for(let i=0;i<n;i++){
    const b=bodies[i];
    /* a world in your hand goes where the hand goes. It still pulls on
       everything else from wherever that is, and it still collides — the only
       thing suspended is what moves it. */
    if(b.held) continue;
    b.x+=b.vx*dt+0.5*b.ax*dt*dt;
    b.y+=b.vy*dt+0.5*b.ay*dt*dt;
  }
  accelerate();
  for(let i=0;i<n;i++){
    const b=bodies[i];
    if(b.held){ b.ax=b.nax; b.ay=b.nay; continue; }
    b.vx+=0.5*(b.ax+b.nax)*dt;
    b.vy+=0.5*(b.ay+b.nay)*dt;
    b.ax=b.nax; b.ay=b.nay;
  }
  collide();
}
function gravitySources(){
  const budget = sourceBudget();
  if(bodies.length<=budget) return bodies;
  return bodies.slice().sort((a,b)=>b.m-a.m).slice(0,budget);
}
function trailCap(){ return Math.max(14, Math.min(150, Math.round(3600/Math.max(1,bodies.length)))); }
/* Sampled by distance travelled, not per frame, so trails look the same at
   every speed instead of vanishing when slow. */
function recordTrails(){
  const cap=trailCap();
  for(const b of bodies){
    const t=b.trail, n=t.length;
    if(n>=2){
      const dx=b.x-t[n-2], dy=b.y-t[n-1];
      const minD=Math.max(0.7,b.r*0.5);
      if(dx*dx+dy*dy < minD*minD) continue;
    }
    t.push(b.x,b.y);
    while(t.length>cap*2) t.splice(0,2);
  }
}
function step(dt){
  /* Keep each substep near 1/90s of simulated time however fast the clock runs,
     or fast-forward turns circular orbits into spirals. */
  const sub = Math.max(SUBSTEPS, Math.min(36, Math.ceil(dt*90)));
  const h=dt/sub;
  for(let s=0;s<sub;s++) integrate(h);
  const src = gravitySources();
  stepBlobs();
  stepParts(dt, src);
  rubbleContacts();
  stepWaves(dt);
  /* re-split the rubble a few times a second: often enough that a piece
     tearing off starts holding itself together while you watch, rarely enough
     that the flood fill costs nothing */
  blobTimer -= dt;
  if(blobTimer<=0){ blobTimer=0.2; reblob(); }
  tides(dt);
  collapseCheck();
  accrete(dt);
  recordTrails();
  for(const b of bodies){
    if(b.flash>0) b.flash=Math.max(0,b.flash-dt*1.6);
    /* magma cools back to rock; stars stay lit */
    if(!b.lum && b.heat>0) b.heat = Math.max(0, b.heat - dt*0.035);
    b.ang += b.spin*dt;
  }
}

/* ============================ orbital helpers ============================ */
function dominant(x,y,ignore){
  let best=null,bestPull=0;
  for(const b of bodies){
    if(b===ignore||b.dead) continue;
    const dx=b.x-x, dy=b.y-y;
    const pull=b.m/(dx*dx+dy*dy+SOFT*SOFT);
    if(pull>bestPull){ bestPull=pull; best=b; }
  }
  return best;
}
function circularVelocity(x,y,host,sign){
  const dx=x-host.x, dy=y-host.y, r=Math.hypot(dx,dy);
  if(r<1e-6) return {vx:0,vy:0};
  const v=Math.sqrt(G*host.m/r), s=sign||1;
  return {vx:host.vx+(-dy/r)*v*s, vy:host.vy+(dx/r)*v*s};
}
function orbitOf(b){
  const host=dominant(b.x,b.y,b);
  if(!host) return null;
  const dx=b.x-host.x, dy=b.y-host.y, r=Math.hypot(dx,dy);
  const rvx=b.vx-host.vx, rvy=b.vy-host.vy;
  const v2=rvx*rvx+rvy*rvy, mu=G*(host.m+b.m);
  const e=v2/2-mu/r;
  if(e>=0) return {host,bound:false};
  const a=-mu/(2*e);
  return {host,bound:true,a,period:2*Math.PI*Math.sqrt(a*a*a/mu)};
}

/* ============================ render pipeline ============================ */
/* Everything is drawn into a small buffer and blown up with nearest-neighbour.
   That is what makes it pixel art, and it makes a few thousand particles cheap
   because each one is a one- or two-pixel rect at buffer scale. */
const view = document.getElementById('c');
const vctx = view.getContext('2d');
const buf = document.createElement('canvas');
const ctx = buf.getContext('2d');
let W=0, H=0, PIX=3;

function resize(){
  const cw = view.clientWidth, ch = view.clientHeight;
  /* aim for a buffer around 560px wide: chunky enough to read as pixel art,
     fine enough that a planet still has real terrain on it */
  PIX = Math.max(2, Math.min(5, Math.round(cw/560)));
  W = Math.max(200, Math.round(cw/PIX));
  H = Math.max(150, Math.round(ch/PIX));
  buf.width=W; buf.height=H;
  view.width=Math.round(cw*Math.min(devicePixelRatio||1,2));
  view.height=Math.round(ch*Math.min(devicePixelRatio||1,2));
  vctx.imageSmoothingEnabled=false;
  ctx.imageSmoothingEnabled=false;
  seedSky();
}
addEventListener('resize', resize);

const toScreenX = wx => (wx-cam.x)*cam.zoom + W/2;
const toScreenY = wy => (wy-cam.y)*cam.zoom + H/2;
const toWorldX  = sx => (sx-W/2)/cam.zoom + cam.x;
const toWorldY  = sy => (sy-H/2)/cam.zoom + cam.y;
/* pointer coords arrive in CSS pixels; the sim thinks in buffer pixels */
const cssToBuf = v => v/PIX;

function zoomAt(sx,sy,factor){
  const wx=toWorldX(sx), wy=toWorldY(sy);
  cam.zoom=Math.max(0.01,Math.min(22,cam.zoom*factor));
  cam.x=wx-(sx-W/2)/cam.zoom;
  cam.y=wy-(sy-H/2)/cam.zoom;
}
function fitAll(pad){
  if(!bodies.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const b of bodies){
    x0=Math.min(x0,b.x-b.r); y0=Math.min(y0,b.y-b.r);
    x1=Math.max(x1,b.x+b.r); y1=Math.max(y1,b.y+b.r);
  }
  const w=Math.max(30,x1-x0), h=Math.max(30,y1-y0);
  cam.x=(x0+x1)/2; cam.y=(y0+y1)/2;
  cam.zoom=Math.max(0.01,Math.min(22,Math.min(W/w,H/h)*(pad||0.8)));
  following=null;
}

/* ============================ deep sky ============================ */
/* Background only: nebula wash, a couple of galaxies and a few hundred stars.
   None of it is in the simulation — it exists to make the dark feel deep. */
let stars=[], sky=null;
function seedSky(){
  let s=20240;
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  stars=[];
  const n=Math.round(W*H/900);
  for(let i=0;i<n;i++){
    const layer=i%3;
    stars.push({
      x:rnd(), y:rnd(),
      z:[0.05,0.11,0.2][layer],
      /* most of the field is faint; a handful are bright enough to notice */
      b:[0.13,0.24,0.42][layer]*(0.35+rnd()*0.9),
      tw: rnd()<0.18 ? 0.6+rnd()*2.2 : 0,
      ph: rnd()*6.283,
      c: rnd()
    });
  }
  /* the nebula and galaxies are painted once and blitted with parallax */
  sky=document.createElement('canvas');
  sky.width=Math.round(W*1.5); sky.height=Math.round(H*1.5);
  const g=sky.getContext('2d');
  g.fillStyle='rgba(0,0,0,0)'; g.fillRect(0,0,sky.width,sky.height);
  const clouds=[
    [0.24,0.28,0.55,'rgba(124,54,190,0.30)'],
    [0.72,0.34,0.46,'rgba(52,58,190,0.24)'],
    [0.52,0.76,0.60,'rgba(168,44,148,0.20)'],
    [0.12,0.80,0.38,'rgba(70,32,150,0.24)'],
    [0.88,0.74,0.34,'rgba(96,40,176,0.18)']
  ];
  for(const [cx,cy,rr,col] of clouds){
    const R=sky.width*rr;
    const grad=g.createRadialGradient(sky.width*cx,sky.height*cy,0,sky.width*cx,sky.height*cy,R);
    grad.addColorStop(0,col); grad.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grad; g.fillRect(0,0,sky.width,sky.height);
  }
  drawGalaxy(g, sky.width*0.30, sky.height*0.30, sky.width*0.11, -0.5, rnd);
  drawGalaxy(g, sky.width*0.78, sky.height*0.70, sky.width*0.075, 1.1, rnd);
}
/* A spiral rendered as scattered dots — cheap, and at pixel scale it reads far
   better than a smooth gradient would. */
function drawGalaxy(g,cx,cy,R,rot,rnd){
  g.save(); g.translate(cx,cy); g.rotate(rot); g.scale(1,0.42);
  const core=g.createRadialGradient(0,0,0,0,0,R*0.55);
  core.addColorStop(0,'rgba(255,238,210,0.75)');
  core.addColorStop(0.35,'rgba(232,178,255,0.30)');
  core.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=core; g.beginPath(); g.arc(0,0,R*0.55,0,6.283); g.fill();
  for(let arm=0;arm<2;arm++){
    for(let i=0;i<520;i++){
      const t=i/520;
      const a=arm*Math.PI + t*3.0 + (rnd()-0.5)*0.30;
      const rad=R*(0.12+t*0.95) + (rnd()-0.5)*R*0.13;
      const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
      const al=(1-t)*0.5*(0.35+rnd()*0.75);
      g.fillStyle = rnd()<0.28 ? `rgba(190,208,255,${al})` : `rgba(255,226,236,${al})`;
      g.fillRect(x,y,1,1);
    }
  }
  g.restore();
}
function drawSky(t){
  ctx.fillStyle='#0a0616';
  ctx.fillRect(0,0,W,H);
  /* nebula and galaxies drift a fraction of the camera: the parallax is what
     makes the backdrop feel far away */
  const px=-cam.x*0.02*cam.zoom, py=-cam.y*0.02*cam.zoom;
  const ox=((px % sky.width)+sky.width)%sky.width - (sky.width-W)/2;
  const oy=((py % sky.height)+sky.height)%sky.height - (sky.height-H)/2;
  ctx.globalAlpha=0.85;
  for(let gx=-1;gx<=1;gx++) for(let gy=-1;gy<=1;gy++)
    ctx.drawImage(sky, ox+gx*sky.width, oy+gy*sky.height);
  ctx.globalAlpha=1;

  for(const st of stars){
    let sx=(st.x*W - cam.x*st.z*cam.zoom)%W; if(sx<0) sx+=W;
    let sy=(st.y*H - cam.y*st.z*cam.zoom)%H; if(sy<0) sy+=H;
    let b=st.b;
    if(st.tw) b *= 0.45+0.55*(0.5+0.5*Math.sin(t*st.tw+st.ph));
    if(b<0.03) continue;
    /* a faint blue-white spread, warmer for a few, so the field is not uniform */
    ctx.fillStyle = st.c<0.72 ? `rgba(226,232,255,${b})`
                  : st.c<0.9  ? `rgba(255,226,206,${b})`
                              : `rgba(198,214,255,${b})`;
    ctx.fillRect(sx|0, sy|0, 1, 1);
  }
}

/* ============================ drawing bodies ============================ */
function drawTrails(){
  for(const b of bodies){
    const t=b.trail;
    if(t.length<4) continue;
    const pal=(PALETTES[b.spec.pal]||PALETTES.terran).ramp;
    const c=pal[pal.length-2];
    ctx.lineWidth=1;
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},0.16)`;
    ctx.beginPath();
    ctx.moveTo(toScreenX(t[0]),toScreenY(t[1]));
    for(let i=2;i<t.length;i+=2) ctx.lineTo(toScreenX(t[i]),toScreenY(t[i+1]));
    ctx.stroke();
    const half=Math.max(0,(t.length>>2)*2);
    if(t.length-half>=4){
      ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},0.45)`;
      ctx.beginPath();
      ctx.moveTo(toScreenX(t[half]),toScreenY(t[half+1]));
      for(let i=half+2;i<t.length;i+=2) ctx.lineTo(toScreenX(t[i]),toScreenY(t[i+1]));
      ctx.stroke();
    }
  }
}
/* Gas is drawn as a density field rather than as a heap of translucent
   squares. Every mote lays down a soft puff of optical depth, and what you see
   is how much of it is stacked along the line of sight: alpha = 1-exp(-kd),
   which is Beer-Lambert, the same law that decides how thick a real cloud
   looks. Thin edges are wispy, deep cores go solid, and the shading between
   them comes from where the gas actually is rather than from anything drawn.
   The buffer is already only a few hundred pixels across, so it stays as
   chunky as everything else. */
let gField=null, gFW=0, gFH=0;
let GAS_K = 22;          /* how opaque a unit of column density is */
/* Depth is banded rather than smooth. A cloud rendered continuously comes out
   as soft round blobs, which is the one thing this is not allowed to look
