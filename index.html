   like; stepping the opacity gives the flat shaded bands that read as pixel
   art, and it is the density doing the shading either way. */
const GAS_BANDS = 6;
function drawGas(z, ox, oy){
  let any=false;
  for(let i=0;i<parts.length;i++) if(parts[i].kind==='gas'){ any=true; break; }
  if(!any) return false;
  if(!gField || gFW!==W || gFH!==H){ gField=new Float32Array(W*H*4); gFW=W; gFH=H; }
  const f=gField;
  /* only the touched box is cleared and composited, so a wisp in one corner
     does not cost a full-screen pass */
  let bx0=W, by0=H, bx1=0, by1=0, hit=false;
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(p.kind!=='gas') continue;
    const x=p.x*z+ox, y=p.y*z+oy;
    let rad=(p.puff+p.spread*p.age)*z;
    if(rad<0.7) rad=0.7; else if(rad>22) rad=22;
    const x0=Math.max(0,Math.floor(x-rad)), x1=Math.min(W-1,Math.ceil(x+rad));
    const y0=Math.max(0,Math.floor(y-rad)), y1=Math.min(H-1,Math.ceil(y+rad));
    if(x1<x0||y1<y0) continue;
    if(!hit){ hit=true; }
    if(x0<bx0)bx0=x0; if(y0<by0)by0=y0; if(x1>bx1)bx1=x1; if(y1>by1)by1=y1;
    /* thinning with age, and spread thinner the wider the puff has grown */
    const fade=1-p.age/p.life;
    const amp=p.dep*(0.25+fade*0.75)/(rad*rad);
    const inv=1/(rad*rad);
    for(let yy=y0;yy<=y1;yy++){
      const dy=yy+0.5-y;
      let idx=(yy*W+x0)<<2;
      for(let xx=x0;xx<=x1;xx++, idx+=4){
        const dx=xx+0.5-x;
        const q=1-(dx*dx+dy*dy)*inv;
        if(q<=0) continue;
        const w=amp*q*q;
        f[idx]+=p.r*w; f[idx+1]+=p.g*w; f[idx+2]+=p.b*w; f[idx+3]+=w;
      }
    }
  }
  if(!hit) return false;
  const img=partsLayer('gas');
  const d=pImg2.data;
  for(let yy=by0;yy<=by1;yy++){
    let idx=(yy*W+bx0)<<2;
    for(let xx=bx0;xx<=bx1;xx++, idx+=4){
      const dep=f[idx+3];
      if(dep<=1e-4){ d[idx+3]=0; f[idx]=f[idx+1]=f[idx+2]=f[idx+3]=0; continue; }
      const inv=1/dep;
      d[idx]  = f[idx]*inv;
      d[idx+1]= f[idx+1]*inv;
      d[idx+2]= f[idx+2]*inv;
      const al=1-Math.exp(-GAS_K*dep);
      d[idx+3]= 255*Math.ceil(al*GAS_BANDS)/GAS_BANDS;
      f[idx]=f[idx+1]=f[idx+2]=f[idx+3]=0;
    }
  }
  gCtx.clearRect(bx0,by0,bx1-bx0+1,by1-by0+1);
  gCtx.putImageData(pImg2, 0,0, bx0,by0, bx1-bx0+1, by1-by0+1);
  ctx.drawImage(gLayer, bx0,by0, bx1-bx0+1,by1-by0+1, bx0,by0, bx1-bx0+1,by1-by0+1);
  return true;
}

/* Debris is drawn by hand into a pixel buffer rather than with one fillRect per
   mote. At sixty thousand particles the canvas call overhead alone was costing
   more than the whole physics step, and a straight additive accumulate into a
   Uint8ClampedArray is both faster and exactly the blend we wanted anyway
   (the clamped array saturates at 255 for free). */
let pLayer=null, pCtx=null, pImg=null, pData=null;
let gLayer=null, gCtx=null, pImg2=null;
let sLayer=null, sCtx=null, sImg=null;
function partsLayer(which){
  if(!pLayer || pLayer.width!==W || pLayer.height!==H){
    pLayer=document.createElement('canvas');
    pLayer.width=W; pLayer.height=H;
    pCtx=pLayer.getContext('2d');
    pImg=pCtx.createImageData(W,H);
    pData=pImg.data;
    gLayer=document.createElement('canvas');
    gLayer.width=W; gLayer.height=H;
    gCtx=gLayer.getContext('2d');
    pImg2=gCtx.createImageData(W,H);
    sLayer=document.createElement('canvas');
    sLayer.width=W; sLayer.height=H;
    sCtx=sLayer.getContext('2d');
    sImg=sCtx.createImageData(W,H);
  }
  return which==='gas' ? pImg2 : which==='solid' ? sImg.data : pData;
}
function drawParts(){
  if(!parts.length) return;
  const z = cam.zoom, ox = W/2 - cam.x*z, oy = H/2 - cam.y*z;
  /* clouds first: they sit behind the rock they were thrown out with */
  drawGas(z, ox, oy);

  /* Two passes over the rock, because there are two different things here.
     A crumbled world is solid material: it is opaque, and stacking it up must
     not make it brighter or a melt turns into one white smear with none of the
     two worlds' colours left in it. Loose debris is the other thing — sparse,
     glowing, and genuinely additive where it piles up. */
  const solid = partsLayer('solid');
  const loose = partsLayer('loose');
  solid.fill(0); loose.fill(0);
  let anySolid=false, anyLoose=false;

  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(p.kind==='gas') continue;
    const x=(p.x*z+ox)|0, y=(p.y*z+oy)|0;
    if(x<-4||x>W+4||y<-4||y>H+4) continue;
    const fade=1-p.age/p.life;
    /* the same white-hot -> orange -> own-colour ramp as heatColor, inlined
       so a busy frame is not allocating three arrays per particle */
    const h=p.heat;
    let cr=p.r, cg=p.g, cb=p.b;
    if(h>0){
      /* Dull red -> orange -> yellow-white with temperature. The hue is the
         heat's; what the rock is made of comes through as how light or dark
         each patch of it is, which is how lava actually reads — and it is what
         lets you still see two different worlds folded into one melt. Tinting
         the rock towards orange instead just turns everything to sand, because
         rock and orange have nearly the same green in them. */
      let hr,hg,hb,t;
      if(h<0.5){ t=h/0.5;        hr=170+85*t;  hg=40+80*t;   hb=10+10*t; }
      else     { t=(h-0.5)/0.5;  hr=255;       hg=120+100*t; hb=20+130*t; }
      const lum=(0.3*cr+0.6*cg+0.1*cb)/255;
      const sh=0.55+0.5*lum;
      hr*=sh; hg*=sh; hb*=sh;
      let k=h*1.1; if(k>0.9) k=0.9; else if(k<0) k=0;
      cr+=(hr-cr)*k; cg+=(hg-cg)*k; cb+=(hb-cb)*k;
    }
    /* A mote of a crumbled world stands for a patch of it that big. Drawing it
       one pixel wide turns a solid thing into a dot cloud the moment you zoom
       in, so it is drawn at the size it actually occupies. */
    const rubble = p.cell>0;
    const s = rubble ? Math.max(1, Math.ceil(p.cell*z)) : p.size;
    let x0=x<0?0:x, y0=y<0?0:y;
    const x1=x+s>W?W:x+s, y1=y+s>H?H:y+s;
    if(x1<=x0||y1<=y0) continue;

    if(rubble){
      anySolid=true;
      for(let yy=y0;yy<y1;yy++){
        let idx=(yy*W+x0)<<2;
        for(let xx=x0;xx<x1;xx++){
          solid[idx]=cr; solid[idx+1]=cg; solid[idx+2]=cb; solid[idx+3]=255;
          idx+=4;
        }
      }
      /* and hot material gives off light as well as sitting there. Solid on
         its own is rock; solid plus what it is radiating is lava. */
      if(h>0.55){
        anyLoose=true;
        const e=(h-0.55)*0.5;
        const ir=cr*e, ig=cg*e, ib=cb*e;
        for(let yy=y0;yy<y1;yy++){
          let idx=(yy*W+x0)<<2;
          for(let xx=x0;xx<x1;xx++){
            loose[idx]+=ir; loose[idx+1]+=ig; loose[idx+2]+=ib; loose[idx+3]=255;
            idx+=4;
          }
        }
      }
    } else {
      anyLoose=true;
      /* settled debris holds its brightness; strays fade as they age */
      const a = p.settled ? 0.85 : 0.35+fade*0.6;
      const ir=cr*a, ig=cg*a, ib=cb*a;
      for(let yy=y0;yy<y1;yy++){
        let idx=(yy*W+x0)<<2;
        for(let xx=x0;xx<x1;xx++){
          loose[idx]+=ir; loose[idx+1]+=ig; loose[idx+2]+=ib; loose[idx+3]=255;
          idx+=4;
        }
      }
    }
  }
  if(anySolid){
    sCtx.putImageData(sImg,0,0);
    ctx.drawImage(sLayer,0,0);
  }
  if(anyLoose){
    pCtx.putImageData(pImg,0,0);
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(pLayer,0,0);
    ctx.globalCompositeOperation='source-over';
  }
}
function drawWaves(){
  ctx.globalCompositeOperation='lighter';
  for(const w of waves){
    const x=toScreenX(w.x), y=toScreenY(w.y), r=w.r*cam.zoom;
    if(r<1||x+r<0||x-r>W||y+r<0||y-r>H) continue;
    const fade=1-w.r/w.maxR;
    const c=w.rgb;
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${(0.55*fade*fade).toFixed(3)})`;
    ctx.lineWidth=Math.max(1,2*fade);
    ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.stroke();
    /* a second, softer front just behind gives it thickness */
    if(r>3){
      ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${(0.22*fade).toFixed(3)})`;
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(x,y,r*0.86,0,6.283); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
}
function glowRect(x,y,R,col,alpha){
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(x,y,0,x,y,R);
  g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${alpha})`);
  g.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
  ctx.fillStyle=g;
  ctx.fillRect(x-R,y-R,R*2,R*2);
  ctx.globalCompositeOperation='source-over';
}
function drawBody(b){
  const x=toScreenX(b.x), y=toScreenY(b.y);
  const r=b.r*cam.zoom;
  if(x<-r-90||x>W+r+90||y<-r-90||y>H+r+90) return;
  const pal=(PALETTES[b.spec.pal]||PALETTES.terran).ramp;

  if(b.hole){
    glowRect(x,y,Math.max(6,Math.min(r*4.5,80)),[150,110,255],0.5);
    ctx.fillStyle='#05030c';
    fillDisc(x,y,Math.max(1,r));
    ctx.strokeStyle='rgba(198,170,255,.9)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y,Math.max(1.5,r),0,6.283); ctx.stroke();
    return;
  }
  /* a comet grows a tail pointing away from whatever is lighting it */
  if(b.comet) drawTail(b,x,y,r,pal);

  if(b.lum) glowRect(x,y,Math.max(8,Math.min(r*3.2,110)),pal[pal.length-2],0.45);
  else if(b.heat>0.05) glowRect(x,y,Math.max(4,Math.min(r*(1.6+b.heat*2.2),70)),[255,140,60],0.16+b.heat*0.4);

  /* the sprite is baked at roughly one sprite pixel per buffer pixel, bucketed
     so it is not regenerated every frame as you zoom */
  const want=Math.max(3,Math.min(96,Math.round(r*2)));
  const res=Math.max(4,Math.min(96,Math.ceil(want/6)*6));
  const sp=makeSprite(b.spec,res);
  const d=Math.max(1,Math.round(r*2));
  if(b.stretch>0.02){
    /* The equilibrium figure of a body in a tidal field: prolate, pointed at
       whatever is raising the tide. Bounded by the same number that decides
       disruption, so it can never draw a needle — past 1 it is not a body to
       draw at all, it is rubble, and rubble draws itself. */
    /* Past 1 it is on its way apart but has not finished flowing yet, and it
       goes on visibly drawing out while that happens — so the figure is not
       clamped at the limit, only at something a body could still be. */
    const k=Math.min(2.2,b.stretch);
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(b.tideAng);
    ctx.scale(1+k*0.35, 1/(1+k*0.22));
    ctx.drawImage(sp, -d/2, -d/2, d, d);
    ctx.restore();
  } else {
    ctx.drawImage(sp, Math.round(x-d/2), Math.round(y-d/2), d, d);
  }

  /* molten skin over the top while it is still hot */
  if(!b.lum && b.heat>0.02 && d>2){
    ctx.globalAlpha=Math.min(0.72,b.heat*0.8);
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgb(${(200*b.heat)|0},${(70*b.heat)|0},${(20*b.heat)|0})`;
    fillDisc(x,y,Math.max(1,r));
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  if(b.flash>0) glowRect(x,y,Math.max(6,Math.min(r*(3+b.flash*8),140)),[255,240,220],b.flash*0.7);
}
/* a filled circle drawn on the pixel grid, so it keeps a stepped edge */
function fillDisc(cx,cy,r){
  const r2=r*r, x0=Math.floor(cx-r), x1=Math.ceil(cx+r), y0=Math.floor(cy-r), y1=Math.ceil(cy+r);
  for(let y=y0;y<=y1;y++){
    const dy=y+0.5-cy, w2=r2-dy*dy;
    if(w2<=0) continue;
    const w=Math.sqrt(w2);
    ctx.fillRect(Math.round(cx-w), y, Math.max(1,Math.round(w*2)), 1);
  }
}
function drawTail(b,x,y,r,pal){
  const host=dominant(b.x,b.y,b);
  if(!host||!host.lum) return;
  const dx=b.x-host.x, dy=b.y-host.y, d=Math.max(0.001,Math.hypot(dx,dy));
  const len=Math.max(8,Math.min(120,4000/d))*cam.zoom*0.5+r*4;
  const ux=dx/d, uy=dy/d;
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<44;i++){
    const t=i/44;
    const sp=(Math.random()-0.5)*len*0.16*t;
    const px=x+ux*len*t - uy*sp, py=y+uy*len*t + ux*sp;
    ctx.fillStyle=`rgba(190,226,255,${(1-t)*0.30})`;
    ctx.fillRect(px|0,py|0,1,1);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawSelection(b){
  const x=toScreenX(b.x)|0, y=toScreenY(b.y)|0, r=Math.max(4,b.r*cam.zoom)+4;
  ctx.strokeStyle='rgba(198,155,255,.95)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.arc(x+0.5,y+0.5,r,0,6.283); ctx.stroke();
  ctx.setLineDash([]);
}

function render(t){
  drawSky(t);
  if(showTrails) drawTrails();
  drawParts();
  drawWaves();
  for(const b of bodies) drawBody(b);
  if(aim.active) drawAim();
  if(selected) drawSelection(selected);
  /* blow the buffer up to the screen with hard pixel edges */
  vctx.imageSmoothingEnabled=false;
  vctx.clearRect(0,0,view.width,view.height);
  vctx.drawImage(buf,0,0,W,H,0,0,view.width,view.height);
}

/* ============================ the brush ============================ */
/* What a drag will create. The forge edits this directly. */
const brush = {cls:'rock', pal:'terran', seed:12345, mass:22, dens:0, name:'Rocky world', comet:0, hole:0};
function brushSpec(){
  return {cls:brush.cls, pal:brush.pal, seed:brush.seed,
          dens:brush.dens||undefined, comet:brush.comet, hole:brush.hole, name:brush.name};
}
function brushRadius(){ return radiusFor(brush.mass, brush.dens || densityOf(brushSpec())); }

/* ============================ aiming ============================ */
const aim={active:false,x:0,y:0,dx:0,dy:0,path:[],hit:null};
const VEL_SCALE=0.055;
/* A massless probe through the frozen field, so you can see where the throw
   actually goes instead of guessing. */
function predict(x,y,vx,vy){
  const pts=[x,y];
  const dt=0.9/SUBSTEPS;
  let px=x,py=y,pvx=vx,pvy=vy;
  for(let s=0;s<900;s++){
    let ax=0,ay=0;
    for(let i=0;i<bodies.length;i++){
      const b=bodies[i];
      const ddx=b.x-px, ddy=b.y-py;
      const d2=ddx*ddx+ddy*ddy+SOFT*SOFT;
      const inv=1/Math.sqrt(d2);
      const f=G*b.m*inv*inv*inv;
      ax+=f*ddx; ay+=f*ddy;
      if(d2<b.r*b.r) return {pts,hit:b};
    }
    pvx+=ax*dt; pvy+=ay*dt; px+=pvx*dt; py+=pvy*dt;
    if(s%3===0) pts.push(px,py);
  }
  return {pts,hit:null};
}
function drawAim(){
  const sx=toScreenX(aim.x), sy=toScreenY(aim.y);
  if(aim.path.length>3){
    ctx.strokeStyle=aim.hit?'rgba(255,150,120,.85)':'rgba(198,155,255,.8)';
    ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath();
    ctx.moveTo(toScreenX(aim.path[0]),toScreenY(aim.path[1]));
    for(let i=2;i<aim.path.length;i+=2) ctx.lineTo(toScreenX(aim.path[i]),toScreenY(aim.path[i+1]));
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.strokeStyle='rgba(255,255,255,.55)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+aim.dx*cam.zoom, sy+aim.dy*cam.zoom); ctx.stroke();
  const d=Math.max(2,Math.round(brushRadius()*cam.zoom*2));
  ctx.globalAlpha=.9;
  ctx.drawImage(makeSprite(brushSpec(), Math.max(4,Math.min(96,Math.ceil(d/6)*6))),
                Math.round(sx-d/2), Math.round(sy-d/2), d, d);
  ctx.globalAlpha=1;
}
function updateAim(){
  const drag=Math.hypot(aim.dx,aim.dy)*cam.zoom;
  let vx=aim.dx*VEL_SCALE, vy=aim.dy*VEL_SCALE;
  if(drag<6&&orbitAssist){
    const host=dominant(aim.x,aim.y,null);
    if(host){ const v=circularVelocity(aim.x,aim.y,host,systemSpin(host)); vx=v.vx; vy=v.vy; }
  }
  const res=predict(aim.x,aim.y,vx,vy);
  aim.path=res.pts; aim.hit=res.hit;
}
function systemSpin(host){
  let L=0;
  for(const b of bodies){
    if(b===host) continue;
    const dx=b.x-host.x, dy=b.y-host.y;
    L+=b.m*(dx*(b.vy-host.vy)-dy*(b.vx-host.vx));
  }
  return L<0?-1:1;
}

/* ============================ holding a world ============================ */
/* Grab one and it stops being the sim's to move: it follows the cursor, and
   what it is doing when you let go is what it carries away. */
let held=null;
/* The clock does not run at hand speed, so the cursor's true world velocity is
   useless as an orbital one — an unhurried sweep across the screen is a
   thousand units a second. A throw is put on the same scale a fling is, so
   flicking a world across the view sends it off about as fast as dragging a
   new one across the view would. */
const TOSS = VEL_SCALE*0.12;
function throwVel(){
  if(!held) return {vx:0,vy:0};
  /* a hand that has stopped moving is not throwing anything, whatever it was
     doing half a second ago */
  if((performance.now()-held.t)/1000 > 0.13) return {vx:0,vy:0};
  return {vx: held.cvx*TOSS, vy: held.cvy*TOSS};
}
function grabHold(b, wx, wy){
  held={b, ox:b.x-wx, oy:b.y-wy, tx:b.x, ty:b.y,
        cvx:0, cvy:0, t:performance.now()};
  b.held=true;
  following=null;
  view.style.cursor='grabbing';
}
function moveHold(wx, wy){
  if(!held) return;
  const nx=wx+held.ox, ny=wy+held.oy;
  const now=performance.now();
  /* smoothed over about a tenth of a second of real time, or one twitchy
     pointer event on the way up turns a nudge into a rocket */
  const dtr=Math.min(0.2, Math.max(0.004, (now-held.t)/1000));
  const k=1-Math.exp(-dtr/0.09);
  held.cvx += ((nx-held.tx)/dtr - held.cvx)*k;
  held.cvy += ((ny-held.ty)/dtr - held.cvy)*k;
  held.tx=nx; held.ty=ny; held.t=now;
}
function applyHold(){
  if(!held) return;
  const b=held.b;
  /* it can be eaten, merged or torn apart while you are holding it */
  if(b.dead || bodies.indexOf(b)<0){
    b.held=false; held=null;
    view.style.cursor = dragMode ? 'grab' : 'crosshair';
    return;
  }
  b.x=held.tx; b.y=held.ty;
  const v=throwVel();
  b.vx=v.vx; b.vy=v.vy;
}
function dropHold(){
  if(!held) return;
  const b=held.b, v=throwVel();
  b.held=false;
  held=null;
  view.style.cursor = dragMode ? 'grab' : 'crosshair';
  if(b.dead || bodies.indexOf(b)<0) return;
  if(!v.vx && !v.vy && orbitAssist){
    /* set down rather than thrown. Same courtesy a tap on empty space gets:
       put it in the circular orbit for where it has been left, or it simply
       drops out of the sky. */
    const host=dominant(b.x,b.y,b);
    if(host){ const c=circularVelocity(b.x,b.y,host,systemSpin(host)); v.vx=c.vx; v.vy=c.vy; }
  }
  b.vx=v.vx; b.vy=v.vy;
  b.trail.length=0;              /* the drag path is not an orbit */
  accelerate();
  for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; }
}

/* ============================ input ============================ */
const pointers=new Map();
let pinch=null, panning=null, spaceHeld=false;
function localPos(e){
  const r=view.getBoundingClientRect();
  return {x:cssToBuf(e.clientX-r.left), y:cssToBuf(e.clientY-r.top)};
}
function bodyAt(sx,sy){
  let hit=null,best=Infinity;
  for(const b of bodies){
    const d=Math.hypot(toScreenX(b.x)-sx,toScreenY(b.y)-sy);
    const grab=Math.max(6,b.r*cam.zoom+4);
    if(d<grab&&d<best){ best=d; hit=b; }
  }
  return hit;
}
view.addEventListener('pointerdown',e=>{
  try{ view.setPointerCapture(e.pointerId); }catch(_){}
  const p=localPos(e);
  pointers.set(e.pointerId,p);
  if(pointers.size===2){
    aim.active=false;
    dropHold();
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    return;
  }
  if(pointers.size>2) return;
  if(e.button===1||e.button===2||spaceHeld){
    panning={sx:p.x,sy:p.y,cx:cam.x,cy:cam.y};
    return;
  }
  const hit=bodyAt(p.x,p.y);
  if(hit){
    selectBody(hit);
    if(dragMode) grabHold(hit, toWorldX(p.x), toWorldY(p.y));
    return;
  }
  selectBody(null);
  aim.active=true; aim.x=toWorldX(p.x); aim.y=toWorldY(p.y);
  aim.dx=0; aim.dy=0; aim.path=[]; aim.hit=null;
  updateAim();
});
view.addEventListener('pointermove',e=>{
  const p=localPos(e);
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    if(pinch.d>0) zoomAt(cx,cy,d/pinch.d);
    cam.x-=(cx-pinch.cx)/cam.zoom; cam.y-=(cy-pinch.cy)/cam.zoom;
    pinch={d,cx,cy}; following=null;
    return;
  }
  if(panning){
    cam.x=panning.cx-(p.x-panning.sx)/cam.zoom;
    cam.y=panning.cy-(p.y-panning.sy)/cam.zoom;
    following=null; return;
  }
  if(held){ moveHold(toWorldX(p.x), toWorldY(p.y)); return; }
  if(aim.active){ aim.dx=toWorldX(p.x)-aim.x; aim.dy=toWorldY(p.y)-aim.y; updateAim(); }
});
function endPointer(e){
  const had=pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(!had) return;
  if(panning){ panning=null; return; }
  if(held){ dropHold(); return; }
  if(!aim.active) return;
  aim.active=false;
  const drag=Math.hypot(aim.dx,aim.dy)*cam.zoom;
  let vx,vy;
  if(drag<6&&orbitAssist){
    const host=dominant(aim.x,aim.y,null);
    if(host){ const v=circularVelocity(aim.x,aim.y,host,systemSpin(host)); vx=v.vx; vy=v.vy; }
    else { vx=0; vy=0; }
  } else { vx=aim.dx*VEL_SCALE; vy=aim.dy*VEL_SCALE; }
  const b=addBody(makeBody(aim.x,aim.y,vx,vy,brushSpec(),brush.mass));
  if(b){ accelerate(); for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; } }
  hideHint();
}
view.addEventListener('pointerup',endPointer);
view.addEventListener('pointercancel',endPointer);
view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=localPos(e);
  zoomAt(p.x,p.y,Math.pow(0.9992,e.deltaY*(e.deltaMode===1?18:1)));
  following=null;
},{passive:false});

addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  const k=e.key;
  if(k===' '){ e.preventDefault(); spaceHeld=true; togglePlay(); }
  else if(k==='c'||k==='C') clearAll();
  else if(k==='t'||k==='T') setTrails(!showTrails);
  else if(k==='d'||k==='D') setDragMode(!dragMode);
  else if(k==='f'||k==='F') fitAll();
  else if(k==='g'||k==='G') toggleForge();
  else if(k==='Escape') selectBody(null);
  else if((k==='Backspace'||k==='Delete')&&selected) deleteSelected();
  else if(k>='1'&&k<='9'){ const kk=KINDS[+k-1]; if(kk) pickKind(kk.id); }
});
addEventListener('keyup',e=>{ if(e.key===' ') spaceHeld=false; });

/* ============================ presets ============================ */
function ringOf(host,count,rMin,rMax,kindId,spin){
  const k=kindById(kindId);
  for(let i=0;i<count;i++){
    const t=count===1?0.5:i/(count-1);
    const r=rMin+(rMax-rMin)*(t+(Math.random()-0.5)*0.06);
    const a=Math.random()*Math.PI*2;
    const x=host.x+Math.cos(a)*r, y=host.y+Math.sin(a)*r;
    const v=circularVelocity(x,y,host,spin||1);
    addBody(makeBody(x,y,v.vx*(1+(Math.random()-0.5)*0.02),v.vy,specFromKind(k),k.mass));
  }
}
function place(kindId,x,y,vx,vy,mass){
  const k=kindById(kindId);
  return addBody(makeBody(x,y,vx,vy,specFromKind(k),mass===undefined?k.mass:mass));
}
const PRESETS={
  solar(){
    const sun=place('star',0,0,0,0);
    [['moon',110],['dwarfp',155],['rocky',210],['iceworld',275],['gas',350],['icegiant',440],['comet',545]]
      .forEach(([id,r])=>{
        const a=Math.random()*6.283, x=Math.cos(a)*r, y=Math.sin(a)*r;
        const v=circularVelocity(x,y,sun,1);
        const p=place(id,x,y,v.vx,v.vy);
        if((id==='gas'||id==='icegiant')&&p) ringOf(p,26,p.r+3,p.r+8,'asteroid',1);
      });
    ringOf(sun,55,232,264,'asteroid',1);
  },
  binary(){
    const d=150, m=kindById('star').mass;
    const v=Math.sqrt(G*m/(2*d));
    place('star',-d/2,0,0,-v); place('star',d/2,0,0,v);
    const centre={x:0,y:0,vx:0,vy:0,m:m*2};
    for(let i=0;i<6;i++){
      const r=430+i*130, a=Math.random()*6.283;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      const vel=circularVelocity(x,y,centre,1);
      place(i%3===0?'gas':'rocky',x,y,vel.vx,vel.vy);
    }
  },
  /* Two worlds on a collision course, which is the whole point of the melt. */
  smash(){
    place('rocky',-190,0,7.5,0);
    place('rocky', 190,0,-7.5,0);
    place('gas',0,-460,4.2,0);
    place('icegiant',0,470,-4.0,0);
  },
  cluster(){
    for(let i=0;i<130;i++){
      const a=Math.random()*6.283, r=Math.sqrt(Math.random())*420;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      const roll=Math.random();
      place(roll<0.12?'rocky':roll<0.4?'moon':'asteroid',
            x,y,-y*0.004+(Math.random()-0.5)*1.2, x*0.004+(Math.random()-0.5)*1.2);
    }
    place('hole',0,0,0,0);
  }
};
function loadPreset(n){
  held=null;
  bodies=[]; parts=[]; waves=[]; selected=null; following=null;
  (PRESETS[n]||PRESETS.solar)();
  accelerate();
  for(const b of bodies){ b.ax=b.nax; b.ay=b.nay; }
  fitAll(); hideHint();
}

/* ============================ ui ============================ */
const $=id=>document.getElementById(id);
const elStat=$('stat'), elPlay=$('play'), elHint=$('hint');
let currentKindId='rocky';

function pickKind(id){
  const k=kindById(id);
  currentKindId=id;
  brush.cls=k.cls; brush.pal=k.pal; brush.mass=k.mass; brush.dens=k.dens||0;
  brush.comet=k.comet||0; brush.hole=k.hole||0; brush.name=k.name;
  brush.seed=(seedCounter++*2654435761)%100000;
  for(const el of $('bodies').children) el.classList.toggle('on',el.dataset.k===id);
  syncForge();
}
/* the palette buttons carry a tiny live sprite rather than a flat swatch */
function thumb(spec,size){
  const c=document.createElement('canvas');
  c.width=c.height=size;
  c.getContext('2d').drawImage(makeSprite(spec,size),0,0);
  return c;
}
for(const k of KINDS){
  const btn=document.createElement('button');
  btn.className='bd'; btn.dataset.k=k.id; btn.type='button';
  btn.appendChild(thumb(specFromKind(k,k.id.length*7919),18));
  const nm=document.createElement('span'); nm.className='nm'; nm.textContent=k.name;
  btn.appendChild(nm);
  btn.addEventListener('click',()=>pickKind(k.id));
  $('bodies').appendChild(btn);
}

/* ---- world forge ---- */
let forgeOpen=false;
function toggleForge(){ forgeOpen=!forgeOpen; $('forge').classList.toggle('on',forgeOpen); $('forgeBtn').classList.toggle('on',forgeOpen); if(forgeOpen) syncForge(); }
$('forgeBtn').addEventListener('click',toggleForge);
$('reroll').addEventListener('click',()=>{ brush.seed=(Math.random()*99999)|0; syncForge(); });

for(const key in CLASSES){
  const b=document.createElement('button');
  b.className='chip'; b.dataset.cls=key; b.type='button'; b.textContent=CLASSES[key].name;
  b.addEventListener('click',()=>{ brush.cls=key; brush.name=CLASSES[key].name+' world'; brush.dens=0; syncForge(); });
  $('fClass').appendChild(b);
}
for(const key of PAL_KEYS){
  const b=document.createElement('button');
  b.className='chip'; b.dataset.pal=key; b.type='button'; b.textContent=PALETTES[key].name;
  b.addEventListener('click',()=>{ brush.pal=key; syncForge(); });
  $('fPal').appendChild(b);
}
/* size and density are the two knobs that decide mass, which is the only thing
   gravity cares about */
$('fSize').addEventListener('input',syncForgeFromSliders);
$('fDens').addEventListener('input',syncForgeFromSliders);
/* The slider is a radius in quarter-units; mass falls out of it and density,
   because mass is the only thing gravity actually reads. */
function syncForgeFromSliders(){
  const size=+$('fSize').value, dens=+$('fDens').value;
  brush.dens=dens;
  brush.mass=Math.max(0.02, massFor(size/4, dens));
  syncForge(true);
}
function syncForge(skipSliders){
  const spec=brushSpec();
  const prev=$('fPrev');
  prev.width=prev.height=48;
  prev.getContext('2d').clearRect(0,0,48,48);
  prev.getContext('2d').drawImage(makeSprite(spec,48),0,0);
  $('fName').textContent=brush.name;
  $('fMass').textContent='mass '+fmt(brush.mass,brush.mass<10?2:0);
  $('fRad').textContent='radius '+brushRadius().toFixed(2);
  for(const el of $('fClass').children) el.classList.toggle('on',el.dataset.cls===brush.cls);
  for(const el of $('fPal').children) el.classList.toggle('on',el.dataset.pal===brush.pal);
  if(!skipSliders){
    const dens=brush.dens||densityOf(spec);
    $('fDens').value=Math.max(5,Math.min(3000,dens));
    $('fSize').value=Math.max(4,Math.min(600,Math.round(radiusFor(brush.mass,dens)*4)));
  }
}

function togglePlay(){ running=!running; elPlay.textContent=running?'Pause':'Play'; }
elPlay.addEventListener('click',togglePlay);
function clearAll(){ held=null; lastSettle=null; bodies=[]; parts=[]; waves=[]; blobs=[]; selected=null; following=null; selectBody(null); }
$('reset').addEventListener('click',clearAll);
$('fit').addEventListener('click',()=>fitAll());
function setTrails(v){ showTrails=v; $('trails').classList.toggle('on',v); if(!v) for(const b of bodies) b.trail.length=0; }
$('trails').addEventListener('click',()=>setTrails(!showTrails));
$('orbitAssist').addEventListener('click',()=>{ orbitAssist=!orbitAssist; $('orbitAssist').classList.toggle('on',orbitAssist); });
function setDragMode(v){
  dragMode=v;
  $('dragBtn').classList.toggle('on',v);
  view.style.cursor = v ? 'grab' : 'crosshair';
  if(!v) dropHold();
}
$('dragBtn').addEventListener('click',()=>setDragMode(!dragMode));
setTrails(true); $('orbitAssist').classList.add('on');
$('speed').addEventListener('input',e=>{
  const t=+e.target.value/60;
  timeScale=t<=0?0:Math.pow(t,2.6)*60;
  $('speedv').innerHTML=timeScale.toFixed(timeScale<1?2:1)+'&times;';
});
$('speed').dispatchEvent(new Event('input'));

/* Debris ceiling. Low settings are there for older tablets; the top of the
   range will happily bury a desktop in rubble, which is rather the point. */
const DEBRIS_STEPS = [2000,5000,10000,20000,35000,50000,60000,100000,200000];
$('debris').addEventListener('input',e=>{
  MAX_PARTS = DEBRIS_STEPS[+e.target.value] || 60000;
  $('debrisv').textContent = MAX_PARTS>=1000 ? Math.round(MAX_PARTS/1000)+'k' : MAX_PARTS;
  /* dropping the ceiling should take effect now, not whenever the oldest
     motes happen to age out */
  if(parts.length>MAX_PARTS) parts.splice(0, parts.length-MAX_PARTS);
  evictPtr = 0;
});
$('debris').dispatchEvent(new Event('input'));
for(const el of document.querySelectorAll('[data-preset]'))
  el.addEventListener('click',()=>loadPreset(el.dataset.preset));

function selectBody(b){
  selected=b;
  $('insp').classList.toggle('on',!!b);
  if(b){
    $('ispName').textContent=b.name;
    const ic=$('ispIcon'); ic.width=ic.height=16;
    ic.getContext('2d').clearRect(0,0,16,16);
    ic.getContext('2d').drawImage(makeSprite(b.spec,16),0,0);
  }
}
$('ispFollow').addEventListener('click',()=>{
  following = following===selected ? null : selected;
  $('ispFollow').classList.toggle('on',!!following);
});
function deleteSelected(){
  if(!selected) return;
  if(held&&held.b===selected){ held.b.held=false; held=null; }
  bodies=bodies.filter(b=>b!==selected);
  if(following===selected) following=null;
  selectBody(null);
}
$('ispDel').addEventListener('click',deleteSelected);
function updateInspector(){
  if(!selected) return;
  $('ispMass').textContent=fmt(selected.m);
  $('ispVel').textContent=fmt(Math.hypot(selected.vx,selected.vy),2);
  const o=orbitOf(selected);
  $('ispHost').textContent=o?o.host.name:'—';
  $('ispPer').textContent=o?(o.bound?fmt(o.period,1)+'s':'escaping'):'—';
  $('ispFollow').classList.toggle('on',following===selected);
}
function fmt(v,d){
  if(!isFinite(v)) return '—';
  if(v>=1e6) return (v/1e6).toFixed(1)+'M';
  if(v>=1e3) return (v/1e3).toFixed(1)+'k';
  return v.toFixed(d===undefined?0:d);
}
let hintTimer=setTimeout(hideHint,10000);
function hideHint(){ clearTimeout(hintTimer); elHint.classList.add('gone'); }
/* The sim narrates itself the first time something new happens, and then shuts
   up about it. */
const said={};
function say(msg,ms){
  clearTimeout(hintTimer);
  elHint.textContent=msg;
  elHint.classList.remove('gone');
  hintTimer=setTimeout(hideHint, ms||5200);
}
function once(flag,msg){ if(said[flag]) return; said[flag]=1; say(msg); }

/* ============================ scripting hook ============================ */
function totalEnergy(){
  let ke=0,pe=0;
  for(let i=0;i<bodies.length;i++){
    const a=bodies[i];
    ke+=0.5*a.m*(a.vx*a.vx+a.vy*a.vy);
    for(let j=i+1;j<bodies.length;j++){
      const b=bodies[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      pe-=G*a.m*b.m/Math.sqrt(dx*dx+dy*dy+SOFT*SOFT);
    }
  }
  return ke+pe;
}
window.orbital={
  list:()=>bodies.map(b=>({id:b.id,x:b.x,y:b.y,vx:b.vx,vy:b.vy,m:b.m,r:b.r,
                           cls:b.spec.cls,pal:b.spec.pal,heat:b.heat,name:b.name,
                           hole:!!b.hole,stretch:b.stretch||0})),
  count:()=>bodies.length,
  /* where a point in the world lands on the actual page, so a test can put a
     real cursor on a real world */
  screen:(wx,wy)=>{ const r=view.getBoundingClientRect();
                    return {x:r.left+toScreenX(wx)*PIX, y:r.top+toScreenY(wy)*PIX}; },
  particles:()=>parts.length,
  waves:()=>waves.length,
  ringed:()=>parts.filter(p=>p.ring).length,
  /* the rubble clouds: how many, how heavy, and how far from round */
  clouds:()=>blobs.filter(b=>b.m>0).map(b=>{
    const own=parts.filter(p=>blobs[p.blob-1]===b);
    /* principal extents, so a test can say "this is not a circle" without
       anybody having decided in advance what shape it should be. Weighted by
       mass and taken about where the mass currently is, so it is the same
       number the settle test uses rather than a near neighbour of it — two
       worlds that have melted together do not have the same mote size. */
    let sxx=0, syy=0, sxy=0, mm=0, cx=0, cy=0;
    let hot=0, nb=0;
    for(const p of own){ cx+=p.x*p.pm; cy+=p.y*p.pm; mm+=p.pm; }
    if(mm>0){ cx/=mm; cy/=mm; } else { cx=b.x; cy=b.y; }
    for(const p of own){ const dx=p.x-cx, dy=p.y-cy;
                         sxx+=p.pm*dx*dx; syy+=p.pm*dy*dy; sxy+=p.pm*dx*dy;
                         hot+=p.heat; nb+=p.nb; }
    const n=Math.max(1,own.length);
    const w=mm>0?mm:1;
    sxx/=w; syy/=w; sxy/=w;
    const tr=sxx+syy, det=sxx*syy-sxy*sxy;
    const disc=Math.max(0, tr*tr/4-det);
    const l1=tr/2+Math.sqrt(disc), l2=tr/2-Math.sqrt(disc);
    return {x:b.x, y:b.y, m:b.m, n:own.length,
            long:Math.sqrt(Math.max(0,l1)), short:Math.sqrt(Math.max(0,l2)),
            elong: l2>1e-9 ? Math.sqrt(l1/l2) : 999,
            heat: hot/n, buried: nb/n,
            /* what is keeping it from being a world yet */
            why: b.why||'', sigma: b.sigma||0, vesc: b.vesc||0,
            spin: b.spin||0, round: b.round||0};
  }),
  debris:()=>parts.map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,kind:p.kind,ring:!!p.ring,
                           settled:!!p.settled,r:p.r,g:p.g,b:p.b,pm:p.pm,heat:p.heat})),
  settled:()=>parts.filter(p=>p.settled).length,
  /* the shape and the temperature of the last cloud that became a world, at
     the moment it did */
  lastSettle:()=>lastSettle && Object.assign({},lastSettle),
  add:(x,y,vx,vy,kindId,mass)=>{
    const b=place(kindId||'rocky',x,y,vx,vy,mass);
    if(b){ accelerate(); for(const q of bodies){ q.ax=q.nax; q.ay=q.nay; } }
    return b?b.id:null;
  },
  clear:()=>clearAll(),
  /* picking a world up, for a test that would rather not synthesise pointer
     events at particular pixels */
  drag:v=>setDragMode(!!v),
  holding:()=>held?held.b.id:null,
  grab:id=>{ const b=bodies.find(x=>x.id===id); if(b) grabHold(b,b.x,b.y); return !!b; },
  moveTo:(x,y)=>moveHold(x,y),
  drop:()=>dropHold(),
  /* spray debris directly — handy for a test, and for anyone who wants to
     build a ring by hand rather than by wrecking a moon */
  spray:(x,y,vx,vy,n,spread,jitter)=>{
    for(let i=0;i<n;i++){
      const a=Math.random()*6.283, sp=(spread||0)*Math.random();
      const jr=(jitter||0)*Math.sqrt(Math.random()), ja=Math.random()*6.283;
      spawnPart(x+Math.cos(ja)*jr, y+Math.sin(ja)*jr,
                vx+Math.cos(a)*sp, vy+Math.sin(a)*sp,
                'rock',[150,140,132],0,999);
    }
    return parts.length;
  },
  /* gas straight into the sky, for a test that needs a known amount of it */
  gas:(x,y,vx,vy,n,jitter,puff)=>{
    for(let i=0;i<n;i++){
      const ja=Math.random()*6.283, jr=(jitter||0)*Math.sqrt(Math.random());
      const q=spawnPart(x+Math.cos(ja)*jr, y+Math.sin(ja)*jr, vx, vy,
                        'gas',[210,170,255],0,999);
      if(q && puff) q.puff=puff;
    }
    return parts.length;
  },
  /* take a body apart on demand, for a test that wants rubble without having
     to arrange a black hole to make it */
  crumble:id=>{ const b=bodies.find(x=>x.id===id); if(b){ crumble(b); return true; } return false; },
  preset:n=>loadPreset(n),
  energy:totalEnergy,
  /* everything the sim is holding, bodies and motes alike */
  mass:()=>bodies.reduce((t,b)=>t+b.m,0)+parts.reduce((t,p)=>t+p.pm,0),
  momentum:()=>bodies.reduce((s,b)=>({x:s.x+b.m*b.vx,y:s.y+b.m*b.vy}),{x:0,y:0}),
  cam, aim, brush,
  step:dt=>step(dt),
  setSpeed:v=>{ timeScale=v; },
  select:id=>selectBody(bodies.find(b=>b.id===id)||null),
  sprite:(spec,res)=>makeSprite(spec,res),
  pix:()=>PIX,
  gasK:v=>{ if(v!==undefined) GAS_K=v; return GAS_K; },
  maxParts:v=>{ if(v!==undefined){ MAX_PARTS=v; if(parts.length>v) parts.splice(0,parts.length-v); evictPtr=0; } return MAX_PARTS; },
  get running(){ return running; }
};

/* ============================ loop ============================ */
let last=performance.now(), fpsAcc=0, fpsN=0, fps=60, clock=0;
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  clock+=dt;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  applyHold();
  if(running&&timeScale>0) step(dt*timeScale);
  if(following){ cam.x=following.x; cam.y=following.y; }
  render(clock);
  updateInspector();
  elStat.textContent=`${bodies.length} bodies · ${parts.length} debris · ${Math.round(fps)} fps`;
  requestAnimationFrame(frame);
}

/* ============================ boot ============================ */
resize();
pickKind('rocky');
loadPreset('solar');
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
</body>
